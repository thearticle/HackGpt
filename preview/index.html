<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HackGpt</title>
<link rel="icon" href="data:,">
<script>if (window.HackGptAndroid) document.documentElement.classList.add("android-app");</script>
<style>
:root{
  color-scheme:dark;
  --ink:#080d08;--panel:#111a0f;--line:#364e26;--lime:#baff56;--muted:#a0b38c;--paper:#e7f3da;
  --scene-top:#1c2b14;--scene-bottom:#080c08;--glow:#75b02b22;--scrim:#000a;
  --mine:#182411;--selection:#263d19;--disabled:#889578;
  --primary-bg:#baff56;--primary-text:#080d08;
  --danger:#ff665d;--warning:#ffc4b6;--danger-panel:#3b211e;--danger-line:#8b4940;
  --chat-font-size:16px;
  font-family:"Courier New",monospace;
}
:root[data-theme="light"]{
  color-scheme:light;
  --ink:#fff;--panel:#f6f9f3;--line:#a5b79a;--lime:#315c16;--muted:#4d6245;--paper:#152411;
  --scene-top:#fafff7;--scene-bottom:#e7eee3;--glow:#2e5d1e22;--scrim:#21301d66;
  --mine:#e6f4da;--selection:#e1f0d5;--disabled:#667762;
  --primary-bg:#bde98d;--primary-text:#182b0c;
  --danger:#ad3028;--warning:#8b342a;--danger-panel:#fae8e4;--danger-line:#b95d52;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at top,var(--scene-top),var(--scene-bottom) 65%);color:var(--paper)}
main{width:min(100%,414px);height:min(820px,100vh);height:min(820px,100dvh);min-height:380px;background:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 0 42px var(--glow);padding:20px;display:flex;flex-direction:column}
#composer{display:flex;align-items:stretch}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--lime);border-radius:4px;min-height:44px;padding:7px 12px;font:inherit;font-size:13px;font-weight:bold}
.send,.icon{width:44px;padding:0;font-size:20px}
header{display:flex;justify-content:space-between;align-items:center;margin-left:-12px;margin-right:-18px;transform:translateY(-12px)}
.header-actions{display:flex;align-items:center;gap:2px}
#chat-credit{min-height:30px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--lime);white-space:nowrap;font-size:11px;font-weight:normal}
#chat-credit:not(:disabled){pointer-events:auto}
.icon{display:grid;place-items:center;height:44px;line-height:1;border:0;background:transparent;font-family:"Segoe UI Symbol","Courier New",monospace}
button:disabled{cursor:default;color:var(--disabled)}
.primary{background:var(--primary-bg);color:var(--primary-text);border-color:var(--primary-bg)}
small{font-size:12px;color:var(--muted)}
#reset{color:var(--lime)}
#reset::before,#new-provider::before{
  content:"";
  width:18px;
  height:18px;
  background:linear-gradient(currentColor,currentColor) center/18px 2px no-repeat,
             linear-gradient(currentColor,currentColor) center/2px 18px no-repeat;
}
#provider::before{
  content:"";
  width:18px;
  height:18px;
  background:radial-gradient(circle,transparent 3px,currentColor 3.5px);
  clip-path:polygon(85.1% 35.5%, 87.4% 43.4%, 98.3% 41.5%, 98.3% 58.5%, 87.4% 56.6%, 85.1% 64.5%, 85.1% 64.5%, 81.1% 71.8%, 90.1% 78.1%, 78.1% 90.1%, 71.8% 81.1%, 64.5% 85.1%, 64.5% 85.1%, 56.6% 87.4%, 58.5% 98.3%, 41.5% 98.3%, 43.4% 87.4%, 35.5% 85.1%, 35.5% 85.1%, 28.2% 81.1%, 21.9% 90.1%, 9.9% 78.1%, 18.9% 71.8%, 14.9% 64.5%, 14.9% 64.5%, 12.6% 56.6%, 1.7% 58.5%, 1.7% 41.5%, 12.6% 43.4%, 14.9% 35.5%, 14.9% 35.5%, 18.9% 28.2%, 9.9% 21.9%, 21.9% 9.9%, 28.2% 18.9%, 35.5% 14.9%, 35.5% 14.9%, 43.4% 12.6%, 41.5% 1.7%, 58.5% 1.7%, 56.6% 12.6%, 64.5% 14.9%, 64.5% 14.9%, 71.8% 18.9%, 78.1% 9.9%, 90.1% 21.9%, 81.1% 28.2%, 85.1% 35.5%);
}
article small{color:var(--lime)}
#messages{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:8px 0}
h2{font-size:20px;margin:4px 0}
p{overflow-wrap:anywhere}
canvas{max-width:100%;height:auto}
article.mine{background:var(--mine);border:1px solid var(--line);border-inline-end:2px solid var(--lime);border-radius:4px 4px 0 4px;padding:12px}
article.mine>p{margin-top:0}
article p{margin:6px 0 0;white-space:pre-wrap}
#composer{margin-top:7px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
#composer{position:relative}
#composer .send{position:absolute;left:calc(50% + var(--composer-offset,0px));bottom:calc(100% + 20px);display:grid;place-items:center;width:62px;height:62px;min-height:0;padding:0;border-radius:50%;background:var(--panel);color:var(--lime);border-color:var(--line);touch-action:none;user-select:none;-webkit-touch-callout:none;visibility:hidden;opacity:0;transform:translate(-50%,8px);pointer-events:none;transition:opacity 240ms ease,transform 240ms ease,visibility 0s linear 240ms}
#composer .send.is-visible{visibility:visible;opacity:1;transform:translateX(-50%);pointer-events:auto;transition-delay:0s}
#composer .send,#composer-marker{-webkit-tap-highlight-color:transparent}
#composer .send:focus,#composer-marker:focus{outline:0}
#composer .send:focus-visible,#composer-marker:focus-visible{outline:1px solid var(--lime);outline-offset:2px}
#composer-marker[hidden],#composer-gesture[hidden]{display:none}
#composer-marker{position:absolute;left:calc(50% + var(--composer-offset,0px));top:-9px;transform:translateX(-50%);min-height:0;width:28px;height:18px;padding:0;border:0;background:transparent;touch-action:none;user-select:none;-webkit-touch-callout:none;z-index:1}
#composer-marker::after{content:"";display:block;width:14px;height:2px;margin:auto;background:currentColor;animation:send-pulse 1.8s ease-in-out infinite}
#composer .resize-grip{position:absolute;top:0;z-index:1;display:grid;place-items:center;width:20px;height:20px;min-height:0;padding:0;border:0;background:transparent;color:var(--muted);cursor:ns-resize;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
#composer .resize-grip::before{content:"";width:7px;height:7px;border-top:2px solid currentColor;border-left:2px solid currentColor}
#composer .resize-grip.left{left:0}
#composer .resize-grip.right{right:0}
#composer .resize-grip.right::before{transform:scaleX(-1)}
#composer .resize-grip:active,#composer .resize-grip:focus-visible{color:var(--lime)}
#composer-gesture{position:absolute;left:clamp(76px,calc(50% + var(--composer-offset,0px)),calc(100% - 76px));bottom:calc(100% + 88px);transform:translateX(-50%);white-space:nowrap;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--lime);pointer-events:none;animation:composer-hint-pulse 1.8s ease-in-out infinite}
#composer .send.is-pulsing{animation:composer-tap 300ms ease-out}
@keyframes composer-tap{50%{box-shadow:0 0 14px var(--lime);transform:translateX(-50%) scale(1.08)}}
@keyframes composer-hint-pulse{0%,100%{opacity:.72}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){#composer .send{transition:none}#composer .send.is-pulsing,#composer-marker::after,#composer-gesture{animation:none}}
#stop-response[hidden]{display:none}
#composer .send:disabled .send-mark::after{animation:none}
#chat-status{display:flex;align-items:center;justify-content:space-between;gap:8px}
#stop-response{min-height:32px;padding:0 9px}
.send-mark{width:12px;height:12px;transform:translate(var(--send-x,0px),var(--send-y,0px));transition:transform 160ms ease-out}
.send.is-dragging .send-mark{transition:none}
#messages.is-composer-gesture,#messages.is-composer-gesture *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.send-mark::after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:currentColor;animation:send-pulse 1.8s ease-in-out infinite}
@keyframes send-pulse{0%,100%{transform:scale(.85);opacity:.7}50%{transform:scale(1.15);opacity:1}}
@media(prefers-reduced-motion:reduce){.send-mark{transition:none}.send-mark::after{animation:none}}
textarea{resize:vertical;min-width:0;max-height:110px;flex:1;border:0;padding:9px;background:transparent;color:var(--paper);font:inherit}
#prompt{resize:none;min-height:calc(var(--chat-font-size) * 1.45 + 18px);padding-inline:22px}
#prompt:focus{outline:none}
dialog{width:min(390px,calc(100% - 24px));background:var(--panel);color:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px}
dialog::backdrop{background:var(--scrim)}
#model-button::before{
  content:"";
  width:18px;
  height:14px;
  border:2px solid currentColor;
  border-radius:3px;
  box-shadow:inset 0 0 0 2px var(--ink);
  background:repeating-linear-gradient(to bottom,transparent 0 3px,currentColor 3px 4px);
}
#model-list{display:grid;gap:8px;max-height:55vh;max-height:55dvh;overflow:auto}
#model-dialog[open]{display:flex;flex-direction:column;max-height:calc(100dvh - 24px);overflow:hidden}
#model-dialog> :not(#model-list){flex-shrink:0}
#model-dialog.is-inspecting #model-list{max-height:min(55dvh,var(--model-list-limit,55dvh));min-height:0}
#model-list button{text-align:left}
#model-list button[aria-pressed="true"]{border-color:var(--lime);background:var(--selection)}
#demo-status{overflow-wrap:anywhere}
#history-button::before{
  content:"";
  width:18px;
  height:18px;
  border:2px solid currentColor;
  border-radius:50%;
  background:linear-gradient(currentColor,currentColor) 50% 3px/2px 5px no-repeat,
             linear-gradient(currentColor,currentColor) 6px 7px/5px 2px no-repeat;
}
#history-list{
  max-height:min(75dvh,560px);
  overflow-y:auto;
  margin:0 -12px 0 0;
  padding-right:14px;
  overscroll-behavior:contain;
  scrollbar-width:none;
}
.swipe-row{position:relative;overflow:hidden;margin:6px 0;border-radius:4px}
.swipe-button{position:relative;display:block;width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;touch-action:pan-y;user-select:none;transform:translateX(var(--swipe-x,0px));transition:transform 140ms ease}
.swipe-row.dragging .swipe-button{transition:none}
.swipe-button:focus-visible{outline-offset:-3px}
.swipe-cue{position:absolute;inset:0;display:none;align-items:center;padding:0 14px;font:20px "Segoe UI Symbol",sans-serif}
.rename-cue{background:var(--selection);color:var(--lime)}
.delete-cue{justify-content:flex-end;background:var(--danger-panel);color:var(--warning)}
.swipe-row[data-swipe="right"] .rename-cue,.swipe-row[data-swipe="left"] .delete-cue{display:flex}
@media(prefers-reduced-motion:reduce){.swipe-button{transition:none}}
.swipe-button[aria-current="true"]{border-color:var(--lime)}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#chat-title{width:100%;padding:10px;font:inherit;background:var(--ink);color:var(--paper);border:1px solid var(--line)}
#history-status{color:var(--muted);font-size:12px}
#history-status:empty{display:none}
@media(max-width:440px){main{border-radius:0;border:0}}
#settings label{display:block;margin-top:12px;color:var(--muted);font-size:13px}
#settings input,#settings select,#model-search,#history-search{width:100%;min-height:40px;margin:5px 0;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--ink);color:var(--paper);font:inherit}
.provider-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.provider-actions>button{min-width:0;min-height:44px;padding:5px;overflow-wrap:anywhere}
.provider-actions.is-connected{grid-template-columns:repeat(4,minmax(0,1fr))}
#disconnect-provider[hidden]{display:none}
.disconnect-icon{position:relative;width:20px;height:20px;display:grid;place-items:center}
.disconnect-icon .connect-icon{transform:rotate(-30deg)}
.disconnect-icon::after{content:"";position:absolute;width:21px;height:2px;background:currentColor;box-shadow:0 1px var(--panel);transform:rotate(-45deg)}
.saved-providers[hidden]{display:none}
#provider-status{color:var(--muted);font-size:13px;margin:10px 0}
#model-list small{display:block;margin-top:4px;font-weight:normal}
#model-search{margin-bottom:10px}
#model-provider-summary{margin:0 0 5px;max-height:5em;overflow:auto;overflow-wrap:anywhere;font-size:12px;line-height:1.5;color:var(--muted)}
#chat-error{color:var(--warning);margin:5px 0}
#provider-models{margin:10px 0 0;padding:0;min-width:0;border:0}
#provider-model-list{max-height:min(28vh,230px);max-height:min(28dvh,230px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
#settings .provider-model-row{display:flex;align-items:center;gap:10px;min-height:42px;margin:4px 0;padding:7px 9px;border:1px solid var(--line);border-radius:4px;color:var(--paper);overflow-wrap:anywhere;cursor:pointer}
#settings .provider-model-row input{width:16px;height:16px;min-height:0;margin:0;flex:none;accent-color:var(--lime)}
#provider-model-list p{font-size:13px;color:var(--muted)}
.key-field,.url-field,.name-field,.provider-field{position:relative;min-width:0}
.provider-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
#provider-type{text-overflow:ellipsis}
#settings .key-field input,#settings .url-field input,#settings .name-field input,#settings .provider-field select{padding-left:37px}
.key-icon{position:absolute;left:12px;top:50%;width:16px;height:14px;transform:translateY(-50%);color:var(--lime);pointer-events:none}
.key-icon::before{content:"";position:absolute;left:0;top:3px;width:8px;height:8px;border:2px solid currentColor;border-radius:50%;box-sizing:border-box}
.key-icon::after{content:"";position:absolute;left:6px;top:6px;width:10px;height:5px;background:linear-gradient(currentColor,currentColor) top/100% 2px no-repeat,linear-gradient(currentColor,currentColor) right/2px 100% no-repeat}
.url-icon{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--lime);pointer-events:none;border:1.5px solid currentColor;border-radius:50%;background:linear-gradient(currentColor,currentColor) center/100% 1px no-repeat}
.url-icon::before{content:"";position:absolute;inset:-1px 3px;border:1px solid currentColor;border-radius:50%}
.name-icon{position:absolute;left:12px;top:50%;width:16px;height:12px;transform:translateY(-50%);pointer-events:none;background:radial-gradient(circle at 5px 6px,var(--ink) 1.5px,var(--lime) 1.7px);clip-path:polygon(0 50%,35% 0,100% 0,100% 100%,35% 100%)}
.provider-icon{position:absolute;left:12px;top:50%;width:16px;height:14px;transform:translateY(-50%);color:var(--lime);pointer-events:none}
.provider-icon::before,.provider-icon::after{content:"";position:absolute;left:0;width:16px;height:6px;box-sizing:border-box;border:1px solid currentColor;border-radius:2px;background:radial-gradient(circle at 3px 2px,currentColor 1px,transparent 1.2px)}
.provider-icon::before{top:0}
.provider-icon::after{bottom:0}
.connect-button{display:grid;place-items:center;min-height:0;padding:0;border-color:var(--line)}
.connect-icon{position:relative;width:16px;height:18px}
.connect-icon::before{content:"";position:absolute;inset:5px 2px 4px;background:currentColor;border-radius:2px 2px 5px 5px}
.connect-icon::after{content:"";position:absolute;inset:0;background:linear-gradient(currentColor,currentColor) 5px 0/2px 6px no-repeat,linear-gradient(currentColor,currentColor) 9px 0/2px 6px no-repeat,linear-gradient(currentColor,currentColor) center bottom/2px 5px no-repeat}
.model-filter-row{display:grid;grid-template-columns:40px 40px minmax(0,1fr);align-items:stretch;gap:8px;margin:5px 0}
#settings .model-filter-row input{display:block;margin:0}
#toggle-provider-models span{display:grid;place-items:center;width:17px;height:17px;border:1.5px solid currentColor;border-radius:3px;font-size:14px;line-height:1}
.test-icon{font:18px/1 "Segoe UI Symbol",monospace}
.model-test-dot{width:8px;height:8px;margin-left:auto;border-radius:50%;flex:none;background:#72806c}
.model-test-dot[data-state="pending"]{background:var(--muted)}
.model-test-dot[data-state="passed"]{background:var(--lime)}
.model-test-dot[data-state="failed"]{background:var(--danger)}
.model-stats{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font:12px/18px "Courier New",monospace}
.model-stats>span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.model-stats [role="img"]{display:inline-grid;place-items:center;width:12px;height:18px;line-height:1}
.model-stat-separator{font-weight:bold}
@media(max-width:340px){.model-stats{gap:4px;font-size:11px}}
.model-passed{color:var(--lime)}
.model-failed{color:var(--danger)}
.model-failed-icon{position:relative;top:-1px}
.model-failed-icon::before,.model-failed-icon::after{content:"";position:absolute;left:50%;top:50%}
.model-failed-icon::before{width:10px;height:10px;border:1px solid currentColor;border-radius:50%;box-sizing:border-box;transform:translate(-50%,-50%)}
.model-failed-icon::after{width:8px;height:1px;background:currentColor;transform:translate(-50%,-50%) rotate(-45deg)}
#provider-status:empty{display:none}
.saved-providers{display:grid;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
#saved-provider-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:54px;gap:5px;max-height:57px;overflow:auto;overscroll-behavior:contain}
#saved-provider-list:empty{display:none}
.saved-provider{display:grid;align-content:center;justify-items:start;gap:3px;height:100%;padding:5px 8px;text-align:left}
.saved-provider>span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.saved-provider small{flex:none;font-weight:normal}
.saved-provider[aria-pressed="true"]{border-color:var(--lime)}
.save-icon{position:relative;width:17px;height:17px;background:currentColor;clip-path:polygon(0 0,72% 0,100% 28%,100% 100%,0 100%);border-radius:2px}
.save-icon::before,.save-icon::after{content:"";position:absolute;left:4px;background:var(--primary-bg)}
.save-icon::before{top:2px;width:7px;height:5px;border-right:2px solid currentColor}
.save-icon::after{bottom:2px;width:9px;height:6px;border-radius:1px}
.saved-provider-row{margin:0}
.delete-provider-button{color:var(--warning);border-color:var(--danger-line);background:var(--danger-panel)}
#provider-delete-error{color:var(--warning)}
.model-group{display:grid;gap:6px;min-width:0}
.model-group + .model-group{margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.model-group h2{margin:0 0 2px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.model-group button{overflow-wrap:anywhere}
#settings .key-field input[data-saved-key="true"]::placeholder{color:var(--paper);letter-spacing:2px}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
#empty{display:grid;place-items:center;min-height:100%;margin:0;background:none;border:0;padding:14px;pointer-events:none}
#empty>div{display:grid;justify-items:center;max-width:100%}
#empty canvas{display:block;width:min(220px,70vw);height:auto;opacity:.38}
#pending-files,.message-files{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}
#pending-files[hidden]{display:none}
.file-chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.file-chip button{min-height:24px;min-width:24px;padding:0;border:0;background:transparent;font-size:16px}
article .reply-meta{display:block;margin-top:8px;color:var(--muted);font-size:11px}
article details{margin-top:8px;padding:5px 7px;border-left:1px solid var(--line);color:var(--muted);font-size:12px}
article details summary{cursor:pointer}
article .pending-reply{color:var(--muted)}
#messages article.streaming-reply{flex-shrink:0}
.streaming-reply>p{max-height:min(7em,25vh);overflow-y:auto}
.reply-image{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:4px}
.reply-image{cursor:zoom-in;touch-action:manipulation;user-select:none;-webkit-touch-callout:none}
.image-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.image-footer small,.inspector-lines{overflow-wrap:anywhere;line-height:1.4}
.image-footer small{font-size:11px}
.image-download{flex:none;display:grid;place-items:center;width:44px;min-height:44px;padding:0;border:0;background:transparent;color:var(--lime);font-size:17px}
.image-download span{animation:send-pulse 1.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.image-download span{animation:none}}
#model-inspector{max-height:min(25dvh,150px);overflow:auto;margin-bottom:8px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font-size:12px}
.inspector-content{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:2px 8px}
.inspector-content #inspector-result{grid-column:1 / -1;overflow-wrap:anywhere}
.inspector-content #inspector-result:empty{display:none}
.inspector-lines{display:grid;gap:2px;margin:4px 0;color:var(--muted)}
.inspector-test{min-height:30px;min-width:36px;padding:3px 8px}
#image-viewer{inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;overflow:hidden;touch-action:none;user-select:none}

<script>
const find = id => document.getElementById(id);

function clearContents(element) {
  element.textContent = '';
}

function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Array.from(crypto.getRandomValues(new Uint8Array(16)), byte =>
    byte.toString(16).padStart(2, '0')).join('');
}
const messages = find('messages');
const promptBox = find('prompt');
const reset = find('reset');
const empty = find('empty');

function appendMessage(author, content, mine, target = messages) {
  const message = document.createElement('article');
  if (mine) {
    message.className = 'mine';
    message.setAttribute('aria-label', 'Your message');
  } else {
    const label = document.createElement('small');
    label.textContent = author;
    message.append(label);
  }
  const text = document.createElement('p');
  text.textContent = content;
  message.append(text);
  target.append(message);
  return message;
}

const presets = {
  openrouter: 'https://openrouter.ai/api/v1',
  openai: 'https://api.openai.com/v1',
  gemini: 'https://generativelanguage.googleapis.com/v1beta/openai'
};
const kenariBase = 'https://kenari.id/v1';
const routrBase = 'https://api.routr.cloud/v1';
const demoBeamId = 'beam-1-0:free';
const demoProfileId = 'builtin-kenari-demo';
const liveModelKey = 'neural-link.active-provider-model.v1';
const modelDialog = find('model-dialog');
const settings = find('settings');
const form = find('provider-form');
const typeInput = find('provider-type');
const nameInput = find('provider-name');
const baseInput = find('provider-base');
const keyInput = find('provider-key');
const modelSearch = find('model-search');
const sendButton = find('composer').querySelector('.send');
const composerMarker = find('composer-marker');
const composerGesture = find('composer-gesture');
let composerIdle;
let composerPress;
let composerTapCount = 0;
let composerLastTap = 0;
let composerTapExpiry;
let composerHold;
let markerPress;
const stopResponse = find('stop-response');
const filePicker = find('file-picker');
let attachments = [];
let readingFiles = false;
let attachmentVersion = 0;
let sending = false;
let activeId = null;
let configuring = false;

function stored(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}

function remember(key, value) {
  try { localStorage.setItem(key, value); } catch { /* Session state is still available. */ }
}

let nativeSequence = 0;
const nativePending = new Map();

window.hackGptNativeEvent = (id, encoded) => {
  const operation = nativePending.get(id);
  if (!operation) return;
  const {kind, payload} = JSON.parse(encoded);
  if (kind === 'event') {
    operation.onEvent?.(payload);
    return;
  }
  nativePending.delete(id);
  operation.cleanup();
  if (kind === 'error') operation.reject(new Error(payload));
  else operation.resolve(payload);
};

function androidRequest(path, body, onEvent, signal) {
  return new Promise((resolve, reject) => {
    const id = String(++nativeSequence);
    const abort = () => {
      nativePending.delete(id);
      reject(new DOMException('Response stopped', 'AbortError'));
      window.HackGptAndroid.cancel(id);
    };
    if (signal?.aborted) {
      reject(new DOMException('Response stopped', 'AbortError'));
      return;
    }
    signal?.addEventListener('abort', abort, {once: true});
    nativePending.set(id, {
      resolve, reject, onEvent,
      cleanup: () => signal?.removeEventListener('abort', abort)
    });
    try {
      window.HackGptAndroid.request(id, path, JSON.stringify(body ?? {}));
    } catch {
      nativePending.delete(id);
      signal?.removeEventListener('abort', abort);
      reject(new Error('The Android app could not start the request.'));
    }
  });
}


async function localApi(path, body) {
  if (window.HackGptAndroid) return androidRequest(path, body);
  const options = body === undefined ? {} : {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  };
  let response;
  try { response = await fetch('/api/' + path, options); }
  catch { throw new Error('Could not reach the local preview server.'); }
  const data = await response.json().catch(() => null);
  if (!response.ok) throw new Error(data?.error || 'The local preview request failed.');
  return data;
}

const profilesKey = 'neural-link.saved-providers.v1';
let profiles = readArray(profilesKey);
let builtInDemo = null;
const connections = new Map();
let creditConnection = null;
let creditRevision = 0;
let editingId = null;
let inspectedModel;
let inspectorProbe;
let heldModelClick = false;
let draft = null;
let liveModel = stored(liveModelKey);
const modelTests = new Map();

function readArray(key) {
  try {
    const value = JSON.parse(stored(key));
    return Array.isArray(value) ? value : [];
  } catch {
    return [];
  }
}

function saveProfiles(next) {
  try {
    localStorage.setItem(profilesKey, JSON.stringify(next));
  } catch {
    throw new Error('Could not save providers in this browser.');
  }
  profiles = next;
}

function draftModels() {
  return draft ? draft.models.filter(model => !draft.hidden.has(model.id)) : [];
}

function savedModels() {
  const configuredKenari = [...connections.values()].find(connection =>
    connection.base === kenariBase && connection.saved === true);
  const demo = builtInDemo ?? {
    id: demoProfileId, name: 'Demo', connectionId: configuredKenari?.id,
    models: [{id: demoBeamId, name: 'Beam 1.0 Free'}], hidden: []
  };
  return [demo, ...profiles].flatMap(profile => {
    const hidden = new Set(profile.hidden);
    const connection = connections.get(profile.connectionId);
    return profile.models.filter(model => !hidden.has(model.id)).map(model => ({
      ...model,
      imageOnly: model.imageOnly || (connection?.type === 'openai' && model.id.startsWith('gpt-image-'))
        || (connection?.base === kenariBase && model.id.startsWith('nano-banana-'))
        || (connection?.type === 'openrouter' && model.modalities?.includes('image') && !model.modalities.includes('text')),
      profile, connection, selection: JSON.stringify([profile.id, model.id])
    }));
  });
}

function currentModel() {
  const models = savedModels().filter(model => model.connection);
  return models.find(model => model.selection === liveModel) ?? models[0];
}

function updateModelStatus() {
  const model = currentModel();
  if (inspectedModel && inspectedModel.selection !== model?.selection) closeModelInspector();
  find('inspector-test').disabled = sending || !!inspectorProbe;
  find('demo-status').textContent = model
    ? model.name + ' · ' + model.profile.name
    : 'Connect a provider and select models in Settings';
  updateComposerButton(model);
  updateChatCredit(model);
  updateAttachmentControl(model);
  find('test-model').disabled = configuring || !draft?.connectionId || !connections.has(draft.connectionId) || !draftModels().length;
}

async function updateChatCredit(model, refresh = false) {
  const connection = model?.connection;
  const freeDemo = model?.profile?.id === demoProfileId;
  const routr = connection?.base === routrBase;
  const key = freeDemo ? 'free-demo' : routr ? JSON.stringify([connection.id, model.id])
    : connection?.base === kenariBase ? connection.id : null;
  if (key === creditConnection && !refresh) return;
  const credit = find('chat-credit');
  if (key !== creditConnection) {
    credit.hidden = true;
    credit.disabled = true;
    credit.onclick = null;
    credit.removeAttribute('aria-pressed');
  }
  creditConnection = key;
  const revision = ++creditRevision;
  if (freeDemo) {
    credit.title = 'Free demo';
    credit.setAttribute('aria-label', credit.title);
    credit.textContent = 'FREE';
    credit.hidden = false;
    return;
  }
  if (!key) return;
  try {
    const result = await localApi(routr ? 'routr-quota' : 'kenari-balance',
      {connection: connection.id, ...(routr && {model: model.id})});
    if (revision !== creditRevision) return;
    const amount = detailNumber(result.balance);
    credit.hidden = amount === null;
    if (amount !== null) {
      if (routr) {
        const exact = amount.toLocaleString('en-US');
        const compact = amount.toLocaleString('en-US', {notation: 'compact', maximumSignificantDigits: 4});
        const showAmount = expanded => {
          credit.setAttribute('aria-pressed', String(expanded));
          credit.textContent = expanded ? exact : compact;
        };
        credit.title = model.id + ' · ' + exact + ' available credits';
        credit.setAttribute('aria-label', credit.title + ' · Toggle exact amount');
        credit.disabled = false;
        showAmount(credit.getAttribute('aria-pressed') === 'true');
        credit.onclick = () => showAmount(credit.getAttribute('aria-pressed') !== 'true');
      } else {
        credit.textContent = (amount / 1_000_000).toLocaleString('id-ID', {maximumFractionDigits: 0});
        credit.title = 'Available Kenari balance in Indonesian rupiah';
        credit.setAttribute('aria-label', credit.title + ' · ' + credit.textContent);
      }
    }
  } catch {
    if (revision === creditRevision) credit.hidden = true;
  }
}

function renderModels() {
  const list = find('model-list');
  clearContents(list);
  const search = modelSearch.value.trim().toLowerCase();
  const available = savedModels();
  const providers = new Map();
  for (const model of available) {
    if (!model.profile) continue;
    const {id, name} = model.profile;
    if (!providers.has(id)) providers.set(id, {name, count: 0});
    providers.get(id).count++;
  }
  const summary = find('model-provider-summary');
  summary.textContent = Array.from(providers.values(), ({name, count}) =>
    `${name}/${count}`).join(' · ');
  summary.hidden = !providers.size;
  const models = available.filter(model =>
    (model.name + ' ' + model.id + ' ' + (model.profile?.name ?? '')).toLowerCase().includes(search));
  const active = currentModel();
  const groups = new Map();
  for (const model of models) {
    const groupId = model.profile?.id ?? null;
    let group = groups.get(groupId);
    if (!group) {
      group = document.createElement('section');
      group.className = 'model-group';
      group.setAttribute('role', 'group');
      const heading = document.createElement('h2');
      heading.id = 'model-group-heading-' + groups.size;
      heading.textContent = model.profile.name;
      group.setAttribute('aria-labelledby', heading.id);
      group.append(heading);
      groups.set(groupId, group);
      list.append(group);
    }
    const option = document.createElement('button');
    option.type = 'button';
    option.textContent = model.name;
    option.setAttribute('aria-pressed', String(active
      ? (model.selection ?? model.id) === (active.selection ?? active.id) : false));
    if (model.profile) {
      const details = [model.name === model.id ? '' : model.id,
        model.imageOnly || model.modalities?.includes('image') ? 'Image generation' : '',
        !model.connection ? (model.profile.id === demoProfileId ? 'Connect Kenari in Settings' : 'Key needed') : '']
        .filter(Boolean).join(' · ');
      if (details) {
        const subtitle = document.createElement('small');
        subtitle.textContent = details;
        option.append(subtitle);
      }
      option.disabled = !model.connection;
    }
    const select = inspect => {
      liveModel = model.selection;
      remember(liveModelKey, liveModel);
      updateModelStatus();
      if (inspect) {
        for (const row of list.querySelectorAll('button')) row.setAttribute('aria-pressed', String(row === option));
        inspectModel(model);
        keepModelRowVisible(option);
      } else {
        closeModelInspector();
        modelDialog.close();
      }
    };
    option.onclick = () => select(false);
    option.setAttribute('aria-description', 'Hold or press Shift+Enter for model details.');
    onLongPress(option, () => {
      heldModelClick = true;
      select(true);
    });
    option.onkeydown = event => {
      if (event.key !== 'Enter' || !event.shiftKey || event.repeat) return;
      event.preventDefault();
      select(true);
    };
    group.append(option);
  }
  if (!models.length) list.textContent = search ? 'No matching models.' : 'Enable and save models in Settings.';
  limitInspectorModelList();
}

function limitInspectorModelList() {
  if (!inspectedModel) return;
  const list = find('model-list');
  const rows = list.querySelectorAll('button');
  if (rows.length <= 6) {
    list.style.removeProperty('--model-list-limit');
    return;
  }
  const top = list.getBoundingClientRect().top;
  const height = Math.ceil(rows[5].getBoundingClientRect().bottom - top + list.scrollTop);
  list.style.setProperty('--model-list-limit', height + 'px');
}

function keepModelRowVisible(row) {
  const list = find('model-list');
  const bounds = list.getBoundingClientRect();
  const item = row.getBoundingClientRect();
  if (item.top < bounds.top) list.scrollTop += item.top - bounds.top;
  else if (item.bottom > bounds.bottom) list.scrollTop += item.bottom - bounds.bottom;
}

function onLongPress(element, action) {
  let press;
  let consumed = false;
  const cancel = () => { clearTimeout(press?.timer); press = null; };
  element.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0) return;
    consumed = false;
    cancel();
    press = {id: event.pointerId, x: event.clientX, y: event.clientY};
    press.timer = setTimeout(() => {
      consumed = true;
      cancel();
      action();
    }, 450);
  });
  element.addEventListener('pointermove', event => {
    if (press?.id === event.pointerId && Math.hypot(event.clientX - press.x, event.clientY - press.y) > 8) cancel();
  });
  for (const event of ['pointerup', 'pointercancel', 'pointerleave']) element.addEventListener(event, cancel);
  element.addEventListener('contextmenu', event => event.preventDefault());
  element.addEventListener('click', event => {
    if (consumed && event.detail) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, true);
}

function closeModelInspector() {
  inspectorProbe?.abort();
  inspectorProbe = null;
  inspectedModel = null;
  find('model-inspector').hidden = true;
  modelDialog.classList.remove('is-inspecting');
  find('model-list').style.removeProperty('--model-list-limit');
}

function inspectorLines(model, details = {}) {
  const {kind, balance} = details;
  const item = details.models?.find(entry => entry.id === model.id || entry.model === model.id) ?? {};
  const format = value => value.toLocaleString(undefined, {maximumFractionDigits: 8});
  const number = detailNumber;
  const lines = [];
  const limits = [
    ['Context', item.context_length ?? item.context_limit ?? item.context_window],
    ['Max input', item.input_token_limit ?? item.inputTokenLimit],
    ['Max output', item.output_token_limit ?? item.outputTokenLimit ?? item.max_output_tokens ?? item.top_provider?.max_completion_tokens]
  ].flatMap(([label, value]) => number(value) > 0 ? [label + ' ' + format(number(value))] : []);
  if (limits.length) lines.push(limits.join(' · ') + ' tokens');
  const input = item.architecture?.input_modalities ?? item.input_modalities;
  const output = item.architecture?.output_modalities ?? item.output_modalities ?? model.modalities;
  const inputs = model.imageOnly ? ['text prompt'] : Array.isArray(input) ? input
    : ['text', ...['image', 'pdf'].filter(type => model.input?.[type] === true)];
  lines.push('Input · ' + inputs.join(', ') + ' · Image generation '
    + (model.imageOnly || output?.includes?.('image') || item.endpoints?.includes?.('images') ? 'yes'
      : Array.isArray(output) ? 'no' : 'unreported'));
  const price = item.pricing ?? {};
  const rates = (fields, factor, prefix, unit) => fields.flatMap(([label, value]) =>
    number(value) === null ? [] : [label + ' ' + prefix + format(number(value) * factor)])
    .join(' · ') + unit;
  if (model.profile.id === demoProfileId || price.free === true) {
    lines.push('Free tier');
  } else if (kind === 'kenari' && model.imageOnly) {
    const prices = (Array.isArray(item.pricing_lines) ? item.pricing_lines : [])
      .filter(rate => rate?.endpoint === 'images' && number(rate.micro_idr) !== null);
    if (prices.length) lines.push(...prices.map(rate => 'Rp ' + format(number(rate.micro_idr) / 1_000_000)
      + ' / ' + (rate.unit || 'image') + (rate.variant ? ' · ' + rate.variant : '')));
  } else if (kind === 'kenari' && [price.input, price.output, price.cache_read].some(v => number(v) !== null)) {
    lines.push(rates([['In', price.input], ['Out', price.output], ['Cache', price.cache_read]], 1 / 1_000_000, 'Rp ', ' / 1M tokens'));
  } else if (kind === 'routr') {
    const fields = [['In', item.input_rate], ['Out', item.output_rate], ['Cache', item.cache_rate]];
    if (fields.some(([, value]) => number(value) !== null)) lines.push(rates(fields, 1, '', ' credits/token'));
    const minimum = number(item.per_request_floor_credits ?? item.min_charge_credits);
    if (minimum !== null) lines.push('Minimum ' + format(minimum) + ' credits/request');
  } else if (kind === 'openrouter' || kind === 'apimurah') {
    const fields = [['In', price.prompt], ['Out', price.completion], ['Cache', price.input_cache_read]];
    if (fields.some(([, value]) => number(value) !== null)) lines.push(rates(fields, 1_000_000, '$', ' / 1M tokens'));
    if (number(price.request) > 0) lines.push('$' + format(number(price.request)) + ' / request');
    if (number(price.image) > 0) lines.push('$' + format(number(price.image)) + ' / image input');
  }
  if (number(balance) !== null) {
    if (kind === 'kenari') lines.push('Balance Rp ' + format(number(balance) / 1_000_000));
    if (kind === 'routr') lines.push('Wallet ' + format(number(balance)) + ' credits');
    if (kind === 'openrouter') lines.push('$' + format(number(balance)) + ' remaining on key limit');
  }
  return lines;
}

async function inspectModel(model) {
  closeModelInspector();
  inspectedModel = model;
  find('model-inspector').hidden = false;
  modelDialog.classList.add('is-inspecting');
  limitInspectorModelList();
  find('inspector-result').textContent = '';
  find('inspector-test').disabled = sending;
  const lines = find('inspector-lines');
  const render = (details, status) => {
    const rows = inspectorLines(model, details);
    if (status) rows.push(status);
    lines.replaceChildren(...rows.map(row => {
      const item = document.createElement('span');
      item.textContent = row;
      return item;
    }));
  };
  if (model.profile.id === demoProfileId) { render({}); return; }
  render({}, 'Loading provider details…');
  try {
    const details = await localApi('provider-details', {connection: model.connection.id, model: model.id});
    if (inspectedModel === model) {
      const rows = inspectorLines(model, details);
      const billing = rows.some(row => /[$]|\bRp |credits\/token|Free tier/.test(row) && !row.startsWith('Balance'));
      render(details, billing ? '' : 'Pricing not reported by this provider.');
    }
  } catch {
    if (inspectedModel === model) render({}, 'Provider details unavailable.');
  }
}

find('inspector-test').onclick = async () => {
  const model = inspectedModel;
  if (!model || inspectorProbe || sending) return;
  const controller = new AbortController();
  inspectorProbe = controller;
  const result = find('inspector-result');
  find('inspector-test').disabled = true;
  result.textContent = 'Testing…';
  let responded = false;
  try {
    const image = model.imageOnly || model.modalities?.includes('image');
    const stats = await receiveReply({connection: model.connection.id, model: model.id,
      messages: [{role: 'user', content: image ? 'Generate a simple blue circle on a white background.' : 'Reply with OK.'}]
    }, event => {
      responded ||= event.type === 'delta' ? !!event.text.trim() : event.type === 'image' && !!replyImageSource(event.text);
    }, controller.signal);
    if (!responded) throw new Error('No usable response.');
    if (inspectorProbe === controller) result.textContent = 'Responded · ' + (stats.durationMs / 1000).toFixed(2) + ' s';
  } catch (error) {
    if (inspectorProbe === controller) result.textContent = 'Test failed · ' + error.message;
  } finally {
    if (inspectorProbe === controller) {
      inspectorProbe = null;
      find('inspector-test').disabled = sending;
      updateChatCredit(model, true);
    }
  }
};

function renderSavedProviders() {
  const list = find('saved-provider-list');
  list.parentElement.hidden = !profiles.length;
  clearContents(list);
  for (const profile of profiles) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'swipe-button saved-provider';
    button.setAttribute('aria-description', 'Swipe left or press Left Arrow to delete.');
    button.setAttribute('aria-keyshortcuts', 'ArrowLeft');
    button.disabled = configuring;
    button.setAttribute('aria-pressed', String(editingId === profile.id));
    const name = document.createElement('span');
    name.textContent = profile.name;
    const details = document.createElement('small');
    const hidden = new Set(profile.hidden);
    const count = profile.models.filter(model => !hidden.has(model.id)).length;
    details.textContent = count + (count === 1 ? ' model' : ' models');
    button.append(name, details);
    button.onclick = () => editProvider(profile);
    const row = document.createElement('div');
    row.className = 'swipe-row saved-provider-row';
    row.append(swipeCue(true), button);
    attachSwipeGesture(row, button, {left: () => confirmDeleteProvider(profile)});
    list.append(row);
  }
}

function releaseDraftConnection() {
  const id = draft?.connectionId;
  if (!id || profiles.some(profile => profile.connectionId === id)) return;
  connections.delete(id);
  localApi('disconnect', {connection: id}).catch(() => {});
}

function editProvider(profile) {
  releaseDraftConnection();
  editingId = profile?.id ?? null;
  draft = profile ? {...profile, hidden: new Set(profile.hidden)} : null;
  typeInput.value = profile?.type ?? 'openrouter';
  nameInput.value = profile?.name ?? 'OpenRouter';
  baseInput.value = profile?.base ?? presets.openrouter;
  keyInput.value = '';
  find('provider-model-search').value = '';
  modelTests.clear();
  find('provider-status').textContent = '';
  refreshSettings();
}

function matchesDraftFields() {
  return draft?.type === typeInput.value
    && draft.base === baseInput.value.trim().replace(/\/+$/, '');
}

function detailNumber(value) {
  if (typeof value !== 'number' && (typeof value !== 'string' || !value.trim())) return null;
  const number = Number(value);
  return Number.isFinite(number) && number >= 0 ? number : null;
}

function refreshSettings() {
  baseInput.readOnly = typeInput.value !== 'custom';
  const matches = matchesDraftFields();
  const deferredKey = keyInput.value.trim() !== '';
  const connected = matches && connections.has(draft.connectionId);
  const savedKey = connected && connections.get(draft.connectionId).saved === true;
  keyInput.dataset.savedKey = String(savedKey);
  keyInput.placeholder = savedKey ? '••••••••••••••••'
    : connected ? 'Reuse connected key' : 'Enter your provider key';
  find('provider-key-hint').textContent = savedKey
    ? 'Saved API key in use. Type a new key to replace it.' : '';
  find('save-provider').disabled = configuring || !connected || deferredKey;
  find('disconnect-provider').hidden = !connected;
  find('disconnect-provider').parentElement.classList.toggle('is-connected', connected);
  renderSavedProviders();
  renderProviderModels();
  find('provider-models').hidden = !matches;
  updateModelStatus();
}

find('provider').onclick = () => {
  editProvider(null);
  settings.showModal();
};
find('new-provider').onclick = () => editProvider(null);
settings.onclose = () => { keyInput.value = ''; };
typeInput.onchange = () => {
  const saved = profiles.find(profile => profile.id === editingId && profile.type === typeInput.value);
  nameInput.value = saved?.name ?? typeInput.selectedOptions[0].textContent.replace(/ \(.*\)$/, '');
  baseInput.value = presets[typeInput.value] ?? saved?.base ?? '';
  keyInput.value = '';
  refreshSettings();
};
baseInput.oninput = refreshSettings;
keyInput.oninput = () => {
  find('save-provider').disabled = configuring || !matchesDraftFields() || !connections.has(draft.connectionId) || !!keyInput.value.trim();
};

async function settingsRequest(message, action) {
  if (configuring) return;
  configuring = true;
  for (const control of form.elements) control.disabled = true;
  const status = find('provider-status');
  status.textContent = message;
  try {
    status.textContent = await action();
  } catch (error) {
    status.textContent = error.message;
  } finally {
    for (const control of form.elements) control.disabled = false;
    configuring = false;
    refreshSettings();
  }
}

function connect() {
  if (!form.reportValidity()) return;
  const input = {
    type: typeInput.value, base: baseInput.value, key: keyInput.value,
    connection: matchesDraftFields() ? draft.connectionId : undefined
  };
  settingsRequest('Loading provider models…', async () => {
    const connection = await localApi('connect', input);
    const hidden = matchesDraftFields() ? draft.hidden : new Set();
    releaseDraftConnection();
    connections.set(connection.id, connection);
    draft = {...connection, connectionId: connection.id, hidden};
    baseInput.value = connection.base;
    keyInput.value = '';
    modelTests.clear();
    return 'Choose models, then save this provider.';
  });
}

form.onsubmit = event => {
  event.preventDefault();
  connect();
};

find('save-provider').onclick = () => {
  if (!matchesDraftFields() || !connections.has(draft.connectionId) || keyInput.value.trim()) return;
  const index = profiles.findIndex(profile => profile.id === editingId);
  const previous = profiles[index];
  const saved = {
    id: previous?.id ?? newId(),
    name: nameInput.value.trim() || draft.name,
    type: draft.type, base: draft.base, models: draft.models,
    hidden: [...draft.hidden], connectionId: draft.connectionId
  };
  settingsRequest('Saving provider…', async () => {
    const connection = await localApi('save', {connection: saved.connectionId});
    connections.set(connection.id, connection);
    const next = [...profiles];
    if (index === -1) next.push(saved);
    else next[index] = saved;
    saveProfiles(next);
    editingId = saved.id;
    draft = {...saved, hidden: new Set(saved.hidden)};
    nameInput.value = saved.name;
    if (previous?.connectionId && previous.connectionId !== saved.connectionId
        && connections.has(previous.connectionId)) {
      await localApi('disconnect', {connection: previous.connectionId});
      connections.delete(previous.connectionId);
    }
    return 'Saved ' + saved.name + '.';
  });
};

const providerDeleteDialog = find('provider-delete-dialog');
const providerDeleteError = find('provider-delete-error');
const confirmProviderDelete = find('confirm-provider-delete');
const cancelProviderDelete = find('cancel-provider-delete');
let pendingProviderDelete = null;
let deletingProvider = false;

function confirmDeleteProvider(profile) {
  if (configuring || deletingProvider) return;
  pendingProviderDelete = profile;
  find('provider-delete-message').textContent =
    'Delete "' + profile.name + '" and its saved models and API key? Existing chats will be kept.';
  providerDeleteError.hidden = true;
  providerDeleteDialog.showModal();
  cancelProviderDelete.focus();
}

cancelProviderDelete.onclick = () => providerDeleteDialog.close();
providerDeleteDialog.addEventListener('cancel', event => {
  if (deletingProvider) event.preventDefault();
});
confirmProviderDelete.onclick = async () => {
  const profile = pendingProviderDelete;
  if (!profile || deletingProvider) return;
  deletingProvider = true;
  confirmProviderDelete.disabled = true;
  cancelProviderDelete.disabled = true;
  providerDeleteError.hidden = true;
  try {
    if (profile.connectionId) {
      await localApi('disconnect', {connection: profile.connectionId});
      connections.delete(profile.connectionId);
    }
    saveProfiles(profiles.filter(item => item.id !== profile.id));
    if (liveModel && !savedModels().some(model => model.selection === liveModel)) {
      liveModel = null;
      remember(liveModelKey, '');
    }
    providerDeleteDialog.close();
    if (editingId === profile.id) editProvider(profiles[0]);
    else refreshSettings();
    find('saved-provider-list').querySelector('button')?.focus();
    if (!profiles.length) find('new-provider').focus();
  } catch (error) {
    providerDeleteError.textContent = error.message;
    providerDeleteError.hidden = false;
    updateModelStatus();
  } finally {
    deletingProvider = false;
    confirmProviderDelete.disabled = false;
    cancelProviderDelete.disabled = false;
  }
};


find('disconnect-provider').onclick = () => settingsRequest('Disconnecting…', async () => {
  const id = draft.connectionId;
  await localApi('disconnect', {connection: id});
  connections.delete(id);
  keyInput.value = '';
  modelTests.clear();
  return 'Disconnected and removed the saved API key.';
});

function updateProviderModelToggle() {
  const button = find('toggle-provider-models');
  const count = draftModels().length;
  const all = count === draft.models.length;
  button.setAttribute('aria-pressed', all ? 'true' : count ? 'mixed' : 'false');
  button.title = all ? 'Deselect all models' : 'Select all models';
  button.firstElementChild.textContent = all ? '✓' : count ? '−' : '';
  button.onclick = () => {
    draft.hidden = new Set(all ? draft.models.map(model => model.id) : []);
    updateDraftModelVisibility();
    renderProviderModels();
  };
}

function updateDraftModelVisibility() {
  updateProviderModelStats();
  updateModelStatus();
}

function renderProviderModels() {
  const list = find('provider-model-list');
  clearContents(list);
  find('provider-models').hidden = !draft;
  if (!draft) return;
  updateProviderModelToggle();
  const filter = find('provider-model-search').value.trim().toLowerCase();
  for (const model of draft.models) {
    if (!(model.name + ' ' + model.id).toLowerCase().includes(filter)) continue;
    const row = document.createElement('label');
    row.className = 'provider-model-row';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.setAttribute('aria-label', model.name);
    checkbox.disabled = configuring;
    checkbox.checked = !draft.hidden.has(model.id);
    checkbox.onchange = () => {
      if (checkbox.checked) draft.hidden.delete(model.id);
      else draft.hidden.add(model.id);
      updateDraftModelVisibility();
      updateProviderModelToggle();
    };
    const label = document.createElement('span');
    label.textContent = model.name;
    label.title = model.id;
    const dot = document.createElement('span');
    dot.className = 'model-test-dot';
    dot.dataset.model = model.id;
    dot.setAttribute('role', 'img');
    row.append(checkbox, label, dot);
    list.append(row);
  }
  if (!list.childElementCount) {
    const empty = document.createElement('p');
    empty.textContent = 'No matching models.';
    list.append(empty);
  }
  updateModelTestDots();
}
find('provider-model-search').oninput = renderProviderModels;

function updateProviderModelStats() {
  const results = [...modelTests.values()];
  const selected = draftModels().length;
  const total = draft?.models.length ?? 0;
  find('model-selection-count').textContent = selected + ' / ' + total;
  find('passed-count').textContent = results.filter(result => result.state === 'passed').length;
  find('failed-count').textContent = results.filter(result => result.state === 'failed').length;
}

function updateModelTestDots() {
  updateProviderModelStats();
  for (const dot of find('provider-model-list').querySelectorAll('.model-test-dot')) {
    const result = modelTests.get(dot.dataset.model);
    dot.dataset.state = result?.state ?? '';

function attachSwipeGesture(row, button, actions, thresholds = {}) {
  let start = null;
  let dragging = false;
  let suppressClick = false;

  button.onpointerdown = event => {
    if (!event.isPrimary || event.button !== 0) return;
    start = {id: event.pointerId, x: event.clientX, y: event.clientY};
    dragging = false;
    suppressClick = false;
  };

  button.onpointermove = event => {
    if (start?.id !== event.pointerId) return;
    const dx = event.clientX - start.x;
    const dy = event.clientY - start.y;
    const vertical = Math.abs(dy) >= Math.abs(dx);
    const direction = vertical ? (dy < 0 ? 'up' : 'down') : (dx < 0 ? 'left' : 'right');
    if (!dragging) {
      if (vertical && !actions.up && Math.abs(dy) > 8) {
        start = null;
        return;
      }
      if (Math.max(Math.abs(dx), actions.up ? Math.abs(dy) : 0) < 8) return;
      dragging = true;
      suppressClick = true;
      button.setPointerCapture(event.pointerId);
      row.classList.add('dragging');
    }
    row.dataset.swipe = actions[direction] ? direction : '';
    const offset = actions[direction] && !vertical ? dx : 0;
    button.style.setProperty('--swipe-x', Math.max(-96, Math.min(96, offset)) + 'px');
  };

  function finish(event, commit) {
    if (start?.id !== event.pointerId) return;
    const dx = event.clientX - start.x;
    const dy = event.clientY - start.y;
    const vertical = Math.abs(dy) >= Math.abs(dx);
    const direction = vertical ? (dy < 0 ? 'up' : 'down') : (dx < 0 ? 'left' : 'right');
    const shouldOpen = commit && dragging && Math.abs(vertical ? dy : dx) >= (thresholds[direction] ?? 64);
    start = null;
    dragging = false;
    row.classList.remove('dragging');
    delete row.dataset.swipe;
    button.style.removeProperty('--swipe-x');
    if (shouldOpen) actions[direction]?.();
  }

  button.onpointerup = event => finish(event, true);
  button.onpointerleave = event => { if (!dragging) finish(event, false); };
  button.onpointercancel = event => finish(event, false);
  button.onlostpointercapture = event => finish(event, false);
  row.addEventListener('click', event => {
    if (!suppressClick || event.detail === 0) return;
    suppressClick = false;
    event.preventDefault();
    event.stopPropagation();
  }, true);

  button.onkeydown = event => {
    const action = event.key === 'ArrowLeft' ? actions.left : event.key === 'ArrowRight' ? actions.right
      : event.key === 'ArrowUp' ? actions.up : null;
    if (!action) return;
    event.preventDefault();
    action();
  };
}

function renderHistory() {
  const matches = matchingHistory();
  clearContents(historyList);
  if (!matches.length) {
    const note = document.createElement('p');
    note.textContent = historySearch.value.trim() ? 'No matching chats.' : 'No saved chats yet. Send a message to start one.';
    historyList.append(note);
  }
  for (const chat of matches) {
    const row = document.createElement('div');
    row.className = 'swipe-row';
    let held = false;
    const open = historyButton(chat.title, event => {
      if (held && event.detail) {
        held = false;
        return;
      }
      if (selectingHistory) {
        toggleHistoryChat(chat.id);
        return;
      }
      showChat(chat);
      historyDialog.close();
      promptBox.focus();
    });
    open.className = 'swipe-button';
    open.dataset.chat = chat.id;
    open.title = chat.title;
    if (chat.id === activeId) open.setAttribute('aria-current', 'true');
    open.setAttribute('aria-description', 'Hold to select. Swipe right to rename or left to delete.');
    open.setAttribute('aria-keyshortcuts', 'ArrowRight ArrowLeft Shift+Space');
    row.append(swipeCue(false), swipeCue(true), open);
    attachSwipeGesture(row, open, {
      left: () => { if (!selectingHistory) editChat(chat, true); },
      right: () => { if (!selectingHistory) editChat(chat, false); }
    });
    let timer;
    let origin;
    const cancelHold = () => { clearTimeout(timer); origin = null; };
    const select = () => {
      open.classList.remove('selection-pulse');
      open.classList.add('selection-pulse');
      toggleHistoryChat(chat.id);
    };
    open.addEventListener('animationend', () => open.classList.remove('selection-pulse'));
    open.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0) return;
      held = false;
      if (selectingHistory) return;
      origin = [event.clientX, event.clientY];
      timer = setTimeout(() => {
        held = true;
        select();
      }, 500);
    });
    open.addEventListener('pointermove', event => {
      if (origin && Math.hypot(event.clientX - origin[0], event.clientY - origin[1]) >= 8) cancelHold();
    });
    for (const event of ['pointerup', 'pointercancel', 'pointerleave', 'lostpointercapture']) {
      open.addEventListener(event, cancelHold);
    }
    open.addEventListener('contextmenu', event => event.preventDefault());
    open.addEventListener('keydown', event => {
      if (event.key !== ' ' || !event.shiftKey) return;
      event.preventDefault();
      if (!event.repeat) select();
    });
    historyList.append(row);
  }
  updateHistorySelection();
}

function dismissOnBackdrop(dialog) {
  function isBackdrop(event) {
    if (event.target !== dialog) return false;
    const bounds = dialog.getBoundingClientRect();
    return event.clientX < bounds.left || event.clientX >= bounds.right
      || event.clientY < bounds.top || event.clientY >= bounds.bottom;
  }

  let startedOnBackdrop = false;
  dialog.addEventListener('pointerdown', event => {
    startedOnBackdrop = isBackdrop(event);
  });
  dialog.addEventListener('click', event => {
    if (startedOnBackdrop && isBackdrop(event)) dialog.close();
    startedOnBackdrop = false;
  });
}

  return list;
}

    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',', 2)[1]);

    reader.readAsDataURL(file);
  });
}

    if (typeof name !== 'string' || typeof id !== 'string' || !name.trim()) return null;

  const fallback = {chart:'Bar chart',mindmap:'Mind map',flowchart:'Flowchart',orgchart:'Org chart',sequence:'Sequence diagram'};
  const value = typeof spec.title === 'string' && spec.title.trim() ? spec.title : fallback[type];

      const width = (Math.abs(value) / span * 100).toFixed(2);
      return '<li><span>' + escape(labels[index].slice(0, 60)) + '</span>'
        + '<span class="bar-track" aria-hidden="true"><i class="' + (value < 0 ? 'negative' : '')
        + '" style="left:' + start + '%;width:' + width + '%"></i></span>'
        + '<span class="bar-value">' + value + '</span></li>';
    }).join('');
    return '<figure class="chat-visual"><figcaption>' + title + '</figcaption><ul class="chat-chart">' + rows + '</ul></figure>';
  }

  let count = 0;
  function tree(children, depth) {
    if (!Array.isArray(children) || depth > 4 || children.length > 12) return null;
    if (!children.length) return '';
    let nodes = '';
    for (const child of children) {
      if (++count > 32) return null;

      if (typeof label !== 'string' || !label.trim()) return null;

}

  viewerImage.style.height = height * fit + 'px';
  const horizontal = Math.max(0, (rotatedWidth * fit * viewerScale - imageViewer.clientWidth) / 2);
  const vertical = Math.max(0, (rotatedHeight * fit * viewerScale - imageViewer.clientHeight) / 2);

  viewerY = Math.max(-vertical, Math.min(vertical, viewerY));

};
imageViewer.onpointerup = imageViewer.onpointercancel = imageViewer.onlostpointercapture = event => {
  if (!viewerPointers.delete(event.pointerId) || !viewerPinch) return;
  const rotation = Math.round(viewerAngle / 90) * 90;
  if (rotation !== viewerRotation) viewerX = viewerY = 0;
  viewerRotation = viewerAngle = rotation;
  viewerPinch = null;
  renderImageViewer();
};
imageViewer.onclick = event => {
  if (event.target === imageViewer && !viewerMoved) imageViewer.close();
};
imageViewer.oncontextmenu = event => event.preventDefault();
imageViewer.onclose = () => {
  viewerPointers.clear();
  viewerPinch = null;
  viewerImage.removeAttribute('src');
};

function appendReplyImage(answer, source, turn) {
  const info = replyImageInfo(source);
  const image = document.createElement('img');
  image.className = 'reply-image';
  image.alt = 'Image from ' + (turn.model || 'the provider');
  image.draggable = false;
  image.tabIndex = 0;
  image.setAttribute('role', 'button');
  image.setAttribute('aria-label', image.alt + '. Open preview.');
  const footer = document.createElement('div');
  footer.className = 'image-footer';
  const meta = document.createElement('small');
  footer.append(meta);
  if (info) {
    const download = document.createElement('button');
    download.type = 'button';
    download.className = 'image-download';
    const symbol = document.createElement('span');
    symbol.textContent = '↓';
    symbol.setAttribute('aria-hidden', 'true');
    download.append(symbol);
    download.setAttribute('aria-label', 'Download image');
    download.onclick = () => downloadReplyImage(source, info);
    footer.append(download);
  }
  const refresh = () => {
    const file = info ? [info.format.toUpperCase(),
      info.bytes >= 1_048_576 ? (info.bytes / 1_048_576).toFixed(2) + ' MiB'
        : info.bytes >= 1024 ? Math.round(info.bytes / 1024) + ' KiB' : info.bytes + ' B'] : [];
    const dimensions = image.naturalWidth ? [image.naturalWidth + ' × ' + image.naturalHeight + ' px'] : [];
    meta.textContent = [...replyStats(turn), ...dimensions, ...file].join(' · ');
  };
  image.onload = refresh;
  let lastTap = -Infinity;
  image.onclick = () => {
    const now = performance.now();
    if (now - lastTap < 350) {
      lastTap = -Infinity;
      openImageViewer(image);
    } else lastTap = now;
  };
  image.onkeydown = event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    openImageViewer(image);
  };
  onLongPress(image, () => openImageViewer(image));
  image.src = source;
  refresh();
  answer.append(image, footer);
}

function showTurn(turn, target = messages) {
  showFileNames(appendMessage('', turn.question, true, target), turn.files);
  const answer = appendMessage(turn.model || 'ASSISTANT', turn.reply, false, target);
  const images = replyImages.get(turn) ?? [];
  if (turn.reply) renderReplyMarkup(answer, turn.reply);
  else if (images.length) answer.lastElementChild.remove();
  else if (turn.imageCount) answer.lastElementChild.textContent = 'Image reply was available in the original session.';
  for (const src of images) {
    if (src.startsWith('data:')) {
      appendReplyImage(answer, src, turn);
    } else {
      const link = document.createElement('a');
      link.className = 'reply-image-link';
      link.href = src;
      if (!window.HackGptAndroid) link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = 'Open image · ' + new URL(src).hostname;
      answer.append(link);
    }
  }
  if (turn.reasoningSummary) {
    const detail = document.createElement('details');
    const heading = document.createElement('summary');
    heading.textContent = 'Reasoning summary';
    const text = document.createElement('p');
    text.textContent = turn.reasoningSummary;
    detail.append(heading, text);
    answer.append(detail);
  }
  const items = replyStats(turn);
  if (items.length && !images.some(src => src.startsWith('data:'))) {
    const meta = document.createElement('small');
    meta.className = 'reply-meta';
    meta.textContent = items.join(' · ');
    answer.append(meta);
  }
}

function replyStats(turn) {
  const stats = turn.stats ?? {};
  return [
    stats.durationMs == null ? '' : (stats.durationMs / 1000).toFixed(2) + ' s',
    stats.firstTokenMs == null ? '' : 'First token ' + (stats.firstTokenMs / 1000).toFixed(2) + ' s',
    stats.inputTokens == null ? '' : stats.inputTokens + ' in',
    stats.outputTokens == null ? '' : stats.outputTokens + ' out',
    stats.totalTokens == null || (stats.inputTokens != null && stats.outputTokens != null)
      ? '' : stats.totalTokens + ' tokens total',
    stats.reasoningTokens ? stats.reasoningTokens + ' reasoning' : '',
    stats.tokensPerSecond == null ? '' : stats.tokensPerSecond + ' tok/s',
    stats.imageQuality ? 'Quality ' + stats.imageQuality : '',
    stats.costMicroIdr != null ? 'Rp ' + (stats.costMicroIdr / 1_000_000).toLocaleString()
      : stats.reportedCost != null && turn.provider === 'openrouter' ? '$' + stats.reportedCost.toLocaleString(undefined, {maximumFractionDigits: 8}) : '',
    turn.stopped ? 'Stopped' : ''
  ].filter(Boolean);
}

function markdownLabel(value) {
  return String(value).replace(/\s+/g, ' ').trim()
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/[\\\x60*_[\]#~|]/g, '\\$&');
}

function markdownExportEntry(chat, exportedAt) {
  const createdAt = Date.parse(chat.createdAt);
  const date = Number.isFinite(createdAt) ? new Date(createdAt) : exportedAt;
  const title = typeof chat.title === 'string' && chat.title.trim() ? chat.title.trim() : 'Chat';
  const safeTitle = Array.from(title.replace(/[\\/:*?"<>|\x00-\x1f\x7f-\x9f]/g, '_'))
    .slice(0, 50).join('').replace(/[. ]+$/, '') || 'Chat';
  const sections = ['# ' + markdownLabel(title),
    (Number.isFinite(createdAt) ? 'Created' : 'Exported') + ' (UTC) · ' + date.toISOString()];
  for (const [index, turn] of chat.turns.entries()) {
    sections.push('## Turn ' + (index + 1) + ' · You', turn.question ?? '');
    if (turn.files?.length) sections.push('Attachments · ' + turn.files.map(markdownLabel).join(', '));
    sections.push('## Turn ' + (index + 1) + ' · ' + markdownLabel(turn.model || 'Assistant'));
    if (turn.reply) sections.push(turn.reply);
    const images = replyImages.get(turn) ?? [];
    for (const image of images) {
      sections.push('![Generated image](<' + image.replace(/[<>]/g,
        character => character === '<' ? '%3C' : '%3E') + '>)');
    }
    if (!images.length && turn.imageCount) sections.push('Generated image available in the original session.');
    if (turn.reasoningSummary) sections.push('### Reasoning summary', turn.reasoningSummary);
    const stats = replyStats(turn);
    if (stats.length) sections.push('Response details · ' + stats.join(' · '));
  }
  return {name: exportTimestamp(date) + ' - ' + safeTitle + '.md', markdown: sections.join('\n\n') + '\n'};
}

function exportTimestamp(date) {
  return date.toISOString().slice(0, 19).replace(/:/g, '-') + 'Z';
}

function exportChatMarkdown(conversations, report, archive = false) {
  if (!conversations.length) {
    report('Open a conversation with a reply before exporting.');
    return;
  }
  if (archive && !window.HackGptAndroid?.saveChatExport) {
    report('ZIP export is available in the Android app.');
    return;
  }
  const now = new Date();
  const entries = conversations.map(chat => markdownExportEntry(chat, now));
  const name = archive ? exportTimestamp(now) + ' - HackGpt chats.zip' : entries[0].name;
  const content = archive ? JSON.stringify(entries) : entries[0].markdown;
  if (content.length > 8_000_000) {
    report(archive ? 'This export is too large. Select fewer chats and try again.' : 'This chat is too large to export.');
    return;
  }
  report('');
  if (window.HackGptAndroid?.saveChatExport) {
    window.HackGptAndroid.saveChatExport(name, content, archive);
  } else if (window.HackGptAndroid) {
    report('Update the Android app to export Markdown.');
  } else {
    const url = URL.createObjectURL(new Blob([content], {type: 'text/markdown;charset=utf-8'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
}

function setSending(value) {
  sending = value;
  for (const id of ['history-button', 'provider', 'model-button']) find(id).disabled = value;
  reset.disabled = value;
  messages.setAttribute('aria-busy', String(value));
  stopResponse.hidden = !value;
  updateModelStatus();
  renderAttachments();
}

async function receiveReply(payload, onEvent, signal) {
  if (window.HackGptAndroid) {
    const imageParts = [];
    return androidRequest('chat/stream', payload, event => {
      if (event.type === 'image-chunk') {
        imageParts.push(event.text);
      } else if (event.type === 'image' && imageParts.length) {
        imageParts.push(event.text);
        onEvent({type: 'image', text: imageParts.join('')});
        imageParts.length = 0;
      } else {
        onEvent(event);
      }
    }, signal);
  }
  const response = await fetch('/api/chat/stream', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload), signal
  });
  if (!response.ok) {
    const data = await response.json().catch(() => null);
    throw new Error(data?.error || 'The chat request failed.');
  }
  const decoded = response.body.pipeThrough(new TextDecoderStream());
  let buffer = '';
  let stats = null;
  for await (const chunk of decoded) {
    buffer += chunk;
    let breakIndex;
    while ((breakIndex = buffer.indexOf('\n')) !== -1) {
      const line = buffer.slice(0, breakIndex).trim();
      buffer = buffer.slice(breakIndex + 1);
      if (!line) continue;
      const event = JSON.parse(line);
      if (event.type === 'error') throw new Error(event.message);
      if (event.type === 'done') stats = event.stats;
      else onEvent(event);
    }
  }
  if (!stats) throw new Error('The response ended before the model finished.');
  return stats;
}

stopResponse.onclick = () => requestAbort?.abort();

find('composer').onsubmit = async event => {
  event.preventDefault();
  if (sending || readingFiles) return;
  const text = promptBox.value.trim() || (attachments.length ? 'Review the attached files.' : '');
  const model = currentModel();
  if (!text || !model?.connection) return;
  if (!attachments.every(file => acceptsFile(file, model))) {
    showChatError('Remove attachments this model cannot use, or choose a compatible model.');
    return;
  }
  const connection = model.connection;
  const source = model.profile?.id ?? null;
  let chat = chats.find(item => item.id === activeId && (item.source ?? null) === source);
  const files = [...attachments];
  const turn = {question: text, files: files.map(file => file.name), model: model.name,
    reply: '', provider: connection.type};
  showChatError('');

  {
    const previous = (chat?.turns ?? []).flatMap(item => [
      {role: 'user', content: item.question, files: (turnFiles.get(item) ?? []).filter(file => acceptsFile(file, model))},
      ...(item.reply ? [{role: 'assistant', content: item.reply}] : [])
    ]);
    const originalChat = chats.find(item => item.id === activeId);
    const originalDraft = promptBox.value;
    promptBox.value = '';
    if (!chat) clearContents(messages);
    requestAbort = new AbortController();
    setSending(true);
    showFileNames(appendMessage('', text, true), turn.files);
    const pending = appendMessage(model.name, model.imageOnly ? 'Generating image…' : 'Waiting for reply…', false);
    pending.classList.add('streaming-reply');
    const body = pending.lastElementChild;
    body.className = 'pending-reply';
    body.tabIndex = 0;
    body.setAttribute('aria-label', 'Reply progress');
    messages.scrollTop = messages.scrollHeight;
    const images = [];
    try {
      turn.stats = await receiveReply({
        connection: connection.id, model: model.id,
        messages: [...previous, {role: 'user', content: model.imageOnly ? text : promptWithVisualFormats(text), files}]
      }, update => {
        const pinned = messages.scrollHeight - messages.clientHeight - messages.scrollTop < 48;
        if (update.type === 'image') {
          const source = replyImageSource(update.text);
          if (!source || images.length >= 4 || images.includes(source)) return;
          images.push(source);
          if (!turn.reply) body.textContent = 'Image received…';
        } else if (update.type === 'thinking' && !turn.reply && !turn.reasoningSummary && !images.length) {
          body.textContent = 'Reasoning…';
        } else if (update.type === 'summary') {
          const firstSummary = !turn.reasoningSummary;
          turn.reasoningSummary = (turn.reasoningSummary ?? '') + update.text;
          if (turn.reply) return;
          if (firstSummary) body.textContent = '';
          body.append(update.text);
        } else if (update.type === 'delta') {
          if (!turn.reply) {
            body.textContent = '';
            body.classList.remove('pending-reply');
          }
          turn.reply += update.text;
          body.append(update.text);
        } else {
          return;
        }
        body.scrollTop = body.scrollHeight;
        if (pinned) messages.scrollTop = messages.scrollHeight;
      }, requestAbort.signal);
      if (!turn.reply.trim() && !images.length) throw new Error('The provider returned no displayable image or text.');
    } catch (error) {
      if (requestAbort.signal.aborted && (turn.reply.trim() || images.length)) {
        turn.stopped = true;
      } else {
        showChat(originalChat, false, true);
        if (!promptBox.value) promptBox.value = originalDraft;
        attachments.push(...files);
        showChatError(requestAbort.signal.aborted ? 'Response stopped.' : error.message);
        return;
      }
    } finally {
      setSending(false);
      if (connection.base === routrBase || (connection.base === kenariBase && model.profile.id !== demoProfileId)) {
        updateChatCredit(model, true);
      }
      requestAbort = null;
    }
    if (images.length) {
      rememberReplyImages(turn, images);
      turn.imageCount = images.length;
    }
  }

  if (!chat) chat = {id: newId(), title: text.replace(/\s+/g, ' ').slice(0, 60), source, createdAt: new Date().toISOString(), turns: []};
  if (files.length) turnFiles.set(turn, files);
  chat.turns.push(turn);
  chats = [chat, ...chats.filter(item => item.id !== chat.id)];
  saveChats();
  showChat(chat, false, true);
};


const CREDITS_HOLD_MS = 2000;
const CREDITS_FLASH_MS = 420;
let holdTimer;
let heldPointer;
let heldKey;
let holdOrigin;
let touchId;
let skipNewChatClick = false;

function openNewChat(credits = false) {
  if (sending) return;
  showChat(null, credits);
  if (!credits) promptBox.focus();
}

function revealCredits() {
  if (window.HackGptAndroid?.playCreditsHaptic) window.HackGptAndroid.playCreditsHaptic();
  else navigator.vibrate?.(120);
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    openNewChat(true);
    return;
  }
  document.body.classList.add('credits-flash');
  setTimeout(() => {
    document.body.classList.remove('credits-flash');
    openNewChat(true);
  }, CREDITS_FLASH_MS);
}

function endNewChatHold() {
  clearTimeout(holdTimer);
  holdTimer = undefined;
  heldPointer = undefined;
  heldKey = undefined;
  holdOrigin = undefined;
  touchId = undefined;
  reset.classList.remove('holding');
}

function beginNewChatHold() {
  skipNewChatClick = false;
  reset.classList.add('holding');
  holdTimer = setTimeout(() => {
    skipNewChatClick = true;
    reset.classList.remove('holding');
    revealCredits();
  }, CREDITS_HOLD_MS);
}

reset.addEventListener('touchstart', event => {
  if (reset.disabled) return;
  event.preventDefault();
  endNewChatHold();
  if (event.touches.length !== 1) return;
  const touch = event.changedTouches[0];
  touchId = touch.identifier;
  holdOrigin = [touch.clientX, touch.clientY];
  beginNewChatHold();
}, {passive: false});
reset.addEventListener('touchmove', event => {
  const touch = Array.from(event.changedTouches).find(item => item.identifier === touchId);
  if (!touch || !holdOrigin) return;
  event.preventDefault();
  if (Math.hypot(touch.clientX - holdOrigin[0], touch.clientY - holdOrigin[1]) > 18) {
    skipNewChatClick = true;
    endNewChatHold();
    touchId = undefined;
  }
}, {passive: false});
reset.addEventListener('touchend', event => {
  if (!Array.from(event.changedTouches).some(touch => touch.identifier === touchId)) return;
  event.preventDefault();
  touchId = undefined;
  const quickTap = !skipNewChatClick;
  endNewChatHold();
  skipNewChatClick = false;
  if (quickTap && !reset.disabled) openNewChat();
}, {passive: false});
reset.addEventListener('touchcancel', () => {
  touchId = undefined;
  endNewChatHold();
});

reset.onpointerdown = event => {
  if (reset.disabled || event.pointerType === 'touch' || !event.isPrimary || event.button !== 0) return;
  endNewChatHold();
  heldPointer = event.pointerId;
  holdOrigin = [event.clientX, event.clientY];
  reset.setPointerCapture(event.pointerId);
  beginNewChatHold();
};
reset.onpointermove = event => {
  if (event.pointerId !== heldPointer || !holdOrigin) return;
  if (Math.hypot(event.clientX - holdOrigin[0], event.clientY - holdOrigin[1]) > 18) {
    skipNewChatClick = true;
    endNewChatHold();
  }
};
reset.onpointerup = reset.onpointercancel = reset.onlostpointercapture = event => {
  if (event.pointerId === heldPointer) endNewChatHold();
};
reset.oncontextmenu = event => event.preventDefault();
reset.onkeydown = event => {
  if (reset.disabled || !['Enter', ' '].includes(event.key)) return;
  event.preventDefault();
  if (event.repeat || heldKey) return;
  endNewChatHold();
  heldKey = event.key;
  beginNewChatHold();
};
reset.onkeyup = event => {
  if (heldKey !== event.key) return;
  event.preventDefault();
  const quickTap = !skipNewChatClick;
  endNewChatHold();
  skipNewChatClick = false;
  if (quickTap && !reset.disabled) openNewChat();
};
reset.onblur = endNewChatHold;
window.addEventListener('blur', endNewChatHold);
reset.onclick = () => {
  if (skipNewChatClick) {
    skipNewChatClick = false;
    return;
  }
  openNewChat();
};

const art = find('signal').getContext('2d');
art.scale(2, 2);
art.strokeStyle = '#baff56';
art.fillStyle = '#baff56';
art.lineCap = 'round';
art.lineJoin = 'round';

function trace(points, width) {
  art.lineWidth = width;
  art.beginPath();
  art.moveTo(...points[0]);
  for (const point of points.slice(1)) art.lineTo(...point);
  art.stroke();
}
