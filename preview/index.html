    if (typeof name !== 'string' || typeof id !== 'string' || !name.trim()) return null;
    labels.set(id, name);
    if (!labels.has(name)) labels.set(name, name);
  }

  const rows = [];
  for (const link of links) {
    const from = link?.from ?? link?.source ?? link?.sender ?? link?.start;
    const to = link?.to ?? link?.target ?? link?.receiver ?? link?.end;
    const label = link?.label ?? link?.message ?? link?.text ?? link?.description ?? link?.condition ?? link?.action ?? '';
    if (!labels.has(from) || !labels.has(to) || typeof label !== 'string') return null;
    rows.push('<li><span class="diagram-node">' + escape(labels.get(from).slice(0, 90))
      + '</span><span class="diagram-arrow"><span aria-label="to">→</span>'
      + (label ? '<small>' + escape(label.slice(0, 120)) + '</small>' : '')
      + '</span><span class="diagram-node">' + escape(labels.get(to).slice(0, 90)) + '</span></li>');
  }
  return '<figure class="chat-visual"><figcaption>' + title + '</figcaption><ol class="diagram-connections">'
    + rows.join('') + '</ol></figure>';
}


function renderInlineVisual(kind, source, escape) {
  if (source.length > 12_000 || !['', 'json', 'diagram', 'chart', 'mindmap', 'flowchart', 'orgchart', 'sequence'].includes(kind)) return null;
  const spec = parseVisualSpec(source);
  if (!spec || typeof spec !== 'object' || Array.isArray(spec)) return null;
  const type = spec.type ?? kind;
  if (!['chart', 'mindmap', 'flowchart', 'orgchart', 'sequence'].includes(type)) return null;
  const fallback = {chart:'Bar chart',mindmap:'Mind map',flowchart:'Flowchart',orgchart:'Org chart',sequence:'Sequence diagram'};
  const value = typeof spec.title === 'string' && spec.title.trim() ? spec.title : fallback[type];
  const title = escape(value.slice(0, 100));
  if (type === 'flowchart' || type === 'sequence') {
    return renderDiagramConnections(spec, type, title, escape);
  }
  if (type === 'chart') {
    const {labels, values} = spec;
    if (!Array.isArray(labels) || !Array.isArray(values) || !labels.length
        || labels.length !== values.length || labels.length > 12
        || labels.some(label => typeof label !== 'string')
        || values.some(value => typeof value !== 'number' || !Number.isFinite(value) || Math.abs(value) > 1e12)) return null;
    const min = Math.min(0, ...values);
    const max = Math.max(0, ...values);
    const span = max - min || 1;
    const rows = values.map((value, index) => {
      const start = ((Math.min(value, 0) - min) / span * 100).toFixed(2);
      const width = (Math.abs(value) / span * 100).toFixed(2);
      return '<li><span>' + escape(labels[index].slice(0, 60)) + '</span>'
        + '<span class="bar-track" aria-hidden="true"><i class="' + (value < 0 ? 'negative' : '')
        + '" style="left:' + start + '%;width:' + width + '%"></i></span>'
        + '<span class="bar-value">' + value + '</span></li>';
    }).join('');
    return '<figure class="chat-visual"><figcaption>' + title + '</figcaption><ul class="chat-chart">' + rows + '</ul></figure>';
  }

  let count = 0;
  function tree(children, depth) {
    if (!Array.isArray(children) || depth > 4 || children.length > 12) return null;
    if (!children.length) return '';
    let nodes = '';
    for (const child of children) {
      if (++count > 32) return null;
      const label = typeof child === 'string' ? child : child?.label;
      if (typeof label !== 'string' || !label.trim()) return null;
      const branches = child?.children === undefined ? '' : tree(child.children, depth + 1);
      if (branches === null) return null;
      nodes += '<li><span>' + escape(label.slice(0, 100)) + '</span>' + branches + '</li>';
    }
    return '<ul>' + nodes + '</ul>';
  }
  const root = type === 'orgchart' ? spec.root : null;
  if (type === 'orgchart' && !root && !Array.isArray(spec.children)) return null;
  const branches = tree(root ? [root] : spec.children, 1);
  return branches ? '<figure class="chat-visual chat-mindmap"><figcaption>' + title + '</figcaption>' + branches + '</figure>' : null;
}

function promptWithVisualFormats(text) {
  const style = 'Use the user’s language and requested format. For ordinary chat replies, vary the layout when it helps the reader. '
    + 'Use short Markdown headings and **bold** or *italic* for emphasis, with an occasional relevant emoji or emoticon. '
    + 'Use a Markdown table for comparisons, a numbered list for choices, and fenced code blocks for actual code. '
    + 'Use Markdown blockquotes (>) for short callouts or dialogue bubbles with speaker names. '
    + 'Avoid adding sections or formats just for variety. Keep short answers simple. '
    + 'For exact-output requests, follow the requested format without extra Markdown or commentary.';
  const fence = String.fromCharCode(96).repeat(3);
  const examples = [
    {type:'chart',title:'Bar chart',labels:['A','B'],values:[3,5]},
    {type:'mindmap',title:'Mind map',children:[{label:'Branch',children:['Leaf']}]},
    {type:'flowchart',title:'Process',nodes:[{id:'a',label:'Start'},{id:'b',label:'Finish'}],edges:[{from:'a',to:'b',label:'Next'}]},
    {type:'orgchart',title:'Organization',root:{label:'Lead',children:[{label:'Team'}]}},
    {type:'sequence',title:'Sequence',participants:['User','App'],messages:[{from:'User',to:'App',label:'Open'}]}
  ];
  return text + '\n\n' + style + '\nIf a diagram or chart helps explain the answer, use a fenced json block containing one object '
    + 'with a type field. Use double-quoted JSON, short labels, and the schema for the requested visual. '
    + 'Use separate blocks when asked for multiple visuals. Supported examples:\n'
    + examples.map(example => fence + 'json\n' + JSON.stringify(example) + '\n' + fence).join('\n');
}

    return renderInlineVisual(kind, token.content, replyMarkdown.utils.escapeHtml)

    const marker = htmlLike ? '<u>' : '++';
    if (!state.src.startsWith(marker, state.pos)) return false;
    const start = state.pos + marker.length;
    const closing = htmlLike ? '</u>' : marker;
    const end = state.src.indexOf(closing, start);
    if (end <= start || end + closing.length > state.posMax

const replyImages = new WeakMap();
let replyImageDatabase;

function imageStorage(mode, operation) {
  replyImageDatabase ??= new Promise((resolve, reject) => {
    const request = indexedDB.open('hackgpt-reply-images', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('images');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  }).catch(error => {
    replyImageDatabase = null;
    throw error;
  });
  return replyImageDatabase.then(database => new Promise((resolve, reject) => {
    const transaction = database.transaction('images', mode);
    const request = operation(transaction.objectStore('images'));
    transaction.oncomplete = () => resolve(request?.result);
    transaction.onabort = () => reject(transaction.error);
  }));
}

async function saveReplyImages(turn, images) {
  replyImages.set(turn, images);
  turn.imageCount = images.length;
  const key = newId();
  await imageStorage('readwrite', store => store.put(images, key));
  turn.imageKey = key;
}

function loadChatImages(chat) {
  return Promise.all(chat.turns.map(async turn => {
    if (!turn.imageKey || replyImages.has(turn)) return;
    try {
      const images = await imageStorage('readonly', store => store.get(turn.imageKey));
      if (Array.isArray(images)) replyImages.set(turn, images);
    } catch {
      // The text of the conversation is still available if local image storage fails.
    }
  }));
}

function removeChatImages(chat) {
  const retained = new Set(chats.flatMap(item => item.turns.map(turn => turn.imageKey)));
  const keys = chat.turns.map(turn => turn.imageKey).filter(key => key && !retained.has(key));
  if (!keys.length) return;
  imageStorage('readwrite', store => {
    for (const key of keys) store.delete(key);
  }).catch(() => {});
}

function replyImageSource(value) {
  if (typeof value !== 'string' || value.length > 8_000_000) return null;
  if (/^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(value)) return value;
  try {
    const url = new URL(value);
    if (url.protocol === 'https:' && !url.username && !url.password && value.length <= 4096) return url.href;
  } catch { return null; }
  return null;
}

function replyImageInfo(source) {
  const header = /^data:(image\/(png|jpeg|gif|webp));base64,/.exec(source);
  if (!header) return null;
  const bytes = Math.floor((source.length - header[0].length) * 3 / 4)
    - (source.endsWith('==') ? 2 : source.endsWith('=') ? 1 : 0);
  return {mime: header[1], format: header[2], offset: header[0].length, bytes};
}

function downloadReplyImage(source, info) {
  const extension = info.format === 'jpeg' ? 'jpg' : info.format;
  const name = exportTimestamp(new Date()) + ' - HackGpt image.' + extension;
  if (window.HackGptAndroid?.saveReplyImage) {
    window.HackGptAndroid.saveReplyImage(name, info.mime, source.slice(info.offset));
  } else {
    const link = document.createElement('a');
    link.href = source;
    link.download = name;
    link.click();
  }
}

const imageViewer = find('image-viewer');
const viewerImage = imageViewer.querySelector('img');
const viewerPointers = new Map();
let viewerScale = 1;
let viewerAngle = 0;
let viewerRotation = 0;
let viewerX = 0;
let viewerY = 0;
let viewerPinch;
let viewerBackdropPress;

function renderImageViewer() {
  if (!viewerImage.naturalWidth || !imageViewer.open) return;
  const width = viewerImage.naturalWidth;
  const height = viewerImage.naturalHeight;
  const radians = viewerAngle * Math.PI / 180;
  const cosine = Math.abs(Math.cos(radians));
  const sine = Math.abs(Math.sin(radians));
  const rotatedWidth = width * cosine + height * sine;
  const rotatedHeight = width * sine + height * cosine;
  const fit = Math.min(1, imageViewer.clientWidth * 0.94 / rotatedWidth,
    imageViewer.clientHeight * 0.94 / rotatedHeight);
  viewerImage.style.width = width * fit + 'px';
  viewerImage.style.height = height * fit + 'px';
  const horizontal = Math.max(0, (rotatedWidth * fit * viewerScale - imageViewer.clientWidth) / 2);
  const vertical = Math.max(0, (rotatedHeight * fit * viewerScale - imageViewer.clientHeight) / 2);
  viewerX = Math.max(-horizontal, Math.min(horizontal, viewerX));
  viewerY = Math.max(-vertical, Math.min(vertical, viewerY));
  viewerImage.style.transform = 'translate(-50%,-50%) translate(' + viewerX + 'px,' + viewerY + 'px) rotate('
    + viewerAngle + 'deg) scale(' + viewerScale + ')';
}

function openImageViewer(image) {
  if (imageViewer.open) return;
  viewerScale = 1;
  viewerAngle = viewerRotation = viewerX = viewerY = 0;
  viewerBackdropPress = null;
  viewerImage.alt = image.alt;
  viewerImage.src = image.src;
  imageViewer.showModal();
  renderImageViewer();
}

function viewerGesture() {
  const [first, second] = viewerPointers.values();
  const x = second.x - first.x;
  const y = second.y - first.y;
  return {distance: Math.max(1, Math.hypot(x, y)), angle: Math.atan2(y, x) * 180 / Math.PI};
}

viewerImage.onload = renderImageViewer;
window.addEventListener('resize', renderImageViewer);
imageViewer.onpointerdown = event => {
  if (event.button !== 0 || viewerPointers.size >= 2) return;
  if (event.target !== viewerImage && !viewerPointers.size) {
    viewerBackdropPress = {id: event.pointerId, x: event.clientX, y: event.clientY};
    return;
  }
  viewerBackdropPress = null;
  event.target.setPointerCapture(event.pointerId);
  viewerPointers.set(event.pointerId, {x: event.clientX, y: event.clientY});
  if (viewerPointers.size === 2) {
    viewerPinch = {...viewerGesture(), scale: viewerScale, rotation: viewerRotation};
  }
};
imageViewer.onpointermove = event => {
  if (viewerBackdropPress?.id === event.pointerId &&
      Math.hypot(event.clientX - viewerBackdropPress.x, event.clientY - viewerBackdropPress.y) > 8) viewerBackdropPress = null;
  const previous = viewerPointers.get(event.pointerId);
  if (!previous) return;
  const point = {x: event.clientX, y: event.clientY};
  viewerPointers.set(event.pointerId, point);
  if (viewerPinch) {
    const gesture = viewerGesture();
    viewerScale = Math.min(6, Math.max(1, viewerPinch.scale * gesture.distance / viewerPinch.distance));
    const twist = ((gesture.angle - viewerPinch.angle + 540) % 360) - 180;
    viewerAngle = viewerPinch.rotation + twist;
  } else if (viewerScale > 1) {
    viewerX += point.x - previous.x;
    viewerY += point.y - previous.y;
  }
  renderImageViewer();
};
imageViewer.onpointerup = imageViewer.onpointercancel = imageViewer.onlostpointercapture = event => {
  if (event.type === 'pointercancel' && viewerBackdropPress?.id === event.pointerId) viewerBackdropPress = null;
  if (!viewerPointers.delete(event.pointerId) || !viewerPinch) return;
  const rotation = Math.round(viewerAngle / 90) * 90;
  if (rotation !== viewerRotation) viewerX = viewerY = 0;
  viewerRotation = viewerAngle = rotation;
  viewerPinch = null;
  renderImageViewer();
};
imageViewer.onclick = event => {
  if (event.target === imageViewer && viewerBackdropPress) imageViewer.close();
  viewerBackdropPress = null;
};
imageViewer.oncontextmenu = event => event.preventDefault();
imageViewer.onclose = () => {
  viewerPointers.clear();
  viewerBackdropPress = null;
  viewerPinch = null;
  viewerImage.removeAttribute('src');
};

function canChangeTurn(chat, turn) {
  const index = chat.turns.indexOf(turn);
  let boundary = chat.turns.length - 1;
  while (boundary >= 0 && chat.turns[boundary].handoff?.mode !== 'summary') boundary--;
  return activeId === chat.id && !sending && !window.hackGptCodexMode
    && index >= 0 && index >= boundary;
}

function branchTurn(chat, turn) {
  if (!canChangeTurn(chat, turn)) return;
  const turns = chat.turns.slice(0, chat.turns.indexOf(turn) + 1).map(item => {
    if (!item.stats?.factorySession) return item;

    const files = turnFiles.get(item);

  });
  const branch = {...chat, id: newId(), title: chat.title.replace(/ \(branch\)$/, '').slice(0, 80), branchFrom: branchPrefix(chat) + chat.title, branchDepth: branchDepth(chat) + 1, branchAt: turns.length,
    createdAt: new Date().toISOString(), turns};
  chats.unshift(branch);
  saveChats();
  showChat(branch);
}

}

function markdownLabel(value) {
  return String(value).replace(/\s+/g, ' ').trim()
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/[\\\x60*_[\]#~|]/g, '\\$&');
}

function markdownExportEntry(chat, exportedAt) {
  const createdAt = Date.parse(chat.createdAt);
  const date = Number.isFinite(createdAt) ? new Date(createdAt) : exportedAt;
  const title = typeof chat.title === 'string' && chat.title.trim() ? chat.title.trim() : 'Chat';
  const safeTitle = Array.from(title.replace(/[\\/:*?"<>|\x00-\x1f\x7f-\x9f]/g, '_'))
    .slice(0, 50).join('').replace(/[. ]+$/, '') || 'Chat';
  const sections = ['# ' + markdownLabel(title),
    (Number.isFinite(createdAt) ? 'Created' : 'Exported') + ' (UTC) · ' + date.toISOString()];
  for (const [index, turn] of chat.turns.entries()) {
    if (turn.handoff) {
      const {fromLabel, toLabel, mode, retain, image, summary} = turn.handoff;
      sections.push('## Model switch · ' + markdownLabel(fromLabel) + ' → ' + markdownLabel(toLabel),
        handoffModeName(mode, retain) + (image ? ' + 1 image' : ''));
      if (summary) sections.push(summary);
    }
    sections.push('## Turn ' + (index + 1) + ' · You', turn.question ?? '');
    if (turn.files?.length) sections.push('Attachments · ' + turn.files.map(markdownLabel).join(', '));
    sections.push('## Turn ' + (index + 1) + ' · ' + markdownLabel(turn.model || 'Assistant'));
    if (turn.reply) sections.push(turn.reply);
    const images = replyImages.get(turn) ?? [];
    for (const image of images) {
      sections.push('![Generated image](<' + image.replace(/[<>]/g,
        character => character === '<' ? '%3C' : '%3E') + '>)');
    }
    if (!images.length && turn.imageCount) sections.push('Generated image available in the original session.');
    if (turn.reasoningSummary) sections.push('### Reasoning summary', turn.reasoningSummary);
    const stats = replyStats(turn);
    if (stats.length) sections.push('Response details · ' + stats.join(' · '));
  }
  const prefix = exportTimestamp(date) + ' - ' + branchPrefix(chat, true);
  let exportTitle = '';
  for (const character of safeTitle) {
    if (prefix.length + exportTitle.length + character.length + 3 > 128) break;
    exportTitle += character;
  }
  return {name: prefix + exportTitle + '.md', markdown: sections.join('\n\n') + '\n'};
}

function exportTimestamp(date) {
  return date.toISOString().slice(0, 19).replace(/:/g, '-') + 'Z';
}

async function exportChatMarkdown(conversations, report, archive = false) {
  if (!conversations.length) {
    report('Open a conversation with a reply before exporting.');
    return;
  }
  if (archive && !window.HackGptAndroid?.saveChatExport) {
    report('ZIP export is available in the Android app.');
    return;
  }
  const now = new Date();
  await Promise.all(conversations.map(loadChatImages));
  const entries = conversations.map(chat => markdownExportEntry(chat, now));
  const name = archive ? exportTimestamp(now) + ' - HackGpt chats.zip' : entries[0].name;
  const content = archive ? JSON.stringify(entries) : entries[0].markdown;
  if (content.length > 8_000_000) {
    report(archive ? 'This export is too large. Select fewer chats and try again.' : 'This chat is too large to export.');
    return;
  }
  report('');
  if (window.HackGptAndroid?.saveChatExport) {
    window.HackGptAndroid.saveChatExport(name, content, archive);
  } else if (window.HackGptAndroid) {
    report('Update the Android app to export Markdown.');
  } else {
    const url = URL.createObjectURL(new Blob([content], {type: 'text/markdown;charset=utf-8'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
}

async function receiveReply(payload, onEvent, signal) {
  if (window.HackGptAndroid) {
    const imageParts = [];
    return androidRequest('chat/stream', payload, event => {
      if (event.type === 'image-chunk') {
        imageParts.push(event.text);
      } else if (event.type === 'image' && imageParts.length) {
        imageParts.push(event.text);
        onEvent({type: 'image', text: imageParts.join('')});
        imageParts.length = 0;
      } else {
        onEvent(event);
      }
    }, signal);
  }
  const response = await fetch('/api/chat/stream', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload), signal
  });
  if (!response.ok) {
    const data = await response.json().catch(() => null);
    throw new Error(data?.error || 'The chat request failed.');
  }
  const decoded = response.body.pipeThrough(new TextDecoderStream());
  let buffer = '';
  let stats = null;
  for await (const chunk of decoded) {
    buffer += chunk;
    let breakIndex;
    while ((breakIndex = buffer.indexOf('\n')) !== -1) {
      const line = buffer.slice(0, breakIndex).trim();
      buffer = buffer.slice(breakIndex + 1);
      if (!line) continue;
      const event = JSON.parse(line);
      if (event.type === 'error') throw new Error(event.message);
      if (event.type === 'done') stats = event.stats;
      else onEvent(event);
    }
  }
  if (!stats) throw new Error('The response ended before the model finished.');
  return stats;
}

async function sendChatMessage(event, edit) {
  event?.preventDefault();
  if (window.hackGptCodexMode) return window.hackGptCodexMode.send();
  if (sending || readingFiles || loadingChatImages) return;
  const text = edit?.text ?? (promptBox.value.trim() || (attachments.length ? 'Review the attached files.' : ''));
  const model = currentModel();
  if (!text || !model?.connection) return;
  if (!edit && !attachments.every(file => acceptsFile(file, model))) {
    showChatError('Remove attachments this model cannot use, or choose a compatible model.');
    return;
  }
  const connection = model.connection;
  const source = model.profile?.id ?? null;
  let chat = chats.find(item => item.id === activeId);
  if (edit && (chat !== edit.chat || !canChangeTurn(chat, edit.turn))) return;
  const editIndex = edit ? chat.turns.indexOf(edit.turn) : -1;
  const requestChat = edit ? {...chat, turns: chat.turns.slice(0, editIndex)} : chat;
  const files = edit ? (turnFiles.get(edit.turn) ?? []) : [...attachments];
  if (edit && files.length !== (edit.turn.files?.length ?? 0)) {
    showChatError('The original attachments are unavailable. Branch the chat to send a new message with files.');
    return;
  }
  if (!files.every(file => acceptsFile(file, model))) {
    showChatError('The selected model cannot use these attachments.');
    return;
  }
  if (!edit) syncModelHandoff(model);
  const handoff = edit ? null : pendingHandoff;
  let request;
  try {
    request = prepareModelRequest(requestChat, model, text, files, handoff, edit?.turn.handoff, !!edit);
  } catch (error) {
    showChatError(error.message);
    return;
  }
  let imageSaveFailed = false;
  const turn = {question: text, files: files.map(file => file.name), model: model.name,
    modelSelection: model.selection, providerName: model.profile.name, reply: '', provider: connection.type};
  if (request.boundary) turn.handoff = request.boundary;
  showChatError('');

  {
    const originalChat = chat;
    const originalDraft = promptBox.value;
    if (!edit) promptBox.value = '';
    if (edit && edit.row?.parentElement === messages) {
      while (messages.lastElementChild !== edit.row) messages.lastElementChild.remove();
      edit.row.remove();
    } else if (!chat) {
      clearContents(messages);
    }
    requestAbort = new AbortController();
    setSending(true);
    if (handoff) handoff.element.inert = true;
    showFileNames(appendMessage('', text, true), turn.files);
    const pending = appendMessage(model.name, model.imageOnly ? 'Generating image…' : 'Waiting for reply…', false);
    pending.classList.add('streaming-reply');
    const body = pending.lastElementChild;
    body.className = 'pending-reply';
    body.tabIndex = 0;
    body.setAttribute('aria-label', 'Reply progress');
    messages.scrollTop = messages.scrollHeight;
    const images = [];
    try {
      turn.stats = await receiveReply(request.payload, update => {
        const pinned = messages.scrollHeight - messages.clientHeight - messages.scrollTop < 48;
        if (update.type === 'image') {
          const source = replyImageSource(update.text);
          if (!source || images.length >= 4 || images.includes(source)) return;
          images.push(source);
          if (!turn.reply) body.textContent = 'Image received…';
        } else if (update.type === 'thinking' && !turn.reply && !turn.reasoningSummary && !images.length) {
          body.textContent = 'Reasoning…';
        } else if (update.type === 'summary') {
          const firstSummary = !turn.reasoningSummary;
          turn.reasoningSummary = (turn.reasoningSummary ?? '') + update.text;
          if (turn.reply) return;
          if (firstSummary) body.textContent = '';
          body.append(update.text);
        } else if (update.type === 'delta') {
          if (!turn.reply) {
            body.textContent = '';
            body.classList.remove('pending-reply');
          }
          turn.reply += update.text;
          body.append(update.text);
        } else {
          return;
        }
        body.scrollTop = body.scrollHeight;
        if (pinned) messages.scrollTop = messages.scrollHeight;
      }, requestAbort.signal);
      if (!turn.reply.trim() && !images.length) throw new Error('The provider returned no displayable image or text.');
    } catch (error) {
      if (!edit && requestAbort.signal.aborted && (turn.reply.trim() || images.length)) {
        turn.stopped = true;
      } else {
        showChat(originalChat, false, true, !!edit);
        if (!promptBox.value) promptBox.value = originalDraft;
        if (!edit) attachments.push(...files);
        images.length = 0;
        showChatError(requestAbort.signal.aborted ? 'Response stopped.' : error.message);
        return;
      }
    } finally {
      if (images.length) {
        try {
          await saveReplyImages(turn, images);
        } catch {
          imageSaveFailed = true;
        }
      }
      if (handoff) handoff.element.inert = false;
      setSending(false);
      if (connection.base === routrBase || connection.base === naraBase
          || (connection.base === kenariBase && model.profile.id !== demoProfileId)) {
        updateChatCredit(model, true);
      }
      requestAbort = null;
    }

  }

  if (!chat) chat = {id: newId(), title: text.replace(/\s+/g, ' ').slice(0, 60), source, createdAt: new Date().toISOString(), turns: []};
  if (files.length) turnFiles.set(turn, files);
  const removed = edit ? chat.turns.splice(editIndex) : [];
  if (edit && chat.branchAt > editIndex + 1) chat.branchAt = editIndex + 1;
  chat.turns.push(turn);
  chats = [chat, ...chats.filter(item => item.id !== chat.id)];
  if (saveChats() && removed.length) removeChatImages({turns: removed});
  await showChat(chat, false, true, !!edit);
  if (imageSaveFailed && activeId === chat.id) showChatError('Images could not be saved on this device.');
};


const CREDITS_HOLD_MS = 2000;
const CREDITS_FLASH_MS = 420;
let holdTimer;
let heldPointer;
let heldKey;
let holdOrigin;
let touchId;
let skipNewChatClick = false;

function openNewChat(credits = false) {
  if (sending) return;
  showChat(null, credits);
  if (!credits) promptBox.focus();
}

function revealCredits() {
  if (window.HackGptAndroid?.playCreditsHaptic) window.HackGptAndroid.playCreditsHaptic();
  else navigator.vibrate?.(120);
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    openNewChat(true);
    return;
  }
  document.body.classList.add('credits-flash');
  setTimeout(() => {
    document.body.classList.remove('credits-flash');
    openNewChat(true);
  }, CREDITS_FLASH_MS);
}

function endNewChatHold() {
  clearTimeout(holdTimer);
  holdTimer = undefined;
  heldPointer = undefined;
  heldKey = undefined;
  holdOrigin = undefined;
  touchId = undefined;
  reset.classList.remove('holding');
}

function beginNewChatHold() {
  skipNewChatClick = false;
  reset.classList.add('holding');
  holdTimer = setTimeout(() => {
    skipNewChatClick = true;
    reset.classList.remove('holding');
    revealCredits();
  }, CREDITS_HOLD_MS);
}

reset.addEventListener('touchstart', event => {
  if (reset.disabled) return;
  event.preventDefault();
  endNewChatHold();
  if (event.touches.length !== 1) return;
  const touch = event.changedTouches[0];
  touchId = touch.identifier;
  holdOrigin = [touch.clientX, touch.clientY];
  beginNewChatHold();
}, {passive: false});
reset.addEventListener('touchmove', event => {
  const touch = Array.from(event.changedTouches).find(item => item.identifier === touchId);
  if (!touch || !holdOrigin) return;
  event.preventDefault();
  if (Math.hypot(touch.clientX - holdOrigin[0], touch.clientY - holdOrigin[1]) > 18) {
    skipNewChatClick = true;
    endNewChatHold();
    touchId = undefined;
  }
}, {passive: false});
reset.addEventListener('touchend', event => {
  if (!Array.from(event.changedTouches).some(touch => touch.identifier === touchId)) return;
  event.preventDefault();
  touchId = undefined;
  const quickTap = !skipNewChatClick;
  endNewChatHold();
  skipNewChatClick = false;
  if (quickTap && !reset.disabled) openNewChat();
}, {passive: false});
reset.addEventListener('touchcancel', () => {
  touchId = undefined;
  endNewChatHold();
});

reset.onpointerdown = event => {
  if (reset.disabled || event.pointerType === 'touch' || !event.isPrimary || event.button !== 0) return;
  endNewChatHold();
  heldPointer = event.pointerId;
  holdOrigin = [event.clientX, event.clientY];
  reset.setPointerCapture(event.pointerId);
  beginNewChatHold();
};
reset.onpointermove = event => {
  if (event.pointerId !== heldPointer || !holdOrigin) return;
  if (Math.hypot(event.clientX - holdOrigin[0], event.clientY - holdOrigin[1]) > 18) {
    skipNewChatClick = true;
    endNewChatHold();
  }
};
reset.onpointerup = reset.onpointercancel = reset.onlostpointercapture = event => {
  if (event.pointerId === heldPointer) endNewChatHold();
};
reset.oncontextmenu = event => event.preventDefault();
reset.onkeydown = event => {
  if (reset.disabled || !['Enter', ' '].includes(event.key)) return;
  event.preventDefault();
  if (event.repeat || heldKey) return;
  endNewChatHold();
  heldKey = event.key;
  beginNewChatHold();
};
reset.onkeyup = event => {
  if (heldKey !== event.key) return;
  event.preventDefault();
  const quickTap = !skipNewChatClick;
  endNewChatHold();
  skipNewChatClick = false;
  if (quickTap && !reset.disabled) openNewChat();
};
reset.onblur = endNewChatHold;
window.addEventListener('blur', endNewChatHold);
reset.onclick = () => {
  if (skipNewChatClick) {
    skipNewChatClick = false;
    return;
  }
  openNewChat();
};

function drawSignal(canvas, codexMode = false) {
  const art = canvas.getContext('2d');
  art.scale(2, 2);
  art.strokeStyle = '#baff56';
  art.fillStyle = '#baff56';
  art.lineCap = 'round';
  art.lineJoin = 'round';

  function trace(points, width) {
    art.lineWidth = width;
    art.beginPath();
    art.moveTo(...points[0]);
    for (const point of points.slice(1)) art.lineTo(...point);
    art.stroke();
  }

  art.globalAlpha = .46;
  trace([[110,17],[169,49],[184,104],[169,160],[110,193],[51,160],[36,104],[51,49],[110,17]], 1);
  trace([[110,28],[159,56],[172,104],[159,152],[110,180],[61,152],[48,104],[61,56],[110,28]], .75);
  for (const [side, y] of [[-1,75],[1,75],[-1,134],[1,134]]) {
    const x = 110 + side * 60;
    const end = 110 + side * 91;
    trace([[x,y],[x + side * 9,y],[end - side * 8,y - 8],[end,y - 8]], 1);
    art.beginPath();
    art.arc(end,y - 8,2,0,Math.PI * 2);
    art.fill();
  }
  art.globalAlpha = 1;
  trace([[67,130],[72,92],[89,66],[110,56],[131,66],[148,92],[153,130],[135,140],[124,153],[96,153],[85,140],[67,130]], 2);
  trace([[82,107],[90,90],[110,83],[130,90],[138,107],[132,123],[110,132],[88,123],[82,107]], 1.4);
  if (codexMode) {
    art.lineWidth = 1.8;
    art.beginPath();
    art.moveTo(98, 115);
    art.bezierCurveTo(87, 115, 88, 101, 96, 100);
    art.bezierCurveTo(97, 91, 108, 88, 114, 95);
    art.bezierCurveTo(120, 92, 127, 96, 127, 102);
    art.bezierCurveTo(135, 106, 131, 119, 123, 119);
    art.lineTo(100, 119);
    art.bezierCurveTo(97, 119, 96, 117, 98, 115);
    art.closePath();
    art.stroke();
    trace([[101,102],[106,107],[101,112]], 1.8);
    trace([[112,112],[120,112]], 1.8);
  } else {
    trace([[98,99],[106,106],[98,113]], 2.4);
    trace([[113,114],[123,114]], 2);
  }
  art.globalAlpha = .54;
  trace([[93,145],[110,150],[127,145]], 1);
  trace([[101,36],[119,36]], 1.2);
  trace([[101,171],[119,171]], 1.2);
}

    if (!pendingCheck) {

    }

  let catalog = [], threadModel = '', threadEffort = '', quotaRevision = 0;
  let preference = {};

  function updateModelChoices() {
    const model = catalog.find(item => item.model === preference.model);
    const defaultChoice = label => new Option(label, '');
    const defaultModel = catalog.find(item => item.model === threadModel);
    codexModel.replaceChildren(defaultChoice('Server default' + (threadModel ? ' · ' + (defaultModel?.displayName || threadModel) : '')),
      ...catalog.map(item => new Option(item.displayName || item.model, item.model)));
    codexModel.value = model?.model ?? '';
    const available = (model || defaultModel || catalog.find(item => item.isDefault))?.supportedReasoningEfforts ?? [];
    const effort = model?.defaultReasoningEffort || threadEffort;
    codexEffort.replaceChildren(defaultChoice('Default' + (effort ? ' · ' + effort : '')),
      ...available.map(item => new Option(item.reasoningEffort, item.reasoningEffort)));
    codexEffort.value = available.some(item => item.reasoningEffort === preference.effort) ? preference.effort : '';
    codexModel.disabled = !connected || !catalog.length;
    codexEffort.disabled = !connected || !available.length;
    find('codex-model-status').textContent = [model?.displayName || model?.model || threadModel,
      codexEffort.value || effort].filter(Boolean).join(' · ');
  }

  function loadModelPreferences() {
    try { preference = JSON.parse(stored(sessionKey('model', threadId))) || {}; }
    catch { preference = {}; }
    updateModelChoices();
  }

  function saveModelPreferences() {
    preference = {model: codexModel.value, effort: codexEffort.value};
    remember(sessionKey('model', threadId), JSON.stringify(preference));
    updateModelChoices();
  }

  codexModel.onchange = () => { codexEffort.value = ''; saveModelPreferences(); };
  codexEffort.onchange = saveModelPreferences;

  async function loadModelCatalog(attempt) {
    const models = new Map();
    const cursors = new Set();
    let cursor;
    do {
      const result = await rpc('model/list', cursor ? {cursor} : {});
      if (attempt !== connectionAttempt) return;
      for (const model of result?.data ?? []) if (model.model && !model.hidden) models.set(model.model, model);
      cursor = result?.nextCursor;
      if (cursors.has(cursor)) break;
      cursors.add(cursor);
    } while (cursor);
    catalog = [...models.values()];
    updateModelChoices();
  }

  function showQuota(snapshot) {
    const windows = [snapshot?.primary, snapshot?.secondary];
    const lines = [[300, '5-hour'], [10080, 'Weekly']].map(([duration, label]) => {
      const entry = windows.find(window => window?.windowDurationMins === duration);
      if (!Number.isFinite(entry?.usedPercent)) return label + ': unavailable';
      const left = Math.max(0, Math.min(100, 100 - entry.usedPercent));
      const reset = Number.isFinite(entry.resetsAt) && entry.resetsAt > 0
        ? new Date(entry.resetsAt * 1000).toLocaleString() : '';
      return label + ': ' + left.toLocaleString(undefined, {maximumFractionDigits: 1}) + '% left'
        + (reset ? ' · resets ' + reset : '');
    });
    quota.textContent = lines.join('\n');
  }

  async function loadQuota() {
    if (!connected) return;
    const revision = ++quotaRevision;
    quotaRefresh.disabled = true;
    quota.textContent = 'Checking usage…';
    try {
      const response = await rpc('account/rateLimits/read', {});
      if (revision === quotaRevision) showQuota(response?.rateLimitsByLimitId?.codex ?? response?.rateLimits);
    } catch {
      if (revision === quotaRevision) showQuota(null);
    } finally {
      if (revision === quotaRevision) quotaRefresh.disabled = false;
    }
  }
  quotaRefresh.onclick = loadQuota;

  const notificationButton = find('codex-notifications');
  const notificationKey = 'neural-link.codex-task-notifications';
  let notificationsEnabled = stored(notificationKey) === 'true';
  let notificationState = '';
  function notifyTask(state) {
    if (!notificationsEnabled && state !== 'clear') return;
    if (notificationState === state) return;
    notificationState = state;
    bridge.showTaskNotification?.(state);
  }
  if (bridge.showTaskNotification) {
    notificationButton.hidden = false;
    notificationButton.setAttribute('aria-pressed', String(notificationsEnabled));
    notificationButton.onclick = () => {
      notificationsEnabled = !notificationsEnabled;
      remember(notificationKey, String(notificationsEnabled));
      notificationButton.setAttribute('aria-pressed', String(notificationsEnabled));
      if (notificationsEnabled) {
        bridge.requestTaskNotifications();
        if (connected && turnId) notifyTask('working');
      } else notifyTask('clear');
    };
  }

  const approvalButtons = [...find('codex-approval-mode').querySelectorAll('button')];
  const codexAttach = find('codex-attach');
  const codexFiles = new Map();
  const pendingCodexFiles = new Map();
  let regularAttachments = [], approvalMode = 'ask';

  function showApprovalMode() {
    approvalMode = stored(sessionKey('approval')) === 'always' ? 'always' : 'ask';
    for (const button of approvalButtons) {
      button.setAttribute('aria-pressed', String(button.dataset.approval === approvalMode));
    }
    find('codex-approval-detail').textContent = approvalMode === 'always'
      ? 'Approves supported requests from the active thread on this PC. Extra permissions are granted for the current turn.'
      : 'Each approval request needs your decision.';
  }
  for (const button of approvalButtons) button.onclick = () => {
    remember(sessionKey('approval'), button.dataset.approval);
    showApprovalMode();
    if (approvalMode === 'always') {
      for (const card of approvalCards.values()) approvePending.get(card)?.();
    }
  };

  function swapAttachments(next) {
    attachmentVersion++;
    attachments = next;
    renderAttachments();
  }

  function threadAttachments() {
    const key = sessionKey('attachments', threadId);
    if (!codexFiles.has(key)) codexFiles.set(key, []);
    return codexFiles.get(key);
  }

  codexAttach.onclick = () => {
    if (connected && !busy && !connecting && threadId) openAttachmentPicker();
  };

  let reconnectTimer, retryCount = 0, reconnectAllowed = false, reconnecting = false;
  let endpoint = '', outcome = '', queued = null;

  function sessionKey(kind, id = '') {
    return 'neural-link.codex.' + JSON.stringify([endpoint, project, kind, id]);
  }

  function saveDraft() {
    if (window.hackGptCodexMode && endpoint && project) remember(sessionKey('draft', threadId), prompt.value);
  }

  function readDraft() {
    return stored(sessionKey('draft', threadId)) ?? '';
  }

  function updateThreadName() {
    const folder = project.split(/[\\/]+/).filter(Boolean).at(-1) || project;
    const label = threadLabels.get(threadId) || threadId;
    const projectTitle = stored(sessionKey('project-title')) || folder;
    threadName.textContent = [projectTitle, label].filter(Boolean).join(' / ');
    threadName.title = threadName.textContent;
  }

  prompt.addEventListener('input', saveDraft);

  function updateSavedTokenHint() {
    tokenInput.placeholder = savedEndpoint && endpointInput.value.trim() === savedEndpoint
      ? 'Saved connection token' : 'Connection token';
  }

  function updateConnectionStatus() {
    connectionStatus.textContent = connecting ? 'Connecting…' : connected ? 'Connected' : 'Disconnected';
    connectionStatus.dataset.connected = String(connected);
    connectButton.disabled = connecting || (connected && busy);
    connectButton.textContent = connected ? 'Reconnect' : 'Connect';
  }

  try {
    const storedConnection = bridge.loadConnection();
    if (!storedConnection) throw new Error('Could not load the saved connection.');
    const saved = JSON.parse(storedConnection);
    endpointInput.value = saved.endpoint || '';
    projectInput.value = saved.project || '';
    if (saved.hasToken) {
      savedEndpoint = endpoint = saved.endpoint;
      project = saved.project || '';
      threadId = stored(sessionKey('thread')) || '';
    }
    updateSavedTokenHint();
  } catch (error) {
    connectionError.textContent = error.message;
  }
  endpointInput.addEventListener('input', updateSavedTokenHint);
  const codexIconToggle = find('appearance-codex');
  const codexIconKey = 'neural-link.codex-toolbar-icon';
  function showCodexIcon(show) {
    settingsButton.hidden = !show;
    codexIconToggle.setAttribute('aria-pressed', String(show));
  }
  showCodexIcon(stored(codexIconKey) !== 'false');
  codexIconToggle.hidden = false;
  codexIconToggle.onclick = () => {
    const show = settingsButton.hidden;
    remember(codexIconKey, String(show));
    showCodexIcon(show);
  };
  settingsButton.onclick = () => dialog.showModal();

  function setDraft(value) {
    prompt.value = value;
    prompt.dispatchEvent(new Event('input', {bubbles: true}));
  }

  function enterMode() {
    if (window.hackGptCodexMode) return;
    if (sending || readingFiles) {
      showChatError('Finish the current chat operation before opening Codex.');
      return;
    }
    dialog.close();
    regularScroll = messages.scrollTop;
    regularDraft = prompt.value;
    regularAttachments = attachments;
    swapAttachments(threadAttachments());
    regularMessages.append(...messages.childNodes);
    messages.append(log, approvals);
    window.hackGptCodexMode = {send, stop, exportChat, sync};
    updateAttachmentControl(currentModel());
    messages.closest('main').classList.add('codex-mode');
    status = sessionDetail;
    session.hidden = exit.hidden = false;
    prompt.setAttribute('aria-label', 'Message Codex');
    showChatError('');
    setDraft(readDraft());
    if (log.isConnected) messages.scrollTop = messages.scrollHeight;
    sync();
  }

  function leaveMode() {
    if (!window.hackGptCodexMode) return;
    saveDraft();
    log.remove();
    approvals.remove();
    messages.append(regularMessages);
    messages.scrollTop = regularScroll;
    window.hackGptCodexMode = null;
    swapAttachments(regularAttachments);
    updateAttachmentControl(currentModel());
    messages.closest('main').classList.remove('codex-mode');
    session.hidden = exit.hidden = true;
    status = connectionError;
    prompt.setAttribute('aria-label', 'Message');
    stopResponse.hidden = true;
    sync();
    showChatError('');
    setDraft(regularDraft);
  }

  function sync() {
    const inCodex = Boolean(window.hackGptCodexMode);
    if (inCodex) stopResponse.hidden = true;
    const codexSend = find('codex-send');
    codexSend.hidden = !inCodex || enterToSend.getAttribute('aria-pressed') === 'true';
    codexAttach.hidden = !inCodex;
    codexAttach.disabled = !connected || connecting || busy || !threadId;
    codexSend.disabled = !connected || connecting || busy || !threadId;
    find('codex-approval-panel').hidden = !connected;
    find('codex-model-panel').hidden = !connected;
    find('codex-new').disabled = pick.disabled = busy || !connected;
    find('codex-refresh').disabled = !connected;
    const needsApproval = connected && approvalCards.size > 0;
    if (connected && turnId) notifyTask(needsApproval ? 'approval' : 'working');
    const statusLabel = connecting ? (reconnecting ? 'Reconnecting…' : 'Connecting…')
      : !connected ? 'Disconnected · Retry' : needsApproval ? 'Approval needed'
        : busy ? 'Working' : outcome || (threadId ? 'Ready' : 'Choose a thread');
    const spinnerOnly = connected && !connecting && busy && !needsApproval;
    const dotOnly = statusLabel === 'Finished';
    sessionStatus.textContent = spinnerOnly || dotOnly ? '' : statusLabel;
    sessionStatus.dataset.finished = String(dotOnly);
    sessionStatus.setAttribute('aria-label', statusLabel);
    sessionStatus.dataset.working = String(spinnerOnly);
    sessionStatus.disabled = connecting;
    sessionStatus.title = spinnerOnly ? 'Tap twice to stop Codex'
      : needsApproval ? 'Review approval request' : connected ? 'Codex settings' : 'Retry connection';
    if (!spinnerOnly || stopTap?.turn !== turnId) stopTap = null;
    updateThreadName();
    updateConnectionStatus();
  }

  function rpc(method, params) {
    return new Promise((resolve, reject) => {
      const id = ++sequence;
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error('PC did not respond to ' + method + '.'));
      }, 30000);
      pending.set(id, {resolve, reject, timer});
      if (!bridge.send(JSON.stringify({id, method, params}))) {
        clearTimeout(timer);
        pending.delete(id);
        reject(new Error('Connection is closed.'));
      }
    });
  }

  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    if (!reconnectAllowed || connecting || connected || document.hidden || !endpoint || !project) return;
    reconnectTimer = setTimeout(() => connectToPc(endpoint, project, '', true),
      Math.min(15000, 1000 * 2 ** Math.min(retryCount++, 4)));
  }

  function disconnected(message) {
    if (turnId || busy) notifyTask(message ? 'unknown' : 'clear');
    connectionAttempt++;
    connecting = connected = busy = false;
    quotaRevision++;
    catalog = [];
    quotaRefresh.disabled = false;
    showQuota(null);
    updateModelChoices();

    turnId = '';
    queued = null;
    for (const request of pending.values()) {
      clearTimeout(request.timer);
      request.reject(new Error(message || 'Disconnected.'));
    }
    pending.clear();
    threadDialog.close();
    approvals.replaceChildren();
    approvalCards.clear();
    connectionError.textContent = message;
    sessionDetail.textContent = threadId ? 'Task status is unknown until you reconnect.' : message;
    sync();
    scheduleReconnect();
  }

  function connectToPc(nextEndpoint, nextProject, token, retry = false) {
    if (connecting || (connected && busy)) return;
    const error = bridge.connect(nextEndpoint, token, nextProject);
    if (error) {
      connectionError.textContent = error;
      sessionDetail.textContent = error;
      scheduleReconnect();
      return;
    }
    saveDraft();
    const changed = endpoint !== nextEndpoint || project !== nextProject;
    reconnectAllowed = false;
    disconnected('');
    endpoint = savedEndpoint = nextEndpoint;
    project = nextProject;
    showApprovalMode();
    if (changed) {
      threadLabels.clear();
      log.replaceChildren();
      threadId = stored(sessionKey('thread')) || '';
      if (window.hackGptCodexMode) { swapAttachments(threadAttachments()); setDraft(readDraft()); }
    }
    reconnectAllowed = connecting = true;
    reconnecting = retry;
    tokenInput.value = '';
    updateSavedTokenHint();
    sync();
  }

  let stopTap = null;
  let stopPending = '';
  sessionStatus.onclick = () => {
    if (sessionStatus.dataset.working === 'true') {
      if (!turnId || stopPending === turnId) return;
      const now = performance.now();
      if (stopTap?.turn === turnId && now - stopTap.time <= 450) {
        stopTap = null;
        stop();
      } else {
        stopTap = {turn: turnId, time: now};
      }
      return;
    }
    if (!connected) connectToPc(endpoint, project, '', true);
    else if (approvalCards.size) approvalCards.values().next().value?.scrollIntoView({block: 'center'});
    else dialog.showModal();
  };
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) scheduleReconnect();
    else saveDraft();
  });
  window.addEventListener('online', scheduleReconnect);

  const codexReplyTimers = new WeakMap();

  function nearCodexBottom() {
    return log.isConnected && messages.scrollHeight - messages.clientHeight - messages.scrollTop < 60;
  }

  function renderCodexReply(row, value, complete = true) {
    clearTimeout(codexReplyTimers.get(row));
    codexReplyTimers.delete(row);
    const pinned = nearCodexBottom();
    const original = row.lastElementChild;
    const scrollPositions = [...original.querySelectorAll('pre, .markdown-scroll')]
      .map(block => [block.scrollLeft, block.scrollTop]);
    const paragraph = document.createElement('p');
    paragraph.textContent = value;
    original.replaceWith(paragraph);
    renderReplyMarkup(row, value);
    [...row.lastElementChild.querySelectorAll('pre, .markdown-scroll')].forEach((block, index) => {
      const position = scrollPositions[index];
      if (position) [block.scrollLeft, block.scrollTop] = position;
      block.tabIndex = 0;
      if (block.tagName !== 'PRE') return;
      const code = block.querySelector('code');
      const language = [...(code?.classList ?? [])].find(name => name.startsWith('language-'))?.slice(9);
      block.setAttribute('aria-label', language ? language + ' code block' : 'Code block');
      if (!complete || !code) return;
      const frame = document.createElement('div');
      frame.className = 'codex-code';
      const tools = document.createElement('header');
      const label = document.createElement('small');
      label.textContent = language || 'Code';
      tools.append(label, historyButton('Copy code', () => copyTurnText(code.textContent, 'Code copied')));
      block.replaceWith(frame);
      frame.append(tools, block);
      if (position) [block.scrollLeft, block.scrollTop] = position;
    });
    if (pinned) messages.scrollTop = messages.scrollHeight;
  }

  function queueCodexReply(row) {
    if (codexReplyTimers.has(row)) return;
    codexReplyTimers.set(row, setTimeout(() => {
      renderCodexReply(row, messageText.get(row).value, false);
    }, 100));
  }

  function appendActivity(label, value) {
    if (!value) return;
    const row = append(label, value);
    row.classList.add('codex-activity');
    const details = document.createElement('details');
    const heading = document.createElement('summary');
    heading.textContent = label;
    const code = document.createElement('pre');
    code.tabIndex = 0;
    code.textContent = value;
    details.append(heading, code);
    row.replaceChildren(details);
  }

  function showCodexActivity(item) {
    if (item.type === 'fileChange') {
      const changes = item.changes ?? [];
      appendActivity('File changes · ' + changes.length, changes.map(change =>
        change.path + '\n' + (change.diff ?? '')).join('\n\n'));
    } else if (item.type === 'commandExecution') {
      appendActivity('Command · ' + item.status, item.command);
    }
  }

  function append(label, value) {
    const pinned = nearCodexBottom();
    const row = appendMessage(label, value, label === 'You', log);
    messageText.set(row, {label, value});
    if (label === 'Codex') {
      row.classList.add('codex-answer');
      if (value) renderCodexReply(row, value);
    }
    if (pinned) messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function exportChat() {
    const turns = [];
    for (const row of log.children) {
      const {label, value} = messageText.get(row);
      if (label === 'You') turns.push({question: value, model: 'Codex', reply: ''});
      else {
        if (!turns.length) turns.push({question: '', model: 'Codex', reply: ''});
        const turn = turns.at(-1);
        const content = label === 'Codex' ? value : '### ' + label + '\n\n' + value;
        turn.reply = [turn.reply, content].filter(Boolean).join('\n\n');
      }
    }
    exportChatMarkdown(turns.length ? [{title: threadLabels.get(threadId) || 'Codex', turns}] : [], showChatError);
  }

  async function refresh() {
    const result = await rpc('thread/list', {cwd: project, limit: 40});
    const currentLabel = threadLabels.get(threadId);
    threadLabels.clear();
    for (const thread of result.data) {
      threadLabels.set(thread.id, thread.name || thread.preview || thread.id);
    }
    if (threadId && !threadLabels.has(threadId)) threadLabels.set(threadId, currentLabel || threadId);
    updateThreadName();
    if (threadDialog.open) renderThreadPicker();
  }

  const renameThreadForm = find('codex-thread-rename');
  const renameThreadTitle = find('codex-thread-title');
  const threadFeedback = find('codex-thread-feedback');
  let renamingThread;

  function threadOrder() {
    try {
      const saved = JSON.parse(stored(sessionKey('thread-order')));
      if (Array.isArray(saved)) return new Map(saved);
    } catch {}
    return new Map();
  }

  function rememberThreadOrder(order) {
    remember(sessionKey('thread-order'), JSON.stringify([...order]));
  }

  function closeThreadRename() {
    renamingThread = null;
    renameThreadForm.hidden = true;
    threadFeedback.textContent = '';
  }
  find('codex-thread-rename-cancel').onclick = closeThreadRename;
  threadDialog.addEventListener('close', closeThreadRename);

  renameThreadForm.onsubmit = async event => {
    event.preventDefault();
    const id = renamingThread;
    const name = renameThreadTitle.value.trim();
    if (!id || !name || !connected) return;
    const attempt = connectionAttempt;
    const save = renameThreadForm.querySelector('[type="submit"]');
    save.disabled = true;
    try {
      await rpc('thread/name/set', {threadId: id, name});
      if (attempt !== connectionAttempt) return;
      threadLabels.set(id, name);
      const order = threadOrder();
      const entry = order.get(id);
      if (entry) {
        order.set(id, {...entry, label: name});
        rememberThreadOrder(order);
      }
      if (renamingThread === id) closeThreadRename();
      updateThreadName();
      if (threadDialog.open) renderThreadPicker();
    } catch (error) {
      if (attempt === connectionAttempt && renamingThread === id) threadFeedback.textContent = error.message;
    } finally {
      save.disabled = false;
    }
  };

  function renderThreadPicker() {
    threads.replaceChildren();
    const order = threadOrder();
    const entries = new Map(threadLabels);
    for (const [id, entry] of order) {
      if (entry.pinned && entry.label && !entries.has(id)) entries.set(id, entry.label);
    }
    if (!entries.size) {
      const emptyList = document.createElement('small');
      emptyList.textContent = 'No threads in this project yet.';
      threads.append(emptyList);
      return;
    }
    const sorted = [...entries].sort(([first], [second]) => {
      const a = order.get(first), b = order.get(second);
      return Number(Boolean(b?.pinned)) - Number(Boolean(a?.pinned))
        || (b?.opened || 0) - (a?.opened || 0);
    });
    for (const [id, label] of sorted) {
      const pinned = Boolean(order.get(id)?.pinned);
      const row = document.createElement('div');
      row.className = 'codex-thread-row';
      row.dataset.threadId = id;
      const open = historyButton(label, () => {
        threadDialog.close();
        if (id !== threadId) openThread(id).catch(onError);
      });
      open.className = 'codex-thread-open';
      open.title = label;
      open.setAttribute('aria-current', String(id === threadId));
      const pin = historyButton(pinned ? '◆' : '◇', () => {
        const latest = threadOrder();
        latest.set(id, {...latest.get(id), pinned: !pinned, label});
        rememberThreadOrder(latest);
        renderThreadPicker();
        [...threads.children].find(item => item.dataset.threadId === id)?.querySelector('.codex-thread-action')?.focus();
      });
      const rename = historyButton('✎', () => {
        renamingThread = id;
        threadFeedback.textContent = '';
        renameThreadTitle.value = label;
        renameThreadForm.hidden = false;
        renameThreadTitle.select();
      });
      pin.className = rename.className = 'codex-thread-action';
      pin.setAttribute('aria-pressed', String(pinned));
      pin.setAttribute('aria-label', (pinned ? 'Unpin ' : 'Pin ') + label);
      rename.setAttribute('aria-label', 'Rename ' + label);
      pin.title = pinned ? 'Unpin thread' : 'Pin thread';
      rename.title = 'Rename thread';
      row.append(open, pin, rename);
      threads.append(row);
    }
  }

  async function openThread(id) {
    if (busy) return;
    const attempt = connectionAttempt;
    const previousThread = threadId;
    saveDraft();
    queued = {id, events: []};
    busy = true;
    sync();
    try {
      const result = id
        ? await rpc('thread/resume', {...settings, cwd: project, threadId: id})
        : await rpc('thread/start', {...settings, cwd: project});
      if (attempt !== connectionAttempt) return;
      threadId = result.thread.id;
      threadModel = result.model || '';
      threadEffort = result.reasoningEffort || '';
      loadModelPreferences();
      remember(sessionKey('thread'), threadId);
      if (previousThread !== threadId && window.hackGptCodexMode) { swapAttachments(threadAttachments()); setDraft(readDraft()); }
      turnId = '';
      outcome = '';
      log.replaceChildren();
      replies.clear();
      fileChanges.clear();
      approvals.replaceChildren();
      approvalCards.clear();
      for (const turn of result.thread.turns ?? []) {
        for (const item of turn.items) {
          if (item.type === 'userMessage') {
            append('You', item.content.filter(part => part.type === 'text').map(part => part.text).join('\n'));
          } else if (item.type === 'agentMessage') {
            const row = append('Codex', item.text);
            if (turn.status === 'inProgress') replies.set(item.id, row);
          } else if (turn.status !== 'inProgress') showCodexActivity(item);
        }
        if (turn.status === 'inProgress') turnId = turn.id;
      }
      sessionDetail.textContent = '';
      const label = result.thread.name || threadLabels.get(threadId) || result.thread.preview || 'New thread';
      threadLabels.set(threadId, label);
      const order = threadOrder();
      const latestOpened = Math.max(Date.now(), ...[...order.values()].map(entry => (entry.opened || 0) + 1));
      order.set(threadId, {...order.get(threadId), opened: latestOpened, label});
      rememberThreadOrder(order);
      updateThreadName();
      const events = queued.events;
      queued = null;
      for (const event of events) window.hackGptCodexEvent('message', event);
      reconcileSend(result.thread);
    } finally {
      if (attempt === connectionAttempt) {
        queued = null;
        busy = Boolean(turnId);
        sync();
      }
    }
  }

  const approvePending = new WeakMap();

  function approval(message) {
    const {id, method, params} = message;
    const command = method === 'item/commandExecution/requestApproval';
    const file = method === 'item/fileChange/requestApproval';
    const permission = method === 'item/permissions/requestApproval';
    const respond = result => bridge.send(JSON.stringify({id, result}));
    if (!command && !file && !permission) {
      bridge.send(JSON.stringify({id, error: {code: -32601, message: 'Request type unavailable in HackGpt'}}));
      return;
    }
    const denied = permission ? {permissions: {}, scope: 'turn'} : {decision: 'decline'};
    if (!params?.threadId || params.threadId !== threadId) {
      respond(denied);
      return;
    }
    const accepted = permission ? {permissions: params.permissions ?? {}, scope: 'turn'} : {decision: 'accept'};
    const label = permission ? 'Permission approval' : command ? 'Command approval' : 'File change approval';
    const changes = fileChanges.get(params.itemId);
    const target = permission ? JSON.stringify(params.permissions ?? {}, null, 2)
      : command ? params.command : changes?.map(change => change.path + '\n' + change.diff).join('\n\n');
    const detailText = [target, params.cwd, params.grantRoot, params.reason, params.networkApprovalContext?.host]
      .filter(Boolean).join('\n');
    const card = document.createElement('article');

    function finish(result, automatic = false) {
      if (!connected || params.threadId !== threadId || !respond(result)) return false;
      card.remove();
      approvalCards.delete(id);
      if (automatic) appendActivity(label + ' · approved automatically', detailText || label);
      sync();
      return true;
    }

    if (approvalMode === 'always' && finish(accepted, true)) return;
    const detail = document.createElement('pre');
    detail.textContent = [label, detailText].filter(Boolean).join('\n');
    card.append(detail);
    for (const [title, result] of [['Approve once', accepted], ['Decline', denied]]) {
      card.append(historyButton(title, () => {
        if (!finish(result)) status.textContent = 'Approval could not be sent.';
      }));
    }
    approvePending.set(card, () => finish(accepted, true));
    approvalCards.set(id, card);
    approvals.append(card);
    sync();
  }

  function onError(error) { status.textContent = error.message; }

  window.hackGptCodexEvent = async (kind, data) => {
    if (kind === 'closed') {
      disconnected(data);
      return;
    }
    if (kind === 'open') {
      const attempt = connectionAttempt;
      try {
        await rpc('initialize', {clientInfo: {name: 'hackgpt', title: 'HackGpt', version: '0.1.0'}});
        bridge.send(JSON.stringify({method: 'initialized'}));
        await refresh();
        if (attempt !== connectionAttempt) return;
        connected = true;
        retryCount = 0;
        loadModelPreferences();
        loadModelCatalog(attempt).catch(() => {});
        loadQuota();
        sessionDetail.textContent = '';
        if (threadId) {
          try { await openThread(threadId); }
          catch (error) {
            if (attempt !== connectionAttempt) return;
            sessionDetail.textContent = 'Could not resume the saved thread. Choose a thread to continue.';
          }
        }
        if (attempt !== connectionAttempt) return;
        connecting = false;
        dialog.close();
        enterMode();
        sync();
      } catch (error) {
        if (attempt !== connectionAttempt) return;
        bridge.disconnect();
        disconnected(error.message);
      }
      return;
    }
    let message;
    try { message = JSON.parse(data); } catch { return; }
    if (queued?.id && message.params?.threadId === queued.id && message.method) {
      queued.events.push(data);
      return;
    }
    if ('id' in message) {
      if (message.method) {
        approval(message);
      } else {
        const request = pending.get(message.id);
        if (!request) return;
        pending.delete(message.id);
        clearTimeout(request.timer);
        if (message.error) request.reject(new Error(message.error.message));
        else request.resolve(message.result);
      }
      return;
    }
    const params = message.params;
    if (message.method === 'account/rateLimits/updated') {
      const snapshot = params?.rateLimits;
      if (snapshot && (!snapshot.limitId || snapshot.limitId === 'codex')) {
        quotaRevision++;
        quotaRefresh.disabled = false;
        showQuota(snapshot);
      }
      return;
    }
    if (params?.threadId !== threadId) return;
    const item = params.item;
    switch (message.method) {
      case 'serverRequest/resolved':
        approvalCards.get(params.requestId)?.remove();
        approvalCards.delete(params.requestId);
        sync();
        break;
      case 'turn/started':
        turnId = params.turn.id;
        busy = true;
        sync();
        break;
      case 'item/agentMessage/delta': {
        const row = replies.get(params.itemId) ?? append('Codex', '');
        replies.set(params.itemId, row);
        const message = messageText.get(row);
        message.value += params.delta;
        queueCodexReply(row);
        break;
      }
      case 'item/started':
        if (item.type === 'fileChange') fileChanges.set(item.id, item.changes);
        break;
      case 'item/completed':
        if (item.type === 'agentMessage') {
          const row = replies.get(item.id);
          if (row) {
            messageText.get(row).value = item.text;
            renderCodexReply(row, item.text);
            replies.delete(item.id);
          } else append('Codex', item.text);
        } else showCodexActivity(item);
        break;
      case 'turn/completed':
        stopPending = '';
        notifyTask(params.turn.status === 'completed' ? 'finished' : params.turn.status === 'failed' ? 'failed' : 'stopped');
        for (const row of replies.values()) renderCodexReply(row, messageText.get(row).value);
        turnId = '';
        busy = false;
        approvals.replaceChildren();
        approvalCards.clear();
        replies.clear();
        fileChanges.clear();
        outcome = params.turn.status === 'completed' ? 'Finished' : '';
        status.textContent = params.turn.error?.message || '';
        sync();
        break;
    }
  };

  dismissOnBackdrop(dialog);
  dismissOnBackdrop(threadDialog);
  find('codex-project-alias').onsubmit = event => {
    event.preventDefault();
    remember(sessionKey('project-title'), find('codex-project-title').value.trim());
    updateThreadName();
    threadFeedback.textContent = 'Project display name saved.';
  };
  pick.onclick = () => {
    find('codex-project-title').value = stored(sessionKey('project-title')) || '';
    renderThreadPicker();
    threadDialog.showModal();
  };
  let tapCount = 0, lastTap = null, press = null;
  function resetTaps() {
    tapCount = 0;
    lastTap = press = null;
  }
  document.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0 || !messages.contains(event.target)
        || event.target.closest('button, a, input, textarea, select, label, img, .model-handoff')
        || document.querySelector('dialog[open]')) {
      resetTaps();
      return;
    }
    press = {id: event.pointerId, x: event.clientX, y: event.clientY, time: performance.now()};
  });
  const distance = (point, event) => Math.hypot(point.x - event.clientX, point.y - event.clientY);
  document.addEventListener('pointermove', event => {
    if (press?.id === event.pointerId && distance(press, event) >= 12) resetTaps();
  }, {passive: true});
  document.addEventListener('pointercancel', resetTaps);
  messages.addEventListener('scroll', resetTaps, {passive: true});
  messages.addEventListener('pointerup', event => {
    const now = performance.now();
    if (press?.id !== event.pointerId || now - press.time >= 350 || distance(press, event) >= 12) {
      resetTaps();
      return;
    }
    if (lastTap && (now - lastTap.time > 450 || distance(lastTap, event) > 44)) tapCount = 0;
    lastTap = {x: event.clientX, y: event.clientY, time: now};
    press = null;
    if (++tapCount !== 7) return;
    resetTaps();
    resetComposerHold();
    window.getSelection()?.removeAllRanges();
    if (connected) enterMode();
    else if (endpoint && project) { enterMode(); connectToPc(endpoint, project, '', true); }
    else dialog.showModal();
  });
  exit.onclick = leaveMode;
  find('codex-disconnect').onclick = () => {
    reconnectAllowed = false;
    clearTimeout(reconnectTimer);
    bridge.disconnect();
    disconnected('');
  };
  connect.onsubmit = event => {
    event.preventDefault();
    connectToPc(endpointInput.value.trim(), projectInput.value.trim(), tokenInput.value.trim());
  };
  find('codex-new').onclick = () => openThread('').catch(onError);
  find('codex-refresh').onclick = () => refresh().catch(onError);
  function clearSentAttachments(pendingKey) {
    const selection = pendingCodexFiles.get(pendingKey);
    if (!selection) return;
    pendingCodexFiles.delete(pendingKey);
    for (const file of selection.files) {
      const index = selection.fileList.indexOf(file);
      if (index >= 0) selection.fileList.splice(index, 1);
    }
    if (attachments === selection.fileList) renderAttachments();
  }

  function reconcileSend(thread) {
    let uncertain;
    try { uncertain = JSON.parse(stored(sessionKey('pending', threadId))); } catch {}
    if (!uncertain) return;
    const turns = thread.turns ?? [];
    const delivered = turns.slice(uncertain.count).some(turn => turn.items.some(item =>
      item.type === 'userMessage' && item.content.filter(part => part.type === 'text')
        .some(part => part.text === uncertain.text)));
    if (delivered) {
      if (readDraft() === uncertain.text) {
        remember(sessionKey('draft', threadId), '');
        if (window.hackGptCodexMode && prompt.value === uncertain.text) setDraft('');
      }
      const pendingKey = sessionKey('pending', threadId);
      remember(pendingKey, '');
      clearSentAttachments(pendingKey);
    } else {
      sessionDetail.textContent = 'Delivery is unconfirmed. Review the thread before sending again.';
    }
  }

  async function send() {
    const fileList = attachments;
    const files = [...fileList];
    const draft = prompt.value.trim();
    const message = draft || (files.length ? 'Review the attached files.' : '');
    if (!message || busy || readingFiles || !connected || connecting) return;
    if (!threadId) {
      sessionDetail.textContent = 'Choose a project thread or start a new one.';
      return;
    }
    const attempt = connectionAttempt;
    const draftKey = sessionKey('draft', threadId);
    const pendingKey = sessionKey('pending', threadId);
    const count = [...log.children].filter(row => messageText.get(row)?.label === 'You').length;
    remember(draftKey, message);
    remember(pendingKey, JSON.stringify({text: message, count}));
    if (files.length) pendingCodexFiles.set(pendingKey, {files, fileList});
    else pendingCodexFiles.delete(pendingKey);
    busy = true;
    outcome = '';
    sessionDetail.textContent = '';
    sync();
    const row = append('You', message);
    showFileNames(row, files.map(file => file.name));
    messages.scrollTop = messages.scrollHeight;
    try {
      await rpc('turn/start', {
        threadId,
        input: [{type: 'text', text: message, text_elements: []}, ...files.map(file =>
          file.kind === 'image' ? {type: 'image', url: 'data:' + file.mime + ';base64,' + file.data}
            : {type: 'text', text: 'Attachment: ' + file.name + '\n\n' + file.data, text_elements: []})],
        ...(codexModel.value && {model: codexModel.value}),
        ...(codexEffort.value && {effort: codexEffort.value})
      });
      remember(pendingKey, '');
      clearSentAttachments(pendingKey);
      if (stored(draftKey) === message) {
        remember(draftKey, '');
        if (window.hackGptCodexMode && prompt.value.trim() === draft) setDraft('');
      }
    } catch (error) {
      row.remove();
      if (attempt !== connectionAttempt) return;
      busy = Boolean(turnId);
      sessionDetail.textContent = 'Delivery is unconfirmed. Review the thread before sending again.';
      sync();
    }
  }
  function stop() {
    if (!connected || !turnId || stopPending === turnId) return;
    const target = turnId;
    stopPending = target;
    return rpc('turn/interrupt', {threadId, turnId: target}).catch(error => {
      if (stopPending === target) stopPending = '';
      onError(error);
    });
  }
  sync();
})();
</script>
</body>
