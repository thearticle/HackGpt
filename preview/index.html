<style>
:root{
  color-scheme:dark;
  --ink:#080d08;--panel:#111a0f;--line:#364e26;--lime:#baff56;--muted:#a0b38c;--paper:#e7f3da;
  --scene-top:#1c2b14;--scene-bottom:#080c08;--glow:#75b02b22;--scrim:#000a;
  --mine:#182411;--selection:#263d19;--disabled:#889578;
  --primary-bg:#baff56;--primary-text:#080d08;
  --danger:#ff665d;--warning:#ffc4b6;--danger-panel:#3b211e;--danger-line:#8b4940;
  --chat-font-size:16px;
  font-family:"Courier New",monospace;
}
:root[data-theme="amoled"]{
  --ink:#000;--panel:#000;--scene-top:#000;--scene-bottom:#000;--glow:transparent;
  --mine:#080c06;--selection:#19270f;
}
:root[data-theme="light"]{
  color-scheme:light;
  --ink:#fff;--panel:#f6f9f3;--line:#a5b79a;--lime:#315c16;--muted:#4d6245;--paper:#152411;
  --scene-top:#fafff7;--scene-bottom:#e7eee3;--glow:#2e5d1e22;--scrim:#21301d66;
  --mine:#e6f4da;--selection:#e1f0d5;--disabled:#667762;
  --primary-bg:#bde98d;--primary-text:#182b0c;
  --danger:#ad3028;--warning:#8b342a;--danger-panel:#fae8e4;--danger-line:#b95d52;
}

:root[data-theme="nord"]{--ink:#2e3440;--panel:#3b4252;--line:#4c566a;--lime:#88c0d0;--muted:#b9c8d8;--paper:#eceff4}
:root[data-theme="dracula"]{--ink:#282a36;--panel:#343746;--line:#605977;--lime:#bd93f9;--muted:#d4c5e9;--paper:#f8f8f2}
:root[data-theme="solarized"]{--ink:#002b36;--panel:#073642;--line:#42717b;--lime:#2aa198;--muted:#a5b9bd;--paper:#eee8d5}
:root[data-theme="gruvbox"]{--ink:#282828;--panel:#3c3836;--line:#665c54;--lime:#fabd2f;--muted:#d5c4a1;--paper:#fbf1c7}
:root[data-theme="catppuccin"]{--ink:#1e1e2e;--panel:#313244;--line:#585b70;--lime:#cba6f7;--muted:#bac2de;--paper:#cdd6f4}
:root:is([data-theme="nord"],[data-theme="dracula"],[data-theme="solarized"],[data-theme="gruvbox"],[data-theme="catppuccin"]){--scene-top:var(--panel);--scene-bottom:var(--ink);--glow:transparent;--mine:var(--panel);--selection:var(--line);--primary-bg:var(--lime);--primary-text:var(--ink)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;background:radial-gradient(ellipse at top,var(--scene-top),var(--scene-bottom) 65%);color:var(--paper)}
main{width:min(100%,414px);height:min(820px,100vh);height:min(820px,100dvh);min-height:380px;background:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 0 42px var(--glow);padding:20px;display:flex;flex-direction:column}
#composer{display:flex;align-items:stretch}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--lime);border-radius:4px;min-height:44px;padding:7px 12px;font:inherit;font-size:13px;font-weight:bold}
.send,.icon{width:44px;padding:0;font-size:20px}
header{display:flex;justify-content:space-between;align-items:center;margin-left:-12px;margin-right:-18px;transform:translateY(-12px)}
#immersive-toolbar-handle[hidden]{display:none}
#immersive-toolbar-handle{position:absolute;inset:0 0 0 auto;width:28px;min-height:0;padding:0 4px 0 0;display:grid;align-items:center;justify-items:end;border:0;background:transparent;color:var(--lime);pointer-events:auto}
#immersive-toolbar-handle::before{content:"";width:3px;height:26px;border-radius:3px;background:currentColor;box-shadow:0 0 8px currentColor;animation:send-pulse 1.8s ease-in-out infinite}
header.immersive-toolbar{min-height:44px;padding-inline-end:28px}
header.immersive-toolbar .header-actions:nth-child(2),header.immersive-toolbar #chat-credit{min-width:0}
header.immersive-toolbar #chat-credit{overflow:hidden;text-overflow:ellipsis}
@media(max-width:390px){header.immersive-toolbar .icon{width:34px}}

.header-actions{display:flex;align-items:center;gap:2px}
#app-update[hidden]{display:none}
#app-update{color:var(--lime)}
#app-update svg,#app-update::before{grid-area:1/1}
#app-update::before{content:"";width:30px;height:30px;border:1px solid currentColor;border-radius:50%;opacity:.75;pointer-events:none;animation:update-ring-pulse 1.8s ease-in-out infinite}
@keyframes update-ring-pulse{0%,100%{transform:scale(.94);opacity:.65}50%{transform:scale(1.15);opacity:1;box-shadow:0 0 6px var(--glow)}}
@media(prefers-reduced-motion:reduce){#app-update::before{animation:none}}
header.has-app-update .header-actions:first-child,header.has-app-update #reset{flex-shrink:0}
header.has-app-update .header-actions:nth-child(2),header.has-app-update #chat-credit{min-width:0}
header.has-app-update #chat-credit{overflow:hidden;text-overflow:ellipsis}
@media(max-width:380px){header.has-app-update .icon{width:36px}}
#chat-credit{min-height:30px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--lime);white-space:nowrap;font-size:11px;font-weight:normal}
#chat-credit:not(:disabled){pointer-events:auto}
#chat-top-up[hidden]{display:none}
#chat-top-up{display:grid;place-items:center;flex:none;width:32px;height:44px;color:var(--lime);text-decoration:none;pointer-events:auto}
#chat-top-up svg,#chat-top-up::before{grid-area:1/1}
#chat-top-up::before{content:"";width:25px;height:25px;border:1px solid currentColor;border-radius:50%;animation:update-ring-pulse 1.8s ease-in-out infinite;pointer-events:none}
header.has-top-up #chat-credit{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media(max-width:390px){header.has-top-up .icon{width:36px}}
@media(max-width:340px){header.has-top-up .icon{width:32px}}
@media(prefers-reduced-motion:reduce){#chat-top-up::before{animation:none}}
.icon{display:grid;place-items:center;height:44px;line-height:1;border:0;background:transparent;font-family:"Segoe UI Symbol","Courier New",monospace}
button:disabled{cursor:default;color:var(--disabled)}
.primary{background:var(--primary-bg);color:var(--primary-text);border-color:var(--primary-bg)}
small{font-size:12px;color:var(--muted)}
#reset{color:var(--lime)}
#reset::before,#new-provider::before{
  content:"";
  width:18px;
  height:18px;
  background:linear-gradient(currentColor,currentColor) center/18px 2px no-repeat,
             linear-gradient(currentColor,currentColor) center/2px 18px no-repeat;
}
#provider::before{
  content:"";
  width:18px;
  height:18px;
  background:radial-gradient(circle,transparent 3px,currentColor 3.5px);
  clip-path:polygon(85.1% 35.5%, 87.4% 43.4%, 98.3% 41.5%, 98.3% 58.5%, 87.4% 56.6%, 85.1% 64.5%, 85.1% 64.5%, 81.1% 71.8%, 90.1% 78.1%, 78.1% 90.1%, 71.8% 81.1%, 64.5% 85.1%, 64.5% 85.1%, 56.6% 87.4%, 58.5% 98.3%, 41.5% 98.3%, 43.4% 87.4%, 35.5% 85.1%, 35.5% 85.1%, 28.2% 81.1%, 21.9% 90.1%, 9.9% 78.1%, 18.9% 71.8%, 14.9% 64.5%, 14.9% 64.5%, 12.6% 56.6%, 1.7% 58.5%, 1.7% 41.5%, 12.6% 43.4%, 14.9% 35.5%, 14.9% 35.5%, 18.9% 28.2%, 9.9% 21.9%, 21.9% 9.9%, 28.2% 18.9%, 35.5% 14.9%, 35.5% 14.9%, 43.4% 12.6%, 41.5% 1.7%, 58.5% 1.7%, 56.6% 12.6%, 64.5% 14.9%, 64.5% 14.9%, 71.8% 18.9%, 78.1% 9.9%, 90.1% 21.9%, 81.1% 28.2%, 85.1% 35.5%);
}
article small{color:var(--lime)}
#messages{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:8px 0}
h2{font-size:20px;margin:4px 0}
p{overflow-wrap:anywhere}
canvas{max-width:100%;height:auto}
article.mine{background:var(--mine);border:1px solid var(--line);border-inline-end:2px solid var(--lime);border-radius:4px 4px 0 4px;padding:12px}
article.mine>p{margin-top:0}
article p{margin:6px 0 0;white-space:pre-wrap}
#composer{margin-top:7px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
#composer{position:relative}
#composer[hidden],#immersive-handle[hidden]{display:none}
.codex-mode #chat-status{flex:none;position:relative;z-index:1}
#codex-attach{flex:none;width:32px;min-height:26px;padding:0;border:0;background:transparent;color:var(--lime);line-height:1}
#codex-attach[hidden]{display:none}
.codex-mode #composer :is(.send,#composer-marker,#composer-gesture){display:none}
#codex-send[hidden],main:not(.codex-mode) #codex-send{display:none}
#codex-send{flex:none;align-self:end;margin:4px;min-height:36px;padding:0 10px}
#immersive-handle{display:grid;place-items:center;align-self:stretch;min-height:28px;padding:0;border:0;background:transparent;color:var(--lime);touch-action:none}
#immersive-handle::before{content:"";width:42px;height:3px;border-radius:3px;background:currentColor;box-shadow:0 0 8px currentColor;animation:send-pulse 1.8s ease-in-out infinite}
#composer.immersive-reveal{animation:composer-reveal 170ms ease-out}
@keyframes composer-reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#immersive-handle::before,#composer.immersive-reveal{animation:none}}
#composer .send{position:absolute;left:calc(50% + var(--composer-offset,0px));bottom:calc(100% + 32px);display:grid;place-items:center;width:62px;height:62px;min-height:0;padding:0;border-radius:50%;background:var(--panel);color:var(--lime);border-color:var(--line);touch-action:none;user-select:none;-webkit-touch-callout:none;visibility:hidden;opacity:0;transform:translate(-50%,8px);pointer-events:none;transition:opacity 240ms ease,transform 240ms ease,visibility 0s linear 240ms}
#composer .send.is-visible{visibility:visible;opacity:1;transform:translateX(-50%);pointer-events:auto;transition-delay:0s}
#composer .send.is-stop{left:50%;z-index:2}

#composer .send,#composer-marker{-webkit-tap-highlight-color:transparent}
#composer .send:focus,#composer-marker:focus{outline:0}
#composer .send:focus-visible,#composer-marker:focus-visible{outline:1px solid var(--lime);outline-offset:2px}
#composer-marker[hidden],#composer-gesture[hidden]{display:none}
#composer-marker{position:absolute;left:calc(50% + var(--composer-offset,0px));top:-9px;transform:translateX(-50%);min-height:0;width:28px;height:18px;padding:0;border:0;background:transparent;touch-action:none;user-select:none;-webkit-touch-callout:none;z-index:1}
#composer-marker::after{content:"";display:block;width:14px;height:2px;margin:auto;background:currentColor;animation:send-pulse 1.8s ease-in-out infinite}
#composer .resize-grip{position:absolute;top:0;z-index:1;display:grid;place-items:center;width:20px;height:20px;min-height:0;padding:0;border:0;background:transparent;color:var(--muted);cursor:ns-resize;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
#composer .resize-grip::before{content:"";width:7px;height:7px;border-top:2px solid currentColor;border-left:2px solid currentColor}
#composer .resize-grip.left{left:0}
#composer .resize-grip.right{right:0}
#composer .resize-grip.right::before{transform:scaleX(-1)}
#composer .resize-grip:active,#composer .resize-grip:focus-visible{color:var(--lime)}
#composer-gesture{position:absolute;left:clamp(76px,calc(50% + var(--composer-offset,0px)),calc(100% - 76px));bottom:calc(100% + 100px);transform:translateX(-50%);white-space:nowrap;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--lime);pointer-events:none;animation:composer-hint-pulse 1.8s ease-in-out infinite}
#composer .send.is-pulsing{animation:composer-tap 300ms ease-out}
@keyframes composer-tap{50%{box-shadow:0 0 14px var(--lime);transform:translateX(-50%) scale(1.08)}}
@keyframes composer-hint-pulse{0%,100%{opacity:.72}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){#composer .send{transition:none}#composer .send.is-pulsing,#composer-marker::after,#composer-gesture{animation:none}}
#stop-response[hidden]{display:none}
#composer .send:disabled .send-mark::after{animation:none}
#chat-status{display:flex;align-items:center;justify-content:space-between;gap:8px}
#stop-response{min-height:32px;padding:0 9px}
.send-mark{width:12px;height:12px;transform:translate(var(--send-x,0px),var(--send-y,0px));transition:transform 160ms ease-out}
.send.is-dragging .send-mark{transition:none}
#messages.is-composer-gesture,#messages.is-composer-gesture *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.send-mark::after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:currentColor;animation:send-pulse 1.8s ease-in-out infinite}
@keyframes send-pulse{0%,100%{transform:scale(.85);opacity:.7}50%{transform:scale(1.15);opacity:1}}
@media(prefers-reduced-motion:reduce){.send-mark{transition:none}.send-mark::after{animation:none}}
textarea{resize:vertical;min-width:0;max-height:110px;flex:1;border:0;padding:9px;background:transparent;color:var(--paper);font:inherit}
#prompt{resize:none;min-height:calc(var(--chat-font-size) * 1.45 + 18px);padding-inline:22px}
#prompt:focus{outline:none}
dialog{width:min(390px,calc(100% - 24px));background:var(--panel);color:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px}
dialog::backdrop{background:var(--scrim)}
#codex-dialog{width:min(420px,calc(100% - 28px));max-height:calc(100% - 28px);padding:14px}
#codex-dialog form,#codex-threads{display:grid;gap:8px}

#codex-status{text-align:center;overflow-wrap:anywhere}
#codex-status[data-connected="true"]{color:var(--lime)}
#codex-connection-error{margin:0;color:var(--warning);font-size:12px}
#codex-connection-error:empty{display:none}
#codex-status,#codex-session-status{margin:0}
#codex-session{min-width:0;overflow-wrap:anywhere}
#codex-session{flex:1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;width:100%;column-gap:8px}
#codex-thread-name{position:absolute;inset-inline-start:50%;top:50%;transform:translate(-50%,-50%);max-width:calc(100% - 68px);padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--lime);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 220ms ease,visibility 0s linear 220ms}

#codex-dialog select{width:100%;font:inherit;color:var(--paper);background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px}

#empty.credits-view{pointer-events:auto}
#creator-credits{margin-top:-8px;text-align:center;letter-spacing:.08em;color:var(--paper);opacity:.68}
#creator-credits strong{display:block;font-size:17px}
#creator-credits small{display:block;margin-top:6px;color:inherit}
#empty.credits-view>div{display:grid;justify-items:center}
#empty.credits-view canvas{width:min(150px,60vw)}
@keyframes new-chat-glow{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 6px currentColor)}}
@keyframes new-chat-ring{0%{transform:scale(.7);opacity:.85}100%{transform:scale(1.16);opacity:0}}
.credits-flash::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background:#baff56;animation:credits-flash 420ms ease-out both}
@keyframes credits-flash{0%,100%{opacity:0}22%{opacity:.32}}
@media(prefers-reduced-motion:reduce){
  #reset:not(:disabled)::before,#reset.holding::after{animation:none}
  #reset.holding::after{opacity:.75}
  .credits-flash::after{content:none}
}
.model-markdown{margin-top:6px;font-size:var(--chat-font-size);line-height:1.45;overflow-wrap:anywhere;min-width:0}
#messages .model-markdown p{white-space:normal}
.model-markdown>:first-child{margin-top:0}
.model-markdown>:last-child{margin-bottom:0}
.model-markdown h1,.model-markdown h2,.model-markdown h3,.model-markdown h4,.model-markdown h5,.model-markdown h6{font-family:system-ui,sans-serif;margin:1em 0 .35em;line-height:1.25;letter-spacing:normal}
.model-markdown h1{font-size:1.45em}
.model-markdown h2{font-size:1.25em}
.model-markdown h3{font-size:1.12em}
.model-markdown h4,.model-markdown h5,.model-markdown h6{font-size:1em}
.model-markdown ul,.model-markdown ol{padding-left:1.35em;margin:6px 0}
.model-markdown li+li{margin-top:3px}
.model-markdown a{color:var(--lime);font-weight:bold;text-decoration:underline;text-underline-offset:.15em}
.model-markdown a:focus-visible{outline:1px solid currentColor;outline-offset:2px}
.model-markdown blockquote{margin:10px 0;padding:8px 11px;border:1px solid var(--line);border-inline-start:3px solid var(--lime);border-radius:8px;background:var(--panel);color:var(--paper)}
.model-markdown blockquote p:first-child{margin-top:0} .model-markdown blockquote p:last-child{margin-bottom:0}
.model-markdown hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.model-markdown code{font:inherit;font-family:ui-monospace,monospace;letter-spacing:normal;background:var(--ink);padding:1px 3px;border-radius:3px}
.model-markdown pre,.markdown-scroll{margin:8px 0;max-width:100%;overflow-x:auto}
.model-markdown pre{background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;font:inherit;white-space:pre;overflow-wrap:normal}
.model-markdown pre code{padding:0}
.model-markdown table{border-collapse:collapse;font-size:.88em;min-width:100%}
.model-markdown th,.model-markdown td{border:1px solid var(--line);padding:5px 8px;text-align:left;min-width:7em}
.model-markdown th{background:var(--mine)}
.chat-visual{margin:9px 0;padding:9px;border:1px solid var(--line);border-radius:4px;font-size:.86em}
.chat-visual figcaption{color:var(--lime);font-weight:bold}
.model-markdown .chat-chart{list-style:none;padding:0}
.chat-chart li{display:grid;grid-template-columns:minmax(4em,1fr) minmax(3em,1.6fr) auto;gap:6px;align-items:center}
.bar-track{height:8px;border-radius:3px;background:var(--ink);position:relative;overflow:hidden}
.bar-track i{display:block;height:100%;position:absolute;background:var(--lime)}
.bar-track i.negative{background:var(--danger)}
.bar-value{font-variant-numeric:tabular-nums}
.model-markdown .chat-mindmap ul{list-style:none;border-left:1px solid var(--line);margin:5px 0;padding-left:12px}
.chat-mindmap li{position:relative}
.chat-mindmap li::before{content:"";position:absolute;width:9px;height:1px;top:.7em;left:-12px;background:var(--line)}
.chat-mindmap li>span{display:inline-block;padding:1px 4px;background:var(--mine);border-radius:3px}
.model-markdown .diagram-connections{padding-left:15px}
.diagram-connections li{display:grid;grid-template-columns:minmax(0,1fr) minmax(1.5em,auto) minmax(0,1fr);gap:5px;align-items:center;margin:6px 0;padding-left:3px}
.diagram-node{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--mine);text-align:center;overflow-wrap:anywhere}
.diagram-arrow{display:grid;justify-items:center;color:var(--lime);text-align:center}
.diagram-arrow small{color:var(--muted);max-width:8em;text-wrap:wrap;overflow-wrap:anywhere}
</style>

<script>
const find = id => document.getElementById(id);

function clearContents(element) {
  element.textContent = '';
}

function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Array.from(crypto.getRandomValues(new Uint8Array(16)), byte =>
    byte.toString(16).padStart(2, '0')).join('');
}
const messages = find('messages');
const promptBox = find('prompt');
const reset = find('reset');
const empty = find('empty');

function appendMessage(author, content, mine, target = messages) {
  const message = document.createElement('article');
  if (mine) {
    message.className = 'mine';
    message.setAttribute('aria-label', 'Your message');
  } else {
    const label = document.createElement('small');
    label.textContent = author;
    message.append(label);
  }
  const text = document.createElement('p');
  text.textContent = content;
  message.append(text);
  target.append(message);
  return message;
}

const presets = {
  factory: 'https://api.factory.ai/api/v0',
  openrouter: 'https://openrouter.ai/api/v1',
  openai: 'https://api.openai.com/v1',
  gemini: 'https://generativelanguage.googleapis.com/v1beta/openai'
};
const kenariBase = 'https://kenari.id/v1';
const routrBase = 'https://api.routr.cloud/v1';
const naraBase = 'https://router.bynara.id/v1';

function stored(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}

function remember(key, value) {
  try { localStorage.setItem(key, value); } catch { /* Session state is still available. */ }
}

let nativeSequence = 0;
const nativePending = new Map();

window.hackGptNativeEvent = (id, encoded) => {
  const operation = nativePending.get(id);
  if (!operation) return;
  const {kind, payload} = JSON.parse(encoded);
  if (kind === 'event') {
    operation.onEvent?.(payload);
    return;
  }
  nativePending.delete(id);
  operation.cleanup();
  if (kind === 'error') operation.reject(new Error(payload));
  else operation.resolve(payload);
};

function androidRequest(path, body, onEvent, signal) {
  return new Promise((resolve, reject) => {
    const id = String(++nativeSequence);
    const abort = () => {
      nativePending.delete(id);
      reject(new DOMException('Response stopped', 'AbortError'));
      window.HackGptAndroid.cancel(id);
    };
    if (signal?.aborted) {
      reject(new DOMException('Response stopped', 'AbortError'));
      return;
    }
    signal?.addEventListener('abort', abort, {once: true});
    nativePending.set(id, {
      resolve, reject, onEvent,
      cleanup: () => signal?.removeEventListener('abort', abort)
    });
    try {
      window.HackGptAndroid.request(id, path, JSON.stringify(body ?? {}));
    } catch {
      nativePending.delete(id);
      signal?.removeEventListener('abort', abort);
      reject(new Error('The Android app could not start the request.'));
    }
  });
}


async function localApi(path, body) {
  if (window.HackGptAndroid) return androidRequest(path, body);
  const options = body === undefined ? {} : {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  };
  let response;
  try { response = await fetch('/api/' + path, options); }
  catch { throw new Error('Could not reach the local preview server.'); }
  const data = await response.json().catch(() => null);
  if (!response.ok) throw new Error(data?.error || 'The local preview request failed.');
  return data;
}

function modelTestKey(connection, modelId) {
  return JSON.stringify([connection.id, modelId]);
}

function modelFailure(model) {
  return model.connection && failedModels.get(modelTestKey(model.connection, model.id));
}

function recordModelTest(connection, modelId, passed) {
  const key = modelTestKey(connection, modelId);
  const active = currentModel();
  const wasActive = active && modelTestKey(active.connection, active.id) === key;
  failedModels.delete(key);
  if (!passed) failedModels.set(key, new Date().toISOString());
  while (failedModels.size > 400) failedModels.delete(failedModels.keys().next().value);
  remember(failedModelsKey, JSON.stringify([...failedModels]));
  if (!passed && wasActive) {
    liveModel = currentModel()?.selection ?? '';
    remember(liveModelKey, liveModel);
  }
}

function readArray(key) {
  try {
    const value = JSON.parse(stored(key));
    return Array.isArray(value) ? value : [];
  } catch {
    return [];
  }
}

function saveProfiles(next) {
  try {
    localStorage.setItem(profilesKey, JSON.stringify(next));
  } catch {
    throw new Error('Could not save providers in this browser.');
  }
  profiles = next;
}

function draftModels() {
  return draft ? draft.models.filter(model => !draft.hidden.has(model.id)) : [];
}

function savedModels() {
  const configuredKenari = [...connections.values()].find(connection =>
    connection.base === kenariBase && connection.saved === true);
  const demo = builtInDemo ?? {
    id: demoProfileId, name: 'Demo', connectionId: configuredKenari?.id,
    models: [{id: demoBeamId, name: 'Beam 1.0 Free'}], hidden: []
  };
  return [demo, ...profiles].flatMap(profile => {
    const hidden = new Set(profile.hidden);
    const connection = connections.get(profile.connectionId);
    return profile.models.filter(model => !hidden.has(model.id)).map(model => ({
      ...model,
      imageOnly: model.imageOnly || (connection?.type === 'openai' && model.id.startsWith('gpt-image-'))
        || (connection?.base === kenariBase && model.id.startsWith('nano-banana-'))
        || (connection?.type === 'openrouter' && model.modalities?.includes('image') && !model.modalities.includes('text')),
      profile, connection, selection: JSON.stringify([profile.id, model.id])
    }));
  });
}

function currentModel() {
  if (liveModel === '') return undefined;
  const models = savedModels().filter(model => model.connection && !modelFailure(model));
  return models.find(model => model.selection === liveModel) ?? models[0];
}

function updateTopUpLink(connection, freeDemo) {
  const link = find('chat-top-up');
  let destination;
  if (connection?.base && !freeDemo) {
    try {
      const host = new URL(connection.base).hostname;
      destination = providerTopUpLinks.get(host);
      if (!destination && host.endsWith('.apimurah.com')) destination = providerTopUpLinks.get('apimurah.com');
      if (!destination && host === 'api.routr.cloud') destination = providerTopUpLinks.get('routr.cloud');
    } catch {
      // A provider without a valid base URL has no billing destination.
    }
  }
  link.hidden = !destination;
  link.closest('header').classList.toggle('has-top-up', !!destination);
  if (!destination) {
    link.removeAttribute('href');
    return;
  }
  const [name, url] = destination;
  link.href = url;
  if (!window.HackGptAndroid) link.target = '_blank';
  link.title = 'Top up ' + name;
  link.setAttribute('aria-label', link.title);
}

async function updateChatCredit(model, refresh = false) {
  const connection = model?.connection;
  const freeDemo = model?.profile?.id === demoProfileId;
  updateTopUpLink(connection, freeDemo);
  const routr = connection?.base === routrBase;
  const nara = connection?.base === naraBase;
  const key = freeDemo ? 'free-demo' : routr ? JSON.stringify([connection.id, model.id])
    : nara || connection?.base === kenariBase ? connection.id : null;
  if (key === creditConnection && !refresh) return;
  const credit = find('chat-credit');
  if (key !== creditConnection) {
    credit.hidden = true;
    credit.disabled = true;
    credit.onclick = null;
    credit.removeAttribute('aria-pressed');
  }
  creditConnection = key;
  const revision = ++creditRevision;
  if (freeDemo) {
    credit.title = 'Free demo';
    credit.setAttribute('aria-label', credit.title);
    credit.textContent = 'FREE';
    credit.hidden = false;
    return;
  }
  if (!key) return;
  try {
    const result = await localApi(routr ? 'routr-quota' : nara ? 'nara-balance' : 'kenari-balance',
      {connection: connection.id, ...(routr && {model: model.id})});
    if (revision !== creditRevision) return;
    const amount = detailNumber(result.balance);
    credit.hidden = amount === null;
    if (amount !== null) {
      if (routr) {
        const exact = amount.toLocaleString('en-US');
        const compact = amount.toLocaleString('en-US', {notation: 'compact', maximumSignificantDigits: 4});
        const showAmount = expanded => {
          credit.setAttribute('aria-pressed', String(expanded));
          credit.textContent = expanded ? exact : compact;
        };
        credit.title = model.id + ' · ' + exact + ' available credits';
        credit.setAttribute('aria-label', credit.title + ' · Toggle exact amount');
        credit.disabled = false;
        showAmount(credit.getAttribute('aria-pressed') === 'true');
        credit.onclick = () => showAmount(credit.getAttribute('aria-pressed') !== 'true');
      } else {
        const rupiah = nara ? amount : amount / 1_000_000;
        credit.textContent = rupiah.toLocaleString('id-ID', {maximumFractionDigits: nara ? 2 : 0});
        credit.title = 'Available ' + (nara ? 'NaraRouter' : 'Kenari') + ' balance in Indonesian rupiah';
        credit.setAttribute('aria-label', credit.title + ' · ' + credit.textContent);
      }
    }
  } catch {
    if (revision === creditRevision) credit.hidden = true;
  }
}

function renderModels() {
  const list = find('model-list');
  clearContents(list);
  const search = modelSearch.value.trim().toLowerCase();
  const available = savedModels();
  const providers = new Map();
  for (const model of available) {
    if (!model.profile) continue;
    const {id, name} = model.profile;
    if (!providers.has(id)) providers.set(id, {name, count: 0});
    providers.get(id).count++;
  }
  const summary = find('model-provider-summary');
  summary.textContent = Array.from(providers.values(), ({name, count}) =>
    `${name}/${count}`).join(' · ');
  summary.hidden = !providers.size;
  const models = available.filter(model =>
    (model.name + ' ' + model.id + ' ' + (model.profile?.name ?? '')).toLowerCase().includes(search));
  const active = currentModel();
  const groups = new Map();
  for (const model of models) {
    const groupId = model.profile?.id ?? null;
    let group = groups.get(groupId);
    if (!group) {
      group = document.createElement('section');
      group.className = 'model-group';
      group.setAttribute('role', 'group');
      const heading = document.createElement('h2');
      heading.id = 'model-group-heading-' + groups.size;
      heading.textContent = model.profile.name;
      group.setAttribute('aria-labelledby', heading.id);
      group.append(heading);
      groups.set(groupId, group);
      list.append(group);
    }
    const option = document.createElement('button');
    option.type = 'button';
    const name = document.createElement('span');
    name.className = 'model-name';
    name.textContent = model.name;
    option.append(name);
    const failed = modelFailure(model);
    option.classList.toggle('model-failed', !!failed);
    option.classList.toggle('is-retest-target', !!failed && inspectedModel?.selection === model.selection);
    option.setAttribute('aria-pressed', String(active
      ? (model.selection ?? model.id) === (active.selection ?? active.id) : false));
    if (model.profile) {
      const details = [model.name === model.id ? '' : model.id,
        model.imageOnly || model.modalities?.includes('image') ? 'Image generation' : '',
        !model.connection ? (model.profile.id === demoProfileId ? 'Connect Kenari in Settings' : 'Key needed') : '']
        .filter(Boolean).join(' · ');
      if (details) {
        const subtitle = document.createElement('small');
        subtitle.textContent = details;
        option.append(subtitle);
      }
      option.disabled = !model.connection;
    }
    if (failed) {
      const timestamp = document.createElement('small');
      timestamp.className = 'model-failure-time';
      const time = document.createElement('time');
      time.dateTime = failed;
      time.textContent = new Date(failed).toLocaleString();
      timestamp.append('Failed · ', time);
      option.append(timestamp);
    }
    const select = inspect => {
      if (modelFailure(model)) {
        inspectModel(model);
        for (const row of list.querySelectorAll('.is-retest-target')) row.classList.remove('is-retest-target');
        option.classList.add('is-retest-target');
        keepModelRowVisible(option);
        return;
      }
      liveModel = model.selection;
      remember(liveModelKey, liveModel);
      updateModelStatus();
      if (inspect) {
        for (const row of list.querySelectorAll('button')) row.setAttribute('aria-pressed', String(row === option));
        inspectModel(model);
        keepModelRowVisible(option);
      } else {
        closeModelInspector();
        modelDialog.close();
      }
    };
    option.onclick = () => select(false);
    option.setAttribute('aria-description', failed ? 'Last test failed. Open details to retest.'
      : 'Hold or press Shift+Enter for model details.');
    onLongPress(option, () => {
      heldModelClick = true;
      select(true);
    });
    option.onkeydown = event => {
      if (event.key !== 'Enter' || !event.shiftKey || event.repeat) return;
      event.preventDefault();
      select(true);
    };
    group.append(option);
  }
  if (!models.length) list.textContent = search ? 'No matching models.' : 'Enable and save models in Settings.';
  limitInspectorModelList();
}

function limitInspectorModelList() {
  if (!inspectedModel) return;
  const list = find('model-list');
  const rows = list.querySelectorAll('button');
  if (rows.length <= 6) {
    list.style.removeProperty('--model-list-limit');
    return;
  }
  const top = list.getBoundingClientRect().top;
  const height = Math.ceil(rows[5].getBoundingClientRect().bottom - top + list.scrollTop);
  list.style.setProperty('--model-list-limit', height + 'px');
}

function keepModelRowVisible(row) {
  const list = find('model-list');
  const bounds = list.getBoundingClientRect();
  const item = row.getBoundingClientRect();
  if (item.top < bounds.top) list.scrollTop += item.top - bounds.top;
  else if (item.bottom > bounds.bottom) list.scrollTop += item.bottom - bounds.bottom;
}

function onLongPress(element, action, acceptsTarget = () => true) {
  let press;
  let consumed = false;
  const cancel = () => { clearTimeout(press?.timer); press = null; };
  element.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0 || !acceptsTarget(event.target)) return;
    consumed = false;
    cancel();
    press = {id: event.pointerId, x: event.clientX, y: event.clientY};
    press.timer = setTimeout(() => {
      consumed = true;
      cancel();
      action();
    }, 450);
  });
  element.addEventListener('pointermove', event => {
    if (press?.id === event.pointerId && Math.hypot(event.clientX - press.x, event.clientY - press.y) > 8) cancel();
  });
  for (const event of ['pointerup', 'pointercancel', 'pointerleave']) element.addEventListener(event, cancel);
  element.addEventListener('contextmenu', event => event.preventDefault());
  element.addEventListener('click', event => {
    if (consumed && event.detail) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, true);
}

function inspectorLines(model, details = {}) {
  const {kind} = details;
  const item = details.models?.find(entry => entry.id === model.id || entry.model === model.id) ?? {};
  const format = value => value.toLocaleString(undefined, {maximumFractionDigits: 8});
  const number = detailNumber;
  const lines = [];
  const limits = [
    ['Context', item.context_length ?? item.context_limit ?? item.context_window],
    ['Max input', item.input_token_limit ?? item.inputTokenLimit],
    ['Max output', item.output_token_limit ?? item.outputTokenLimit ?? item.max_output_tokens ?? item.top_provider?.max_completion_tokens]
  ].flatMap(([label, value]) => number(value) > 0 ? [label + ' ' + format(number(value))] : []);
  if (limits.length) lines.push(limits.join(' · ') + ' tokens');
  const input = item.architecture?.input_modalities ?? item.input_modalities;
  const output = item.architecture?.output_modalities ?? item.output_modalities ?? model.modalities;
  const inputs = model.imageOnly ? ['text prompt'] : Array.isArray(input) ? input
    : ['text', ...['image', 'pdf'].filter(type => model.input?.[type] === true)];
  lines.push('Input · ' + inputs.join(', ') + ' · Image generation '
    + (model.imageOnly || output?.includes?.('image') || item.endpoints?.includes?.('images') ? 'yes'
      : Array.isArray(output) ? 'no' : 'unreported'));
  const price = item.pricing ?? {};
  const rates = (fields, factor, prefix, unit) => fields.flatMap(([label, value]) =>
    number(value) === null ? [] : [label + ' ' + prefix + format(number(value) * factor)])
    .join(' · ') + unit;
  if (model.profile.id === demoProfileId || price.free === true) {
    lines.push('Free tier');
  } else if (kind === 'kenari' && model.imageOnly) {
    const prices = (Array.isArray(item.pricing_lines) ? item.pricing_lines : [])
      .filter(rate => rate?.endpoint === 'images' && number(rate.micro_idr) !== null);
    if (prices.length) lines.push(...prices.map(rate => 'Rp ' + format(number(rate.micro_idr) / 1_000_000)
      + ' / ' + (rate.unit || 'image') + (rate.variant ? ' · ' + rate.variant : '')));
  } else if (kind === 'kenari' && [price.input, price.output, price.cache_read].some(v => number(v) !== null)) {
    lines.push(rates([['In', price.input], ['Out', price.output], ['Cache', price.cache_read]], 1 / 1_000_000, 'Rp ', ' / 1M tokens'));
  } else if (kind === 'routr') {
    const fields = [['In', item.input_rate], ['Out', item.output_rate], ['Cache', item.cache_rate]];
    if (fields.some(([, value]) => number(value) !== null)) lines.push(rates(fields, 1, '', ' credits/token'));
    const minimum = number(item.per_request_floor_credits ?? item.min_charge_credits);
    if (minimum !== null) lines.push('Minimum ' + format(minimum) + ' credits/request');
  } else if (kind === 'openrouter' || kind === 'apimurah') {
    const fields = [['In', price.prompt], ['Out', price.completion], ['Cache', price.input_cache_read]];
    if (fields.some(([, value]) => number(value) !== null)) lines.push(rates(fields, 1_000_000, '$', ' / 1M tokens'));
    if (number(price.request) > 0) lines.push('$' + format(number(price.request)) + ' / request');
    if (number(price.image) > 0) lines.push('$' + format(number(price.image)) + ' / image input');
  }
  return lines;
}

function updateInspectorTestLabel(model) {
  const name = modelFailure(model) ? 'Retest model' : 'Test response';
  const button = find('inspector-test');
  button.hidden = model.connection?.type === 'factory';
  button.setAttribute('aria-label', name);
  button.title = name + '. Provider charges may apply.';
}

async function inspectModel(model) {
  if (inspectorProbe && inspectedModel?.selection === model.selection) return;
  closeModelInspector();
  inspectedModel = model;
  find('model-inspector').hidden = false;
  modelDialog.classList.add('is-inspecting');
  limitInspectorModelList();
  find('inspector-result').textContent = modelFailure(model) ? 'Last test failed. Tap ▶ to retest before using this model.' : '';
  find('inspector-test').disabled = sending;
  updateInspectorTestLabel(model);
  const lines = find('inspector-lines');
  const render = (details, status) => {
    const rows = inspectorLines(model, details);
    if (status) rows.push(status);
    clearContents(lines);
    lines.append(...rows.map(row => {
      const item = document.createElement('span');
      item.textContent = row;
      return item;
    }));
  };
  if (model.profile.id === demoProfileId || model.connection?.type === 'factory') { render({}); return; }
  render({}, 'Loading provider details…');
  try {
    const details = await localApi('provider-details', {connection: model.connection.id, model: model.id});
    if (inspectedModel === model) {
      const rows = inspectorLines(model, details);
      const billing = rows.some(row => /[$]|\bRp |credits\/token|Free tier/.test(row));
      render(details, billing ? '' : 'Pricing not reported by this provider.');
    }
  } catch {
    if (inspectedModel === model) render({}, 'Provider details unavailable.');
  }
}

find('inspector-test').onclick = async () => {
  const model = inspectedModel;
  if (!model || inspectorProbe || sending) return;
  const retest = !!modelFailure(model);
  const controller = new AbortController();
  inspectorProbe = controller;
  const result = find('inspector-result');
  find('inspector-test').disabled = true;
  result.textContent = 'Testing…';
  let responded = false;
  try {
    const image = model.imageOnly || model.modalities?.includes('image');
    const stats = await receiveReply({connection: model.connection.id, model: model.id,
      messages: [{role: 'user', content: image ? 'Generate a simple blue circle on a white background.' : 'Reply with OK.'}]
    }, event => {
      if (!responded) responded = event.type === 'delta' ? !!event.text.trim()
        : event.type === 'image' && !!replyImageSource(event.text);
    }, controller.signal);
    if (!responded) throw new Error('No usable response.');
    if (inspectorProbe === controller) {
      recordModelTest(model.connection, model.id, true);
      result.textContent = 'Responded · ' + (stats.durationMs / 1000).toFixed(2) + ' s'
        + (retest ? ' · Select the model to use it.' : '');
    }
  } catch (error) {
    if (inspectorProbe === controller) {
      recordModelTest(model.connection, model.id, false);
      result.textContent = 'Test failed · ' + error.message + ' Tap ▶ to retest.';
    }
  } finally {
    if (inspectorProbe === controller) {
      inspectorProbe = null;
      const list = find('model-list');
      const scroll = list.scrollTop;
      updateInspectorTestLabel(model);
      updateModelStatus();
      renderModels();
      list.scrollTop = scroll;
      const row = list.querySelector('.is-retest-target');
      if (row) keepModelRowVisible(row);
      updateChatCredit(currentModel(), true);
    }
  }
};

    button.setAttribute('aria-label', profile.name + ' • ' + count + (count === 1 ? ' model' : ' models'));

}

function releaseDraftConnection() {
  const id = draft?.connectionId;
  if (!id || profiles.some(profile => profile.connectionId === id)) return;
  connections.delete(id);
  localApi('disconnect', {connection: id}).catch(() => {});
}

function editProvider(profile) {
  releaseDraftConnection();
  editingId = profile?.id ?? null;
  draft = profile ? {...profile, hidden: new Set(profile.hidden)} : null;
  typeInput.value = profile?.type ?? 'openrouter';
  nameInput.value = profile?.name ?? 'OpenRouter';
  baseInput.value = profile?.base ?? presets.openrouter;
  factoryKind.value = profile?.factoryTarget?.kind ?? 'environment';
  factoryId.value = profile?.factoryTarget?.id ?? '';
  keyInput.value = '';
  find('provider-model-search').value = '';
  modelTests.clear();
  find('provider-status').textContent = '';
  refreshSettings();
}

function matchesDraftFields() {
  return draft?.type === typeInput.value
    && draft.base === baseInput.value.trim().replace(/\/+$/, '')
    && (draft.type !== 'factory' || (draft.factoryTarget?.kind === factoryKind.value
      && draft.factoryTarget?.id === factoryId.value.trim()));
}

function detailNumber(value) {
  if (typeof value !== 'number' && (typeof value !== 'string' || !value.trim())) return null;
  const number = Number(value);
  return Number.isFinite(number) && number >= 0 ? number : null;
}

function refreshSettings() {
  baseInput.readOnly = typeInput.value !== 'custom';
  const factory = typeInput.value === 'factory';
  find('factory-fields').hidden = !factory;
  factoryId.required = factory;
  factoryId.placeholder = factoryKind.value === 'computer' ? 'Computer ID' : 'Environment ID';
  find('test-model').hidden = factory;
  const matches = matchesDraftFields();
  const deferredKey = keyInput.value.trim() !== '';
  const connected = matches && connections.has(draft.connectionId);
  const savedKey = connected && connections.get(draft.connectionId).saved === true;
  keyInput.dataset.savedKey = String(savedKey);
  keyInput.placeholder = savedKey ? '••••••••••••••••'
    : connected ? 'Reuse connected key' : 'Enter your provider key';
  find('provider-key-hint').textContent = savedKey
    ? 'Saved API key in use. Type a new key to replace it.' : '';
  find('save-provider').disabled = configuring || !connected || deferredKey;
  find('disconnect-provider').hidden = !connected;
  find('disconnect-provider').parentElement.classList.toggle('is-connected', connected);
  renderSavedProviders();
  renderProviderModels();
  find('provider-models').hidden = !matches;
  updateModelStatus();
}

async function settingsRequest(message, action) {
  if (configuring) return;
  configuring = true;
  for (const control of form.elements) control.disabled = true;
  const status = find('provider-status');
  status.textContent = message;
  try {
    status.textContent = await action();
  } catch (error) {
    status.textContent = error.message;
  } finally {
    for (const control of form.elements) control.disabled = false;
    configuring = false;
    refreshSettings();
  }
}

function connect() {
  if (!form.reportValidity()) return;
  const input = {
    type: typeInput.value, base: baseInput.value, key: keyInput.value,
    connection: matchesDraftFields() ? draft.connectionId : undefined
  };
  if (input.type === 'factory') {
    input.factoryTarget = {kind: factoryKind.value, id: factoryId.value.trim()};
    input.connection = draft?.type === 'factory' ? draft.connectionId : undefined;
  }
  settingsRequest(input.type === 'factory' ? 'Checking Factory target…' : 'Loading provider models…', async () => {
    const connection = await localApi('connect', input);
    const hidden = matchesDraftFields() ? draft.hidden : new Set();
    releaseDraftConnection();
    connections.set(connection.id, connection);
    draft = {...connection, connectionId: connection.id, hidden};
    baseInput.value = connection.base;
    keyInput.value = '';
    modelTests.clear();
    return input.type === 'factory' ? 'Factory target verified. Save to use Droid in chat.'
      : 'Choose models, then save this provider.';
  });
}

find('save-provider').onclick = () => {
  if (!matchesDraftFields() || !connections.has(draft.connectionId) || keyInput.value.trim()) return;
  const index = profiles.findIndex(profile => profile.id === editingId);
  const previous = profiles[index];
  const saved = {
    id: previous?.id ?? newId(),
    name: nameInput.value.trim() || draft.name,
    type: draft.type, base: draft.base, models: draft.models,
    hidden: [...draft.hidden], connectionId: draft.connectionId
  };
  if (draft.factoryTarget) saved.factoryTarget = draft.factoryTarget;
  settingsRequest('Saving provider…', async () => {
    const connection = await localApi('save', {connection: saved.connectionId});
    connections.set(connection.id, connection);
    const next = [...profiles];
    if (index === -1) next.push(saved);
    else next[index] = saved;
    saveProfiles(next);
    editingId = saved.id;
    draft = {...saved, hidden: new Set(saved.hidden)};
    nameInput.value = saved.name;
    if (previous?.connectionId && previous.connectionId !== saved.connectionId
        && connections.has(previous.connectionId)) {
      await localApi('disconnect', {connection: previous.connectionId});
      connections.delete(previous.connectionId);
    }
    return 'Saved ' + saved.name + '.';
  });
};

let inlineEdit;
let chatViewVersion = 0;
let loadingChatImages = false;

function branchDepth(chat) {
  if (Number.isSafeInteger(chat.branchDepth) && chat.branchDepth > 0) return chat.branchDepth;
  if (chat.branchFrom || chat.title?.endsWith(' (branch)')) return 1;
  return 0;
}

function branchPrefix(chat, filename = false) {
  const depth = branchDepth(chat);
  if (!depth) return '';
  if (filename && depth > 30) return '•＞'.repeat(30) + '… ';
  return (filename ? '•＞' : '•>').repeat(depth) + ' ';
}

async function showChat(chat, credits = false, preserveDraft = false, preserveAttachments = false) {
  const view = ++chatViewVersion;
  loadingChatImages = false;
  if (!preserveAttachments) {
    attachments = [];
    attachmentVersion++;
  }
  renderAttachments();
  showChatError('');
  activeId = chat?.id ?? null;
  inlineEdit = null;
  clearContents(messages);
  if (!preserveDraft) promptBox.value = '';
  updateComposerButton(currentModel());
  reset.disabled = sending;
  empty.classList.toggle('credits-view', credits);
  empty.setAttribute('aria-hidden', String(!credits));
  empty.querySelector('#creator-credits').hidden = !credits;
  if (!chat) {
    syncModelHandoff(currentModel());
    messages.append(empty);
    return;
  }
  if (chat.turns.some(turn => turn.imageKey && !replyImages.has(turn))) {
    loadingChatImages = true;
    await loadChatImages(chat);
    if (view !== chatViewVersion) return;
    loadingChatImages = false;
  }
  if (branchDepth(chat)) chat.branchAt ??= chat.turns.length;
  const branchAt = chat.branchAt ?? -1;
  for (const [index, turn] of chat.turns.entries()) {
    if (turn.handoff) showCompletedHandoff(turn.handoff);
    showTurn(turn, messages, chat);
    if (index + 1 === branchAt) {
      const notice = document.createElement('small');
      notice.className = 'branch-notice';
      notice.textContent = branchPrefix(chat) + (chat.branchFrom ? 'Branched from ' + chat.branchFrom : 'Branch chat');
      messages.append(notice);
    }
  }
  syncModelHandoff(currentModel());
  messages.scrollTop = messages.scrollHeight;
}

function handoffModelLabel(model) {
  return model.name + ' · ' + model.profile.name;
}

function previousHandoffModel(chat, last, available) {
  if (last.modelSelection) return available.find(model => model.selection === last.modelSelection);
  return available.find(model => model.profile.id === chat.source && model.name === last.model);
}

function syncModelHandoff(model) {
  if (sending) return;
  const chat = activeId && chats.find(item => item.id === activeId);
  const last = chat?.turns[chat.turns.length - 1];
  const same = last?.modelSelection ? last.modelSelection === model?.selection
    : last?.model === model?.name && chat?.source === model?.profile.id;
  if (!model?.connection || !last || same) {
    pendingHandoff?.summaryRequest?.abort();
    pendingHandoff?.element?.remove();
    pendingHandoff = null;
    return;
  }
  if (pendingHandoff?.chat === chat && pendingHandoff.last === last && pendingHandoff.to.selection === model.selection) {
    if (!pendingHandoff.element.isConnected) messages.append(pendingHandoff.element);
    return;
  }
  pendingHandoff?.summaryRequest?.abort();
  pendingHandoff?.element?.remove();
  const from = previousHandoffModel(chat, last, savedModels());
  const previousProvider = last.providerName ?? from?.profile.name
    ?? profiles.find(profile => profile.id === chat.source)?.name;
  const handoff = {chat, last, from, to: model, mode: 'summary', level: 2, summaries: new Map(),
    summarizer: canSummarize(model) ? 'to' : 'from',
    fromLabel: [last.model || 'Previous model', previousProvider].filter(Boolean).join(' · '),
    toLabel: handoffModelLabel(model), image: findHandoffImage(chat, model)};
  pendingHandoff = handoff;
  renderPendingHandoff(handoff);
  messages.scrollTop = messages.scrollHeight;
  if (model.profile.id === demoProfileId) return;
  localApi('provider-details', {connection: model.connection.id, model: model.id}).then(details => {
    if (pendingHandoff !== handoff) return;
    const item = details.models?.find(entry => entry.id === model.id);
    handoff.tokenLimit = detailNumber(item?.input_token_limit ?? item?.inputTokenLimit
      ?? item?.context_length ?? item?.context_limit ?? item?.context_window);
    if (handoff.mode === 'full') updateHandoffDescription(handoff);
  }).catch(() => {});
}

function handoffModeName(mode, retain) {
  if (mode === 'summary' && retain != null) {
    return handoffLevels.find(level => level.retain === retain)?.label ?? 'Summary';
  }
  return {summary: 'Summary', full: 'Full history', fresh: 'Fresh start'}[mode];
}

function showCompletedHandoff(handoff) {
  const detail = document.createElement('details');
  detail.className = 'model-handoff';
  const heading = document.createElement('summary');
  const mode = handoffModeName(handoff.mode, handoff.retain) + (handoff.image ? ' + 1 image' : '');
  heading.textContent = handoff.fromLabel + ' → ' + handoff.toLabel + ' · ' + mode;
  const context = document.createElement('p');
  detail.append(heading);
  if (handoff.summary) {
    context.textContent = handoff.summary;
  } else {
    context.textContent = handoff.mode === 'full' ? 'Earlier conversation shared' : 'No earlier context shared';
  }
  detail.append(context);
  messages.append(detail);
}

function findHandoffImage(chat, model) {
  if (model.imageOnly || model.connection.models.find(item => item.id === model.id)?.input?.image !== true) return null;
  for (let turn = chat.turns.length - 1; turn >= 0; turn--) {
    const images = replyImages.get(chat.turns[turn]) ?? [];
    for (let image = images.length - 1; image >= 0; image--) {
      const info = replyImageInfo(images[image]);
      if (info && info.bytes <= 5_000_000) return {turn, image};
    }
  }
  return null;
}

function handoffImageFile(turns, reference, model) {
  if (!reference || !acceptsFile({kind: 'image'}, model)) return null;
  const source = replyImages.get(turns[reference.turn])?.[reference.image];
  const info = source && replyImageInfo(source);
  if (!info) return null;
  return {name: 'Previous generated image.' + (info.format === 'jpeg' ? 'jpg' : info.format),
    kind: 'image', mime: info.mime, size: info.bytes, data: source.slice(info.offset)};
}

function historyMessages(turns, model, includeFiles) {
  return turns.flatMap(turn => [
    {role: 'user', content: turn.question, ...(includeFiles && {
      files: (turnFiles.get(turn) ?? []).filter(file => acceptsFile(file, model))
    })},
    ...(turn.reply ? [{role: 'assistant', content: turn.reply}] : [])
  ]);
}

function handoffPrefix(turns, handoff, model) {
  const previous = handoff.mode === 'full' ? historyMessages(turns, model, true) : [];
  if (handoff.mode === 'summary') {
    previous.push({role: 'user', content: 'Context from the previous conversation:\n\n' + handoff.summary});
  }
  const image = handoffImageFile(turns, handoff.image, model);
  if (image) previous.push({role: 'user', content: 'Reference image from the previous conversation.', files: [image]});
  return previous;
}

function effectiveHistory(turns, model) {
  let boundary = turns.length - 1;
  while (boundary >= 0 && !turns[boundary].handoff) boundary--;
  if (boundary < 0) return historyMessages(turns, model, true);
  const handoff = turns[boundary].handoff;
  const prior = handoff.mode === 'full' ? historyMessages(turns.slice(0, boundary), model, true)
    : handoffPrefix([], {...handoff, image: null}, model);
  const image = handoffImageFile(turns, handoff.image, model);
  if (image) prior.push({role: 'user', content: 'Reference image from the previous conversation.', files: [image]});
  return [...prior, ...historyMessages(turns.slice(boundary), model, true)];
}

function estimateHandoffTokens(previous, text = '') {
  return Math.ceil((previous.reduce((size, message) => size + message.content.length, text.length)) / 3)
    + (previous.length + 1) * 6;
}

function updateHandoffDescription(handoff) {
  const status = handoff.description;
  if (!status) return;
  if (handoff.mode !== 'full' || !(handoff.tokenLimit > 0)) {
    status.textContent = '';
    return;
  }
  const previous = historyMessages(handoff.chat.turns, handoff.to, false);
  const estimate = estimateHandoffTokens(previous, promptBox.value);
  status.textContent = estimate > handoff.tokenLimit
    ? 'Full history exceeds the estimated input budget. Choose Summary or Fresh start.' : '';
}

function lockSummaryEditor(editor) {
  let taps = 0;
  let lastTap = -Infinity;
  const lock = () => {
    editor.readOnly = true;
    editor.inputMode = 'none';
    taps = 0;
    lastTap = -Infinity;
  };
  const unlock = () => {
    editor.readOnly = false;
    editor.inputMode = 'text';
    editor.focus();
  };
  editor.onpointerdown = event => { if (editor.readOnly) event.preventDefault(); };
  editor.onclick = () => {
    if (!editor.readOnly) return;
    const now = performance.now();
    taps = now - lastTap <= 650 ? taps + 1 : 1;
    lastTap = now;
    if (taps === 3) unlock();
  };
  editor.onkeydown = event => {
    if (!editor.readOnly || event.key !== 'Enter') return;
    event.preventDefault();
    unlock();
  };
  editor.onblur = lock;
  lock();
}

function renderPendingHandoff(handoff) {
  const card = handoff.element ?? (handoff.element = document.createElement('section'));
  card.className = 'model-handoff';
  card.setAttribute('aria-label', 'Model handoff');
  const models = document.createElement('div');
  models.className = 'model-handoff-models';
  const arrow = document.createElement('span');
  arrow.textContent = '→';
  arrow.setAttribute('aria-hidden', 'true');
  if (!canSummarize(handoff[handoff.summarizer]) && canSummarize(handoff.to)) handoff.summarizer = 'to';
  if (!canSummarize(handoff[handoff.summarizer]) && canSummarize(handoff.from)) handoff.summarizer = 'from';
  const modelButtons = [['from', handoff.fromLabel, 'Previous'], ['to', handoff.toLabel, 'New']]
    .map(([side, name, position]) => {
      const button = historyButton(name, () => {
        handoff.summarizer = side;
        feedback.textContent = '';
        refreshButtons();
      });
      button.setAttribute('aria-label', position + ' model for summary · ' + name);
      button.title = position + ' model for summary';
      return [side, button];
    });
  models.append(modelButtons[0][1], arrow, modelButtons[1][1]);
  const controls = document.createElement('div');
  controls.className = 'model-handoff-controls';
  const scale = document.createElement('div');
  scale.className = 'model-handoff-scale';
  const stops = handoffLevels.map(level => {
    const dot = document.createElement('span');
    dot.className = 'model-handoff-stop';
    dot.style.setProperty('--dot-fill', level.retain + '%');
    dot.setAttribute('aria-hidden', 'true');
    return dot;
  });
  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = '0';
  slider.max = String(handoffLevels.length - 1);
  slider.step = '1';
  slider.value = String(handoff.level);
  slider.setAttribute('aria-label', 'Conversation context level');
  scale.append(...stops, slider);
  const editor = document.createElement('textarea');
  editor.setAttribute('aria-label', 'Summary to send');
  editor.setAttribute('aria-description', 'Tap three times or press Enter to edit.');
  editor.title = 'Tap three times to edit';
  editor.maxLength = 24_000;
  editor.rows = 3;
  editor.oninput = () => { handoff.summaries.set(handoff.level, editor.value); };
  lockSummaryEditor(editor);
  const feedback = document.createElement('p');
  feedback.setAttribute('role', 'status');
  const generate = historyButton('', () => {
    if (!handoff.summaries.has(handoff.level)) handoff.summaries.set(handoff.level, '');
    refreshLevel();
    messages.scrollTop = messages.scrollHeight;
    generateHandoffSummary(handoff, editor, feedback, refreshButtons);
  });
  generate.className = 'model-handoff-generate';
  const generateIcon = document.createElement('span');
  generateIcon.setAttribute('aria-hidden', 'true');
  generate.append(generateIcon);
  generate.setAttribute('aria-label', 'Generate summary');
  generate.title = 'Generate summary with the selected model';
  controls.append(scale, generate);
  function refreshButtons() {
    for (const [side, button] of modelButtons) {
      const available = canSummarize(handoff[side]);
      button.setAttribute('aria-pressed', String(handoff.mode === 'summary' && available && handoff.summarizer === side));
      button.disabled = handoff.mode !== 'summary' || !available || !!handoff.summaryRequest;
    }
    generate.disabled = handoff.mode !== 'summary' || !canSummarize(handoff[handoff.summarizer]) || !!handoff.summaryRequest;
    editor.disabled = !!handoff.summaryRequest;
  }
  const status = document.createElement('p');
  handoff.description = status;
  const imageLabel = document.createElement('label');
  const check = document.createElement('input');
  check.type = 'checkbox';
  check.checked = !!handoff.includeImage;
  check.onchange = () => { handoff.includeImage = check.checked; };
  imageLabel.append(check, 'Include latest generated image');
  function refreshLevel() {
    const level = handoffLevels[handoff.level];
    slider.setAttribute('aria-valuetext', level.label);
    for (const [index, dot] of stops.entries()) dot.classList.toggle('is-current', index === handoff.level);
    editor.hidden = level.mode !== 'summary' || !handoff.summaries.has(handoff.level);
    editor.value = handoff.summaries.get(handoff.level) ?? '';
    imageLabel.hidden = level.mode === 'fresh' || !handoff.image;
    updateHandoffDescription(handoff);
    refreshButtons();
  }
  slider.oninput = () => {
    handoff.summaryRequest?.abort();
    handoff.summaryRequest = null;
    handoff.level = Number(slider.value);
    handoff.mode = handoffLevels[handoff.level].mode;
    feedback.textContent = '';
    refreshLevel();
  };
  clearContents(card);
  card.append(controls, models, status, editor, feedback, imageLabel);
  refreshLevel();
  if (!card.isConnected) messages.append(card);
}

function canSummarize(model) {
  return !!model?.connection && model.connection.type !== 'factory' && !model.imageOnly && !modelFailure(model)
    && (!Array.isArray(model.modalities) || model.modalities.includes('text'));
}

function summaryTranscript(turns) {
  return turns.flatMap(turn => {
    const attachments = turn.files?.length ? '\n\n[Attachments: ' + turn.files.join(', ') + ']' : '';
    const images = turn.imageCount ? '\n\n[Generated ' + turn.imageCount + (turn.imageCount === 1 ? ' image]' : ' images]') : '';
    const reply = ((turn.reply ?? '') + images).trim();
    return [
      {role: 'user', content: (turn.question ?? '') + attachments},
      ...(reply ? [{role: 'assistant', content: reply}] : [])
    ];
  });
}

async function generateHandoffSummary(handoff, editor, status, refreshButtons) {
  if (sending || handoff.summaryRequest || pendingHandoff !== handoff) return;
  const model = handoff[handoff.summarizer];
  if (!canSummarize(model)) return;
  const level = handoffLevels[handoff.level];
  const messages = summaryTranscript(handoff.chat.turns);
  const words = messages.reduce((total, message) => total + (message.content.match(/\S+/g)?.length ?? 0), 0);
  const targetWords = Math.min(4_000, Math.max(8, Math.round(words * level.retain / 100)));
  messages.push({role: 'user', content: 'Summarize the entire conversation above for the next assistant. Identify the actual '
    + 'topics and what was explained or concluded, with enough concrete facts to answer a follow-up. Include relevant '
    + 'constraints, decisions, and open questions. Preserve useful image descriptions already in the text. '
    + 'Aim for about ' + targetWords + ' words, roughly ' + level.retain + '% of the original conversation length. '
    + 'Do not answer prior questions, introduce yourself, or describe the environment. '
    + 'Start with HANDOFF_SUMMARY: on its own line, then write the summary.'});
  const payload = {connection: model.connection.id, model: model.id, messages, textOnly: true};
  if (new Blob([JSON.stringify(payload)]).size > 12_000_000) {
    status.textContent = 'This conversation is too large to summarize in one request. Write a handoff or choose Fresh start.';
    return;
  }
  const controller = new AbortController();
  handoff.summaryRequest = controller;
  refreshButtons();
  status.textContent = 'Generating with ' + handoffModelLabel(model) + '…';
  let summary = '';
  try {
    await receiveReply(payload, event => { if (event.type === 'delta') summary += event.text; }, controller.signal);
    const heading = /^\s*(?:#{1,6}\s*)?(?:\*\*)?HANDOFF_SUMMARY\s*:(?:\*\*)?\s*/i;
    if (!heading.test(summary) || !summary.replace(heading, '').trim()) {
      throw new Error('The model did not return a usable handoff. Try the other model or write a summary.');
    }
    summary = summary.replace(heading, '').trim();
    if (summary.length > editor.maxLength) throw new Error('The summary was too long. Write a shorter handoff.');
    if (handoff.summaryRequest !== controller || pendingHandoff !== handoff) return;
    handoff.summaries.set(handoff.level, summary);
    editor.value = summary;
    status.textContent = '';
  } catch (error) {
    if (!controller.signal.aborted) status.textContent = error.message;
  } finally {
    if (handoff.summaryRequest === controller) {
      handoff.summaryRequest = null;
      refreshButtons();
    }
  }
}

function prepareModelRequest(chat, model, text, files, handoff, savedBoundary, editing = false) {
  const turns = chat?.turns ?? [];
  let boundary = savedBoundary;
  if (handoff) {
    if (handoff.summaryRequest) throw new Error('Wait for the summary before sending.');
    const summary = handoff.mode === 'summary' ? (handoff.summaries.get(handoff.level) ?? '').trim() : '';
    if (handoff.mode === 'summary' && !summary) {
      throw new Error('Generate or write a summary, or choose Full history or Fresh start.');
    }
    boundary = {mode: handoff.mode, fromLabel: handoff.fromLabel, toLabel: handoff.toLabel};
    if (summary) {
      boundary.summary = summary;
      boundary.retain = handoffLevels[handoff.level].retain;
    }
    if (handoff.mode !== 'fresh' && handoff.includeImage) {
      if (!handoffImageFile(turns, handoff.image, model)) {
        throw new Error('The reference image is no longer available. Uncheck Include image to continue.');
      }
      boundary.image = handoff.image;
    }
  }
  const previous = boundary ? handoffPrefix(turns, boundary, model) : effectiveHistory(turns, model);
  const prompt = model.imageOnly
    ? (previous.length ? 'Use this previous conversation as context for the next image prompt:\n'
      + JSON.stringify(previous.map(({role, content}) => ({role, content}))) + '\n\nNew image prompt:\n' + text : text)
    : model.connection.type === 'factory' ? text : promptWithVisualFormats(text);
  const messages = [...(model.imageOnly ? [] : previous), {role: 'user', content: prompt, files}];
  if (handoff?.tokenLimit > 0 && estimateHandoffTokens(model.imageOnly ? [] : previous, prompt) > handoff.tokenLimit) {
    throw new Error('This request exceeds the estimated input budget. Use a shorter summary or Fresh start.');
  }
  const bytes = messages.reduce((sum, message) =>
    sum + (message.files ?? []).reduce((size, file) => size + file.size, 0), 0);
  if (bytes > 6_000_000) {
    throw new Error('This request includes more than 6 MB of attachments. Remove draft files or use a shorter handoff.');
  }
  const payload = {connection: model.connection.id, model: model.id, messages};
  if (model.connection.type === 'factory') {
    const previousFactory = turns.at(-1)?.stats;
    if (!editing && !boundary && previousFactory?.factoryConnection === model.connection.id
        && typeof previousFactory.factorySession === 'string') {
      payload.factorySession = previousFactory.factorySession;
      payload.messages = [messages.at(-1)];
    }
  }
  if (new Blob([JSON.stringify(payload)]).size > 12_000_000) {
    throw new Error('This request is too large. Use a shorter summary or Fresh start.');
  }
  return {payload, boundary};
}

function attachSwipeGesture(row, button, actions, thresholds = {}, horizontalLock = false) {
  let start = null;
  let dragging = false;
  let suppressClick = false;

  button.onpointerdown = event => {
    if (!event.isPrimary || event.button !== 0 || event.target.closest('.inline-message-edit')) return;
    start = {id: event.pointerId, x: event.clientX, y: event.clientY};
    dragging = false;
    suppressClick = false;
    if (horizontalLock) button.setPointerCapture(event.pointerId);
  };

  button.onpointermove = event => {
    if (start?.id !== event.pointerId) return;
    const dx = event.clientX - start.x;
    const dy = event.clientY - start.y;
    const vertical = !(horizontalLock && dragging) && Math.abs(dy) >= Math.abs(dx);
    const direction = vertical ? (dy < 0 ? 'up' : 'down') : (dx < 0 ? 'left' : 'right');
    if (!dragging) {
      const slop = horizontalLock ? 5 : 8;
      if (vertical && !actions.up && Math.abs(dy) > slop) {
        if (!horizontalLock || Math.abs(dy) > Math.abs(dx) * 1.5) start = null;
        return;
      }
      if (Math.max(Math.abs(dx), actions.up ? Math.abs(dy) : 0) < slop) return;
      dragging = true;
      suppressClick = true;
      if (!horizontalLock) button.setPointerCapture(event.pointerId);
      row.classList.add('dragging');
    }
    row.dataset.swipe = actions[direction] ? direction : '';
    const offset = actions[direction] && !vertical ? dx : 0;
    if (horizontalLock) {
      const distance = Math.abs(offset);
      const reveal = 48;
      const travel = Math.min(96, Math.min(reveal, distance) + Math.max(0, distance - reveal) * .38);
      row.style.setProperty('--swipe-progress', Math.min(1, distance / reveal));
      button.style.setProperty('--swipe-x', Math.sign(offset) * travel + 'px');
    } else {
      button.style.setProperty('--swipe-x', Math.max(-96, Math.min(96, offset)) + 'px');
    }
  };

  function finish(event, commit) {
    if (start?.id !== event.pointerId) return;
    const dx = event.clientX - start.x;
    const dy = event.clientY - start.y;
    const vertical = !(horizontalLock && dragging) && Math.abs(dy) >= Math.abs(dx);
    const direction = vertical ? (dy < 0 ? 'up' : 'down') : (dx < 0 ? 'left' : 'right');
    let threshold = thresholds[direction] ?? 64;
    if (horizontalLock && !vertical) {
      const edgeDistance = dx > 0 ? document.documentElement.clientWidth - start.x : start.x;
      threshold = Math.min(threshold, Math.max(10, edgeDistance * .7));
    }
    const shouldOpen = commit && dragging && Math.abs(vertical ? dy : dx) >= threshold;
    start = null;
    dragging = false;
    row.classList.remove('dragging');
    delete row.dataset.swipe;
    if (horizontalLock) row.style.removeProperty('--swipe-progress');
    button.style.removeProperty('--swipe-x');
    if (shouldOpen) actions[direction]?.();
  }

  button.onpointerup = event => finish(event, true);
  button.onpointerleave = event => { if (!horizontalLock && !dragging) finish(event, false); };
  button.onpointercancel = event => finish(event, false);
  button.onlostpointercapture = event => finish(event, false);
  row.addEventListener('click', event => {
    if (!suppressClick || event.detail === 0) return;
    suppressClick = false;
    event.preventDefault();
    event.stopPropagation();
  }, true);

  button.onkeydown = event => {
    if (event.target.closest('.inline-message-edit')) return;
    const action = event.key === 'ArrowLeft' ? actions.left : event.key === 'ArrowRight' ? actions.right
      : event.key === 'ArrowUp' ? actions.up : null;
    if (!action) return;
    event.preventDefault();
    action();
  };
}

function matchingHistory() {
  const query = historySearch.value.trim().toLowerCase();
  return !query ? chats : chats.filter(chat =>
    chat.title.toLowerCase().includes(query) || chat.turns.some(turn =>
      [turn.question, turn.reply, ...(turn.files ?? [])].some(value =>
        typeof value === 'string' && value.toLowerCase().includes(query))));
}

function updateHistorySelection() {
  const count = chats.length + (chats.length === 1 ? ' chat' : ' chats');
  find('history-count').textContent = count + (selectingHistory ? ' · ' + selectedHistory.size + ' selected' : '');
  const shown = [...historyList.querySelectorAll('button[data-chat]')];
  const all = shown.length > 0 && shown.every(button => selectedHistory.has(button.dataset.chat));
  historyToggleAll.hidden = historyDeleteSelected.hidden = historyExportSelected.hidden = !selectingHistory;
  historyToggleAll.disabled = !shown.length;
  historyToggleAll.setAttribute('aria-label', all ? 'Deselect shown chats' : 'Select all shown chats');
  historyToggleAll.title = historyToggleAll.getAttribute('aria-label');
  historyToggleAll.textContent = all ? '☐' : '☑';
  historyDeleteSelected.disabled = historyExportSelected.disabled = !selectedHistory.size;
  for (const button of shown) {
    if (selectingHistory) button.setAttribute('aria-pressed', String(selectedHistory.has(button.dataset.chat)));
    else button.removeAttribute('aria-pressed');
  }
}

function toggleHistoryChat(id) {
  selectingHistory = true;
  if (selectedHistory.has(id)) selectedHistory.delete(id);
  else selectedHistory.add(id);
  updateHistorySelection();
}

function renderHistory() {
  const matches = matchingHistory();
  clearContents(historyList);
  if (!matches.length) {
    const note = document.createElement('p');
    note.textContent = historySearch.value.trim() ? 'No matching chats.' : 'No saved chats yet. Send a message to start one.';
    historyList.append(note);
  }
  for (const chat of matches) {
    const row = document.createElement('div');
    row.className = 'swipe-row';
    let held = false;
    const open = historyButton(branchPrefix(chat) + chat.title, event => {
      if (held && event.detail) {
        held = false;
        return;
      }
      if (selectingHistory) {
        toggleHistoryChat(chat.id);
        return;
      }
      showChat(chat);
      historyDialog.close();
      promptBox.focus();
    });
    open.className = 'swipe-button';
    open.dataset.chat = chat.id;
    open.title = chat.title;
    if (chat.id === activeId) open.setAttribute('aria-current', 'true');
    open.setAttribute('aria-description', 'Hold to select. Swipe right to rename or left to delete.');
    open.setAttribute('aria-keyshortcuts', 'ArrowRight ArrowLeft Shift+Space');
    row.append(swipeCue(false), swipeCue(true), open);
    attachSwipeGesture(row, open, {
      left: () => { if (!selectingHistory) editChat(chat, true); },
      right: () => { if (!selectingHistory) editChat(chat, false); }
    });
    let timer;
    let origin;
    const cancelHold = () => { clearTimeout(timer); origin = null; };
    const select = () => {
      open.classList.remove('selection-pulse');
      open.classList.add('selection-pulse');
      toggleHistoryChat(chat.id);
    };
    open.addEventListener('animationend', () => open.classList.remove('selection-pulse'));
    open.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0) return;
      held = false;
      if (selectingHistory) return;
      origin = [event.clientX, event.clientY];
      timer = setTimeout(() => {
        held = true;
        select();
      }, 500);
    });
    open.addEventListener('pointermove', event => {
      if (origin && Math.hypot(event.clientX - origin[0], event.clientY - origin[1]) >= 8) cancelHold();
    });
    for (const event of ['pointerup', 'pointercancel', 'pointerleave', 'lostpointercapture']) {
      open.addEventListener(event, cancelHold);
    }
    open.addEventListener('contextmenu', event => event.preventDefault());
    open.addEventListener('keydown', event => {
      if (event.key !== ' ' || !event.shiftKey) return;
      event.preventDefault();
      if (!event.repeat) select();
    });
    historyList.append(row);
  }
  updateHistorySelection();
}

function dismissOnBackdrop(dialog) {
  function isBackdrop(event) {
    if (event.target !== dialog) return false;
    const bounds = dialog.getBoundingClientRect();
    return event.clientX < bounds.left || event.clientX >= bounds.right
      || event.clientY < bounds.top || event.clientY >= bounds.bottom;
  }

  let startedOnBackdrop = false;
  dialog.addEventListener('pointerdown', event => {
    startedOnBackdrop = isBackdrop(event);
  });
  dialog.addEventListener('click', event => {
    if (startedOnBackdrop && isBackdrop(event)) dialog.close();
    startedOnBackdrop = false;
  });
}

function editChat(chat, deleting, selected = [chat]) {
  pendingAction = {chat, deleting, ids: new Set(selected.map(item => item.id))};
  find('chat-action-heading').textContent = deleting ? (selected.length > 1 ? 'Delete chats?' : 'Delete chat?') : 'Rename chat';
  find('rename-field').hidden = deleting;
  const warning = find('delete-message');
  warning.hidden = !deleting;
  warning.textContent = deleting ? (selected.length > 1
    ? 'Delete ' + selected.length + ' selected chats from history?'
    : 'Delete "' + chat.title + '" from chat history?') : '';
  titleInput.required = !deleting;
  titleInput.setCustomValidity('');
  titleInput.value = deleting ? '' : chat.title;
