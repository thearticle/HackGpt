import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins { id 'com.android.application' version '9.0.1' }

abstract class BundleChatUi extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getUiFiles()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void bundle() {
        def directory = outputDirectory.get().asFile.toPath()
        Files.createDirectories(directory)
        uiFiles.each { file ->
            Files.copy(file.toPath(), directory.resolve(file.name), StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

android {
    namespace 'com.neurallink.chat'
    compileSdk 36

    defaultConfig {
        applicationId 'com.thearticle.hackgpt'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '1.0.8'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def bundle = tasks.register('bundle' + variant.name.capitalize() + 'ChatUi', BundleChatUi) {
            uiFiles.from(
                rootProject.file('preview/index.html'),
                rootProject.file('preview/vendor/markdown-it.min.js'),
                rootProject.file('preview/vendor/markdown-it.NOTICES.txt')
            )
            outputDirectory.set(layout.buildDirectory.dir('generated/chat-ui/' + variant.name))
        }
        variant.sources.assets.addGeneratedSourceDirectory(bundle, { task -> task.outputDirectory })
    }
}
